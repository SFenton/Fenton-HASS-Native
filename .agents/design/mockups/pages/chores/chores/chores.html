<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chores · page mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../_chores.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, C = window.Chores;
  var ID = 'chores';
  function page(ctx, o) { return C.page(ctx, ID, o); }
  function section(stage, title) { return stage.querySelector('.ui-section[data-list="' + title + '"]'); }
  function rowOf(stage, title) { return stage.querySelector('.cz-row[data-item="' + title + '"]'); }

  Mock.mount({
    kind: 'page', id: 'chores', title: 'Chores (tab root)', area: 'chores', status: 'shipped',
    summary: 'The Chores tab: Quick Links to Groceries and each list of chores with open counts, then the signed-in resident\'s own chores grouped by Past Due and time of day, as inset lists on the dimmed house photo. Add Task floats at the bottom. Fixture data.',
    source: ['apple/Sources/HassUI/Features/Chores/ChoresScreen.swift', 'apple/Sources/HassUI/Features/Chores/TodoPageView.swift', 'apple/Sources/HassUI/Features/Chores/TodoListSection.swift',
      'apple/Sources/HassUI/Features/Chores/TodoListAlignment.swift', 'apple/Sources/HassUI/Features/Chores/ChoresModel.swift', 'apple/Sources/HassUI/Features/Chores/OverdueChoresBadge.swift',
      'apple/Sources/HassCore/Config/ChoresConfig.swift', 'apple/Sources/HassCore/Todo/TodoItem.swift', 'apple/Sources/HassCore/Todo/TodoRowActions.swift', 'apple/Sources/HassCore/Todo/TodoListController.swift'],
    spec: ['.agents/pages/chores/spec.md', '.agents/pages/chores/ios.md'],
    patterns: ['module-list', 'floating-actions', 'dynamic-grid', 'entity-tile', 'page-backdrop', 'header-edge-fade', 'motion'],
    hig: ['Lists and tables', 'Context menus', 'Tab bars', 'Buttons', 'Dynamic Type', 'Color', 'Motion', 'Loading'],
    entities: ['todo.stephen_s_past_due_with_unassigned', 'todo.stephen_s_evening_with_unassigned', 'todo.stephen_s_no_due_date_with_unassigned', 'todo.stephen_s_upcoming_today_by_time_and_future_with_unassigned',
      'todo.stephen_s_past_due', 'todo.steph_s_past_due', 'todo.unassigned_past_due', 'todo.home_improvement_s_upcoming', 'todo.shopping_list', 'input_boolean.vacation_mode'],
    kitComponents: ['PageSectionHeader', 'TileGrid', 'GlassTile', 'ModuleList', 'InlineAlert', 'ArcSpinner', 'FloatingActionBar', 'Alert', 'TabBar', 'NavigationGlass'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-landscape', 'duo-unfolded-portrait', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'Signed in as Stephen, lists loaded', render: function (d) { return page(d); } },
      'loading': { title: 'First launch, nothing saved: each list spins', note: 'the list entities say there are open items but nothing is fetched yet: header plus a compact arc per list; Quick Links already show counts', render: function (d) { return page(d, { mode: 'loading' }); } },
      'refreshing': { title: 'Saved items on screen, a fetch swaps in', note: 'identical to default by design: TodoItemsCache shows the last items before the first fetch, and rows only move when the list really changed', render: function (d) { return page(d); } },
      'empty': { title: 'Nothing due: "No Chores Due"', note: 'every visible list is settled and hidden; Quick Links stay and read "No tasks listed"', render: function (d) { return page(d, { mode: 'empty' }); } },
      'vacation': { title: 'Vacation Mode on', note: 'same empty state with "Enjoy vacation!" while input_boolean.vacation_mode is on', render: function (d) { return page(d, { mode: 'empty', vacation: true }); } },
      'error': { title: 'A check-off failed and a list failed to load', note: 'inline warning under the list header; the failed check-off returns its row, the failed list keeps its arc', render: function (d) { return page(d, { mode: 'error' }); } },
      'offline': { title: 'No network', note: 'last saved items stay; offline chip under the header and a cloud badge on Profile; check-offs would fail with "Unable to update task"', render: function (d) { return page(d, { connection: 'offline' }); } },
      'reconnecting': { title: 'Connection down 2 s+', note: 'in flight (claude/reconnecting-spinner): arc left of Quick Links; was a "Reconnecting…" chip', render: function (d) { return page(d, { connection: 'reconnecting' }); } },
      'reconnecting-was': { title: 'Reconnecting, today (main)', note: 'the orange chip the arc replaces', render: function (d) { return page(d, { connection: 'reconnecting-chip' }); } },
      'long-text': { title: 'Long task titles wrap, never truncate', note: 'title and due line wrap on the row; the row grows', render: function (d) { return page(d, { long: true }); } },
      'swipe-complete': { title: 'Swipe from the leading edge: Complete', note: 'green; a full swipe performs it', render: function (d) { return page(d, { swipe: 'leading' }); } },
      'swipe-trailing': { title: 'Swipe from the trailing edge: Delete then Edit', note: 'Delete (red) outermost, Edit (blue); a full swipe on Delete asks first', render: function (d) { return page(d, { swipe: 'trailing' }); } },
      'swipe-delete-full': { title: 'Full trailing swipe', render: function (d) { return page(d, { swipe: 'trailing-full' }); } },
      'context-menu': { title: 'Touch and hold a row', note: 'the same actions in swipe order, destructive last', render: function (d) { return page(d, { menu: true }); } },
      'delete-confirm': { title: 'Delete asks first', note: 'confirmationDialog "Delete {title}?" (see the todo-delete-dialog mockup)', render: function (d) { return page(d, { dialog: { title: 'Delete Clean the gutters?', destructive: 'Delete Task' } }); } },
      'viewer-steph': { title: 'Signed in as Steph', note: 'her own lists; the quick link titles swap ("Stephen\'s Chores", "Your Chores"); no Chores badge (nothing past due)', render: function (d) { return page(d, { viewer: 'steph' }); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'one Quick Links column, rows wrap, the Add button full width', render: function (d) { return page(d); } },
    },

    motion: [
      { id: 'row-complete', what: 'Checking a task off: its row leaves the list and the module closes up', token: 'standard 0.3 s smooth (list animation keyed by the page layout); 0.2 s fade under Reduce Motion', state: 'default',
        source: 'HassUI/Features/Chores/TodoPageView.swift motionSafeAnimation(MotionTokens.standard, reduced: .quick); motion.md section 6', reduce: 'the row fades out at 0.2 s (quick) and nothing slides',
        play: function (stage) { var r = rowOf(stage, 'Replace Humidifier Filter'); return r ? C.leave(r).then(function () { return Mock.sleep(500); }) : Promise.resolve(); } },
      { id: 'row-rollback', what: 'The check-off fails (or nothing confirms in 15 s): the row comes back and the list says why', token: 'standard 0.3 s; the alert row appears with it', state: 'default',
        source: 'TodoListController.toggle (optimistic revert, error "Unable to update task"); TodoPageView animation', reduce: 'the row fades back at 0.2 s',
        play: function (stage) {
          var r = rowOf(stage, 'Clean the gutters'), s = section(stage, 'Past Due'); if (!r || !s) return Promise.resolve();
          return C.leave(r).then(function () { return Mock.sleep(900); }).then(function () {
            var al = K.InlineAlert({ message: 'Unable to update task' }); s.insertBefore(al, s.children[1]); C.enter(r); return Mock.anim.fade(al, { ms: Mock.anim.ms.standard() }).then(function () { return Mock.sleep(900); });
          });
        } },
      { id: 'list-arrives', what: 'The first fetch lands: the arc gives way to the list\'s rows', token: 'standard 0.3 s (the same implicit list animation); the arc itself turns once per 0.82 s, linear', state: 'loading',
        source: 'TodoListSection (controller.items nil: ArcSpinner(.compact)); ArcSpinner.swift', reduce: 'rows fade in at 0.2 s; the arc keeps turning at half speed',
        play: function (stage) {
          return Mock.sleep(1400).then(function () {
            var jobs = [].slice.call(stage.querySelectorAll('.ui-section[data-list]')).map(function (s) {
              var sp = s.querySelector('.cz-spin'); if (!sp) return Promise.resolve();
              var secs = C.sections(ID), def = secs.filter(function (x) { return x.title === s.dataset.list; })[0]; if (!def) return Promise.resolve();
              var fresh = C.section({ title: def.title, items: def.items, edit: true }).querySelector('.ui-mlist'); s.replaceChild(fresh, sp);
              return Mock.anim.fade(fresh, { ms: Mock.settings.reduceMotion ? Mock.anim.ms.quick() : Mock.anim.ms.standard() });
            });
            return Promise.all(jobs);
          }).then(function () { return Mock.sleep(500); });
        } },
      { id: 'swipe-settle', what: 'Swipe actions open and close with the row', token: 'system List swipe (spring, interactive, system-owned); the app adds nothing', state: 'default',
        source: 'TodoListSection.swipeActions', reduce: 'the system cross-fades nothing here; swipe stays an interactive drag',
        play: function (stage) {
          var r = rowOf(stage, 'Clean the gutters'); if (!r) return Promise.resolve();
          var l = C.swipeRow(r.cloneNode(true), 'leading', { dense: true }); var slide = l.querySelector('.slide'); slide.style.transform = 'none'; r.parentNode.replaceChild(l, r);
          return Mock.sleep(60).then(function () { slide.style.transform = 'translateX(76px)'; return Mock.sleep(900); }).then(function () { slide.style.transform = 'none'; return Mock.sleep(500); });
        } },
    ],

    transitions: [
      { from: 'Quick Link tile', to: "Stephen's Chores", kind: 'push', note: 'Each tile is a NavigationLink in the list\'s first section header: the page pushes from the trailing edge, the Chores tab slides left. A push, never a zoom (nothing in a tab root zooms; owner 2026-10-22). Back swipe is the system\'s.',
        play: function (stage) { return C.pushDemo(stage, function (ctx) { return C.page(ctx, 'stephens-chores'); }); } },
      { from: 'Add Task', to: 'New Task sheet', kind: 'sheet', note: 'The floating Add button presents the task form as a fitted form sheet (540 pt on iPad). Content is present on arrival (motion.md section 4.4).',
        play: function (stage) { return Mock.presentDemo(stage, C.taskSheet(Mock.current, { mode: 'create', optsOnly: true }), { hold: 1200 }); } },
      { from: 'Edit glyph or Edit swipe', to: 'Edit Task sheet', kind: 'sheet', note: 'Same sheet, loading the task first ("Loading task"), Save disabled until something changes.',
        play: function (stage) { return Mock.presentDemo(stage, C.taskSheet(Mock.current, { mode: 'edit', optsOnly: true }), { hold: 1200 }); } },
      { from: 'Full Delete swipe', to: 'Delete {title}? dialog', kind: 'overlay', note: 'An action sheet on iPhone (popover on iPad). It rises over the page; Cancel is always there. The row stays until Delete Task is chosen.',
        play: function (stage) { return C.dialogDemo(stage, { title: 'Delete Clean the gutters?', destructive: 'Delete Task' }); } },
      { from: 'Chores tab', to: 'Home tab', kind: 'cut', note: 'A tab switch is a cut; each tab keeps its stack and scroll position (motion.md section 4.1).',
        play: function (stage) {
          var ctx = Mock.current, a = stage.querySelector('.ui-page'), b = Mock.page(ctx, { title: 'Home', section: 'home', body: [K.ChipRail({ chips: Mock.chips.home() })] });
          a.hidden = true; a.parentNode.insertBefore(b, a); return Mock.sleep(800).then(function () { b.remove(); a.hidden = false; });
        } },
    ],

    a11y: [
      { rule: 'Reading order', note: 'Open Navigation (iPhone, iPad), Quick Links, Profile; then the title "Chores" (heading); "Quick Links" (heading) and its five tiles in order (Your Chores, Steph\'s Chores, Unassigned Tasks, Home Tasks, Groceries); then each list\'s heading and rows top to bottom; Add Task; the tab bar last.' },
      { rule: 'Quick link tiles', note: 'One button each: label = title, value = subtitle ("3 overdue tasks · 1 task listed"), identifier chores.link.<page>. The big count numeral is hidden from VoiceOver because the subtitle already says it.' },
      { rule: 'Task rows', note: 'The left side is one toggle: label = title, value "Not done, Due in 3 days" or "Done", trait toggle, hint "Marks the task done." The Edit glyph is its own button "Edit {title}". Edit and Delete are also VoiceOver custom actions on the toggle (Complete is the toggle itself) and in the context menu.' },
      { rule: 'Due state is not colour alone', note: 'Overdue under a day is orange text with a clock glyph and the words "3 hours overdue"; a day or more is red with the clock; future is a calendar glyph and "Due in 2 days". The module turns dense under orange or red text to keep 4.5:1.' },
      { rule: 'Targets', note: 'Rows are 52 pt, 60 pt with a due line, the whole row is the hit area; the Edit button is 44 x 44; Add Task is a 52 pt capsule.' },
      { rule: 'Dynamic Type', note: 'Titles wrap (fixedSize vertical), the check circle follows the title font inside a 24 pt scaled column, the Quick Links grid goes to one column at AX5, the Add bar reflows to full width, section headers stack. Nothing is truncated.' },
      { rule: 'Swipe, context menu and rotor', note: 'Swipe actions exist only as a convenience: Complete, Mark Not Done, Edit, Delete are all in the context menu and the actions rotor. Delete always confirms.' },
      { rule: 'Reduce Motion', note: 'Rows fade instead of sliding when a task leaves or returns; the arc turns at half speed; push, sheet and tab transitions are the system\'s.' },
    ],

    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Lists and tables: primary action leads, destructive trails outermost (Mail, Reminders)', verdict: 'pass', note: 'Complete leads, Delete is outermost and asks first, Edit between (ios.md "Swipe design", owner 2026-10-16).' },
        { rule: 'Context menus: same actions as the swipe, destructive last', verdict: 'pass', note: 'TodoRowActions is the one source for swipe, menu and VoiceOver actions.' },
        { rule: 'Tab bars: badge for a count that needs attention', verdict: 'pass', note: 'Overdue count on the Chores tab, spoken "Chores, 3 overdue" (see overdue-chores-badge).' },
        { rule: 'Color: do not rely on colour alone', verdict: 'pass', note: 'Overdue has its own glyph and words; tiles carry their glyph and title.' },
        { rule: 'Loading: show content as soon as possible', verdict: 'pass', note: 'Cached items show at once (TodoItemsCache); a compact arc only where a list has never loaded.' },
        { rule: 'Navigation: tiles inside a list header row', verdict: 'departure', note: 'ios.md 2026-10-16: a list row of several NavigationLinks fires all of them, so the Quick Links are the first section header; AlignedToListMargins measures widths to keep their edges on the modules.' },
        { rule: 'Colour: chore tiles use colours nothing else uses', verdict: 'departure', note: 'Owner 2026-10-16: ultramarine, magenta, raspberry, violet and chestnut fills instead of the web colours, which collide with device families.' },
      ],
      swiftui: [
        { rule: 'Use List for swipe actions before iOS 27', verdict: 'departure', note: 'The page is a real List (ios.md 2026-10-16) with plain rows drawing their own module share (ModuleRowBackground) instead of a ScrollView of ModuleLists.' },
        { rule: 'No per-frame state while scrolling', verdict: 'pass', note: 'TodoRowMetrics stores widths, not positions; it was a position until the 2026-10-17 perf fix (performance.md, Chores).' },
        { rule: 'Animate with the app token, honour Reduce Motion', verdict: 'pass', note: 'One implicit motionSafeAnimation(standard, reduced: quick) keyed by TodoPageLayout.animationKey.' },
        { rule: 'Dynamic Type: no truncation, scaled metrics', verdict: 'pass', note: '@ScaledMetric check column; Quick Links tile minimum scales to one column at AX5.' },
        { rule: '44 pt targets', verdict: 'pass', note: 'Edit glyph minWidth and minHeight = HassTokens.minTarget.' },
        { rule: 'Accessibility traits: toggle, label, value, hint', verdict: 'pass', note: 'TodoItemRow.accessibilityValue; custom actions for Edit and Delete.' },
      ],
    },

    notes: [
      'Docs versus code: ios.md "Departures" still says quick links use the glass face with the web colour on the icon; the code draws filled tiles in ChoreFamily colours (owner 2026-10-16, same file further up). ios.md also says the DoneTick form opens at the large detent and one-field sheets at medium; the code fits every todo sheet to its content (TodoPageLayout.isShortPrompt is only kept for tests).',
      'Docs versus code: split-view.md lists "Chores lists split to item detail"; there is no split, sub-pages push full width everywhere (ios.md last Departures bullet) and edits are sheets.',
      'The Chores tab reads the viewer\'s lists in the order of choresTabLists(): Past Due, Evening, Afternoon, Morning, Due Any Time Today, No Due Date, Upcoming (Evening before Afternoon). Lists drop out while their entity count is 0.',
      'First-launch edge, read from the code and not reproduced: with no entity states yet the viewer\'s lists are not visible and showsEmptyState is true for an empty set, so "No Chores Due" can show for a moment before the store fills; the disk snapshot normally prevents it.',
      'iPad and Duo: inset-grouped List margins are the system\'s (16 pt on iPhone, wider elsewhere); the mockup draws 16 pt everywhere, so tile and module edges align but the margin on iPad is approximate. The unfolded Duo landscape does not split (OnDemandSplitStack has no adopter).',
      'The check circle flips to a green filled glyph with a strikethrough title when a row is done, but every list hides completed items (hideCompleted default), so the optimistic completion removes the row at once; the done look is reachable only on the Summary sheet\'s tabs (see todo-list-section).',
      'Wallpaper and glyphs are kit stand-ins. Task and list names are fixtures (ChoresGallery and invented chores), never the house.',
      'Promote to kit: TodoItemRow / TodoListSection, ActionSheet (confirmationDialog), swipe-action drawing, and the SF Symbol drawings added by _chores.js (circle, square.and.pencil, chevron.up.chevron.down, cart/hammer/tray circle fills, photo.on.rectangle.angled).',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: tab root with Quick Links and lists in all states, swipe, context menu, rollback and push motion.' }],
  });
})();
</script></body></html>
