<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room page · page mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../_rooms.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, R = Mock.rooms;

  /* The Living Room is the page this mockup leads with: every section layout the config uses (grid, lead row via the other states, app launcher) and all five chips. */
  function page(ctx, id, st, o) { return R.page(ctx, id, st || {}, o); }
  var ROOM = function (id, st, o) { return function (ctx) { return page(ctx, id, st, o); }; };
  function tileEl(stage, ident) { return stage.querySelector('[data-ident="' + ident + '"]'); }
  function chipEl(stage, title) { return stage.querySelector('.ui-chip[data-chip="' + title + '"]'); }

  /* A room card's sheet over the page (RoomCardSheet: large detent, page size). */
  function cardSheetOpts(key) { var s = R.cardSheet(key); return { title: s.title, detent: 'large', size: 'page', trailing: 'close', content: s.content }; }

  Mock.mount({
    kind: 'page', id: 'room-page', title: 'Room page (config-driven, 16 rooms)', area: 'rooms', status: 'shipped',
    summary: 'One template for sixteen rooms: a status rail of overview chips, then the room\'s titled sections in a responsive section grid (two columns from 704 pt), each opening a sheet. Pushed from Quick Links, so the header shows Back, Quick Links and Profile. Leads with the Living Room; Master Bedroom and Kitchen have their own items.',
    source: ['apple/Sources/HassUI/Features/Rooms/RoomScreen.swift', 'apple/Sources/HassUI/Features/Rooms/RoomTiles.swift', 'apple/Sources/HassUI/Features/Rooms/RoomSupport.swift',
      'apple/Sources/HassUI/Features/Rooms/BathroomFanRoomTile.swift', 'apple/Sources/HassUI/Features/Rooms/FanRailButton.swift', 'apple/Sources/HassUI/Features/Rooms/RoomDeviceRouting.swift',
      'apple/Sources/HassCore/Rooms/RoomsConfig.swift', 'apple/Sources/HassCore/Rooms/RoomController.swift', 'apple/Sources/HassCore/Rooms/RoomFormat.swift', 'apple/Sources/HassDesign/DynamicGridLayout.swift'],
    spec: ['.agents/pages/rooms/spec.md', '.agents/pages/rooms/ios.md', '.agents/design/apple/split-view.md'],
    patterns: ['status-rail', 'entity-tile', 'dynamic-grid', 'room-device-sheets', 'room-overview-sheet', 'optimistic-actions', 'modal-sheet', 'motion'],
    hig: ['Toolbars', 'Layout', 'Lists and tables (grids)', 'Color', 'Typography', 'Dynamic Type', 'Empty states (ContentUnavailableView)', 'Motion', 'Accessibility'],
    entities: ['light.living_room', 'input_text.living_room_climate_range', 'binary_sensor.living_room_occupancy_sensors', 'binary_sensor.living_room_window_contact_sensor_contact', 'sensor.living_room_air_purifier_pm2_5',
      'cover.living_room_vents', 'select.living_room_air_purifier_fan_mode', 'vacuum.valetudo_exaltedsneakydeer', 'media_player.living_room_shield', 'switch.guest_bathroom_towel_rack_switch_top', 'cover.garage_left_door'],
    kitComponents: ['ChipRail', 'StatusChip', 'GlassTile', 'TileGrid', 'PageSectionHeader', 'TabBar', 'NavigationGlass', 'ReconnectingArc', 'OfflineChip'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-landscape', 'duo-unfolded-portrait', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'Living Room, evening fixture', note: 'five chips; Climate, Devices, Remote, Quick App Launch (full width); two section columns from 704 pt', render: ROOM('living-room') },
      'loading': { title: 'Nothing saved yet', note: 'no gate and no pending bars: with an empty store every card reads Unavailable, as in the error state', render: ROOM('living-room', { u: true }) },
      'refreshing': { title: 'Saved snapshot on screen, live values swap in', note: 'identical to default by design: views bind to per-entity boxes that update in place, nothing re-fades (AGENTS.md: no reload on reopen)', render: ROOM('living-room') },
      'empty': { title: 'Hallway: "Nothing Here Yet!"', note: 'a room with no sections still shows its rail; the Entryway and Downstairs Hallway read the same', render: ROOM('hallway') },
      'error': { title: 'Entities unavailable', note: 'cards dim and stop responding; chips read Unavailable (Climate and Air Quality stay filled, Window goes neutral)', render: ROOM('living-room', { u: true }) },
      'offline': { title: 'No network', note: 'values stay; the offline chip under the header and the cloud badge on Profile', render: ROOM('living-room', {}, { connection: 'offline' }) },
      'reconnecting': { title: 'Connection down 2 s+', note: 'in flight (claude/reconnecting-spinner): the arc left of Quick Links; was the orange "Reconnecting…" chip', render: ROOM('living-room', {}, { connection: 'reconnecting' }) },
      'reconnecting-was': { title: 'Reconnecting, today (main)', note: 'the chip the arc replaces', render: ROOM('living-room', {}, { connection: 'reconnecting-chip' }) },
      'long-text': { title: 'Theater Room: long names, three section kinds', note: 'Theater Room Remote, Nintendo Switch, Theater SHIELD, Theater Room PCs; names wrap to two lines in a tile, never truncate', render: ROOM('theater-room') },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'tiles anchor text to the bottom and go one column; chips scroll (compact) or wrap (regular)', render: ROOM('living-room') },
      'placeholder': { title: 'No connection yet (PlaceholderScreen)', note: 'RoomScreen without a connection or caller draws a ContentUnavailableView with the room title and "Coming in a later update."', render: function (ctx) { return R.placeholder(ctx, 'Living Room'); } },
      'active': { title: 'Devices running', note: 'window open at home (amber chip), vacuum cleaning (cleaning purple), remote playing (media pink), launcher shows the playing app', render: ROOM('living-room', { window: 'home', playing: true, cleaning: true }) },
      'window-armed': { title: 'Window open while armed', note: 'the contact chip reddens and shows a triangle; chips follow the house, not the room', render: ROOM('living-room', { window: 'armed' }) },
      'lead-row': { title: 'Guest Bathroom: lead row (fan) then a grid', note: 'fan alone on a phone; at regular width it joins the two-column grid beside the vent (owner 2026-10-17)', render: ROOM('guest-bathroom') },
      'fan-on-timed': { title: 'Master Bathroom: fan on, locked, timed', note: 'white rail circles, lit teal tile, "Off in 12:34" (lock is spoken, never written)', render: ROOM('master-bathroom', { towel: true }) },
      'fan-unavailable': { title: 'Fan unavailable', note: 'no rail (no dead controls); the tile still opens its sheet', render: ROOM('guest-bathroom', { fanU: true }) },
      'music-room': { title: 'Music Room: lead row with three source tiles', note: 'sources are selections that share the remote\'s optimistic state; three follow-ups switch to two filling columns; the Fortnite launcher section is off the page', render: ROOM('music-room', { source: 'xbox' }) },
      'office': { title: 'Office: PCs personalised to the viewer', note: 'Your PC for the signed-in resident, Steph\'s PC for the other; a PC is a command tile in the power family', render: ROOM('office') },
      'back-deck': { title: 'Back Deck: inert chip and a disabled grill', note: 'the Occupancy chip has no sheet, so it is not a button; Bear Grills is dimmed while off', render: ROOM('back-deck') },
      'garage': { title: 'Garage: one chip, laundry, door controls', note: 'a single overview chip; the washer and dryer are read-only state tiles; the doors are the Security page\'s GarageDoorTile with the card\'s title', render: ROOM('garage', { left: 'open' }) },
    },

    motion: [
      { id: 'tile-optimistic', what: 'Tapping the Towel Rack shows the change at once; Home Assistant\'s answer wins afterwards (a revert shows the tile going back)', token: 'state 0.6 s ease-in-out (0.2 s reduced), colour only', state: 'lead-row',
        source: 'HassDesign/GlassTile.swift stateColorTransition("GlassTile"); RoomController.run(.flip) via OptimisticActions (.liveChange); motion.md section 6', reduce: 'still cross-fades (colour is not motion), shortened to 0.2 s',
        play: function (stage) { var t = tileEl(stage, 'room.card.Towel Rack'); return R.toggle(t, true, 'On').then(function () { return Mock.sleep(700); }).then(function () { return R.toggle(t, false, 'Off'); }); } },
      { id: 'chip-colour', what: 'The Window chip changes with the house: Closed to Open (soft green to amber), glyph swaps', token: 'state 0.6 s ease-in-out (0.2 s reduced), colour only; glyph swap is the system symbol replace', state: 'default',
        source: 'HassUI/Features/Home/StatusRail.swift StatusChipStyle (shared with room rails); motion.md section 6', reduce: 'cross-fades at 0.2 s; the glyph swap is an identity change',
        play: function (stage) { var c = chipEl(stage, 'Window'); c.style.setProperty('--cf', 'var(--chip-contact-home-fill)'); c.style.setProperty('--cg', 'var(--chip-contact-home-glyph)'); c.querySelector('.su').textContent = 'Open'; c.querySelector('.g').innerHTML = Mock.icon('door.left.hand.open', { fill: true }); return Mock.sleep(Mock.anim.ms.state() + 300); } },
      { id: 'glyph-replace', what: 'A garage door tile\'s glyph swaps from closed to open while it moves, its fill follows', token: 'system symbolEffect(.replace) on the glyph (identity under Reduce Motion); fill cross-fade state 0.6 s', state: 'garage',
        source: 'HassDesign/GlassTile.swift (glyph contentTransition); SecurityTiles.swift GarageDoorTile', reduce: 'the glyph swaps with no effect; the fill still cross-fades at 0.2 s',
        play: function (stage) { var t = tileEl(stage, 'room.card.Right Door'), g = t.querySelector('.glyph');
          return Mock.anim.fade(g, { from: 1, to: 0, ms: 120 }).then(function () { g.innerHTML = Mock.icon('door.garage.open', { fill: true }); t.querySelector('.st').textContent = 'Sending Open…'; return R.toggle(t, true).then(function () { return Mock.anim.fade(g, { from: 0, to: 1, ms: 200 }); }); }).then(function () { return Mock.sleep(500); }); } },
      { id: 'fan-countdown', what: 'The fan tile\'s status line counts down once a second while a timer runs', token: 'TimelineView every 1 s only while a countdown shows (hourly otherwise); plain text swap, no numeric transition', state: 'fan-on-timed',
        source: 'HassUI/Features/Rooms/BathroomFanRoomTile.swift', reduce: 'unchanged: it is a text update, not motion',
        play: function (stage) { var st = tileEl(stage, 'room.card.Fan').querySelector('.st'), n = 0; function tick() { n++; st.textContent = 'Off in 12:' + (34 - n); return n < 5 ? Mock.sleep(1000).then(tick) : Promise.resolve(); } return Mock.sleep(600).then(tick); } },
    ],

    transitions: [
      { from: 'Room card (Climate, Vents)', to: 'Room card sheet', kind: 'sheet', note: 'A card with a sheet presents RoomCardSheet at the large detent (page size on iPad). The page scales back and dims; content is present on arrival (motion.md 4.4). Device cards open their own lane sheets instead (fan, purifier, humidifier, grill, vacuum, wake light, beds, remotes).',
        play: function (stage) { return Mock.presentDemo(stage, cardSheetOpts('lights-living-room')); } },
      { from: 'Status chip (Lights)', to: 'Room card sheet', kind: 'sheet', note: 'A chip with a sheet opens the same sheet type; a chip without one (Back Deck Occupancy) is inert.',
        play: function (stage) { return Mock.presentDemo(stage, cardSheetOpts('climate-living-room')); } },
      { from: 'Quick Links (Rooms grid)', to: 'This room page', kind: 'push', note: 'A room tile closes the Quick Links sheet first, then the room pushes onto the page\'s stack once the sheet has gone, so the push never races the dismissal (QuickLinksSheet.go, quickLinksDismissed). Plain system push; no zoom.',
        play: function (stage) { var ctx = Mock.current; return R.sheetThenPush(stage, { title: 'Rooms', leading: 'back', trailing: 'none', detent: 'large', size: 'page', content: R.roomsGrid() }, function () { return page(ctx, 'kitchen', {}); }); } },
      { from: 'Room page', to: 'Home', kind: 'push', note: 'Back (glass circle) or the interactive edge swipe pops the page; the system pop, never replaced.',
        play: function (stage) { var ctx = Mock.current, a = stage.querySelector('.ui-page'), b = R.homePresenter(ctx); a.parentNode.insertBefore(b, a); return Mock.anim.push(a, b, { back: true }).then(function () { return Mock.sleep(500); }).then(function () { b.remove(); a.style.transform = ''; a.style.filter = ''; }); } },
    ],

    a11y: [
      { rule: 'Reading order', note: 'Back (or Open Navigation), Quick Links, Profile; then the room title (heading); the status rail (group "<Room> status") with its chips; then each section (a container named by its title with a heading) and its cards left to right, top to bottom; the tab bar last. At regular width the two section columns read column by column (left column first).' },
      { rule: 'Chips', note: 'Each chip is a button "<title>, <summary>" ("Window, Closed") with the hint "Opens <title>"; an inert chip (no sheet) is a plain element with the same label and no button role. State is words plus glyph plus colour; the contact chip adds a triangle when armed.' },
      { rule: 'Cards', note: 'One element per card: label = title, value = its state line. Kinds map to roles: a toggle (Towel Rack) is a switch with an On/Off value, a command (PC, garage door) a button with an Opens/Closes hint, a selection (Music Room sources) a button that is selected while on, a modal card a button with a chevron, a state tile (Washing Machine) is not a button and is never dimmed as disabled. Unavailable cards are dimmed and not enabled.' },
      { rule: 'Bathroom fan tile', note: 'The tile is a button (opens the fan sheet) with the value "on, off in 12 minutes, locked"; Lock and Power are two switches (44 pt minimum, 66 pt cap, glyph under 45% of the circle) named Lock and Power with On/Off values and the identifiers room.fan.<power entity>.lock|power. Hidden while unavailable.' },
      { rule: 'Targets', note: 'Chips 48 pt tall, tiles 72 pt or taller, app tiles square (up to 168 pt), fan circles 44 pt, header circles 44 pt.' },
      { rule: 'Dynamic Type', note: 'Section headers 20 bold (heading trait, rotor). Tiles keep a scaled minimum width of 140 pt and reflow to one column at accessibility sizes; at AX5 every tile anchors its text bottom-leading and the fan rail drops under the text. The section grid minimum (340 pt) does not scale, so a phone is always one column.' },
      { rule: 'Reduce Motion and Transparency', note: 'Colour changes cross-fade at 0.2 s. With Reduce Transparency the wallpaper is the plain base colour and tiles and chips draw the solid finish.' },
      { rule: 'Privacy', note: 'With FENTON_REDACT_PRIVATE the Occupancy chip reads "Hidden" (screenshots only).' },
    ],

    reviews: {
      date: '2026-10-23', by: 'author',
      hig: [
        { rule: 'Toolbars: Back leading on a pushed page, important actions trailing', verdict: 'pass', note: 'Glass Back circle, Quick Links and Profile 12 pt apart; Duo folded moves them to the trailing rail.' },
        { rule: 'Layout: adapt to the available width without fixed columns', verdict: 'pass', note: 'DynamicGridLayout: tiles from a 140 pt scaled minimum; sections from 340 pt, max two columns; hinge rounds the count to even.' },
        { rule: 'Color: do not rely on colour alone', verdict: 'pass', note: 'Every tile and chip carries its state in words ("Open", "Off in 12:34"); the contact chip adds a triangle.' },
        { rule: 'Typography: support Dynamic Type including accessibility sizes', verdict: 'pass', note: 'Scaled metrics throughout; tiles re-anchor at AX sizes; no truncation of names.' },
        { rule: 'Empty states: explain what is missing and what to do', verdict: 'pass', note: 'ContentUnavailableView "Nothing Here Yet!" with a description.' },
        { rule: 'Disabled controls look disabled and do nothing', verdict: 'pass', note: 'Unavailable cards dim and are not enabled; the fan hides its rail rather than show dead buttons.' },
        { rule: 'Navigation: Quick Links as a header button, not a tab', verdict: 'departure', note: 'Owner decision 2026-10-16 (direction-g.md Navigation).' },
        { rule: 'Materials: no per-tile live blur', verdict: 'departure', note: 'Tiles are the tinted-glass finish over a once-rendered wallpaper (direction-g.md Tile finish; Layers, GPU cost).' },
      ],
      swiftui: [
        { rule: 'Views bind to small observable models; no whole-page invalidation', verdict: 'pass', note: 'Per-entity boxes in EntityStore; the fan tile ticks hourly unless a countdown shows so its identity stays stable.' },
        { rule: 'ScrollView with a non-lazy stack for bounded content', verdict: 'pass', note: 'A room has at most about 15 tiles and a custom Layout; LazyVStack would add nothing.' },
        { rule: 'Accessibility: containers, headings, identifiers on the right element', verdict: 'pass', note: 'Sections are .contain groups with a heading; tiles with accessories use tileIdentifier so the accessory buttons keep their own ids.' },
        { rule: 'ScaledMetric for sizes tied to text', verdict: 'pass', note: 'minTileWidth (140, 110 for apps) and the fan circle (cap 1.5x).' },
        { rule: 'Animate colour with the app token; honour Reduce Motion', verdict: 'pass', note: 'stateColorTransition / stateForeground (0.6 s, 0.2 s reduced); the glyph replace is identity under Reduce Motion.' },
        { rule: 'Do not swallow errors silently', verdict: 'fix', note: 'RoomScreen.task reads the signed-in user with try?: on failure the page keeps plain titles ("Stephen\'s Side" instead of "Your Side") with no notice. Low impact; worth a log line.' },
      ],
    },

    notes: [
      'Sixteen rooms, one template: living-room, guest-room, master-bedroom, gym, hallway, office, kitchen, dining-room, back-deck, music-room, theater-room, downstairs-hallway, garage, guest-bathroom, master-bathroom, entryway. This mockup draws Living Room, Hallway (empty), Guest and Master Bathroom, Music Room, Theater Room, Office, Back Deck and Garage; Guest Room, Gym and Dining Room are the same cards with fewer sections; Entryway and Downstairs Hallway are empty like the Hallway. Master Bedroom and Kitchen have their own items.',
      'no rail: no room in RoomsConfig has an empty overviewCards list (Garage has the fewest, one chip), so the "no rail" branch in RoomPageContent is unreachable today; the Garage state shows the single-chip rail.',
      'loading: room pages have no content gate or pending bars. Opened before the first snapshot, every card reads Unavailable (an empty store), which is the error state; the shell\'s own launch handling covers the rest.',
      'Where docs and code differ: pages/rooms/ios.md says Quick Links is a toolbar button "in compact width before iOS 26, on section roots"; the shell header now carries it on every page and RoomPageContent adds its own only outside the shell (shellNavigator == nil). Drawn: header button.',
      'Section grid on the unfolded Duo (landscape) reads two columns: the second begins at about x 446, inside the hinge band (455 to 496). DynamicGridLayout rounds the count to even but does not offset tracks from the hinge; not verified on a device.',
      'App launcher artwork is a remote image; the mockup draws the placeholder glyph the tile shows while it loads (white ground for YouTube). Wallpaper, glyphs and the entity values are kit stand-ins and gallery fixtures (RoomsFixtures); the purifier reads "Auto • On" where the fixture has the fan off.',
      'Wake-Light Alarms never fills: the generic tile only fills for states on, open, playing, recording, home, heat or cool, and the sensor reports a phase word. See room-master-bedroom.',
      'Device sheets (fan, purifier, humidifier, grill, vacuum, wake light, beds, media remotes) belong to other batches; the vacuum and humidifier fall back to RoomDeviceFallback without the app\'s connection (debug gallery).',
      'Promote to kit: the symbols added in pages/rooms/_rooms.js (stove, stairs, bathtub, desktopcomputer, window.vertical.*, air.purifier, heat.waves, dishwasher, washer, dryer, sunrise, apple.logo, appletvremote.gen4, figure.stand, server.rack), R.tile / R.section / R.sections, the app launcher tile, the fan rail and the ContentUnavailableView stand-in.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: Living Room and eight other rooms, every state, motion and transitions.' }],
  });
})();
</script></body></html>
