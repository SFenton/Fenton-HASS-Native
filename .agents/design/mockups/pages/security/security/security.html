<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security · page mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../components/climate/_security-climate.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, SC = window.SecClimate;

  function page(ctx, o) { return SC.securityPage(ctx, o); }
  var CAMS_SNAP = ['snapshot', 'snapshot', 'snapshot', 'snapshot'];
  var UNAVAIL_CHIPS = [Object.assign(Mock.chips.unavailable('Security', 'shield'), { summary: 'Unavailable' }), Mock.chips.unavailable('Contact Sensors', 'door.left.hand.closed')];

  function tileEl(stage, title) { var t = Array.prototype.slice.call(stage.querySelectorAll('.ui-tile')).filter(function (x) { return x.querySelector('.ti').textContent === title; })[0]; return t; }
  function setTile(t, o) {
    var tiles = Mock.components.GlassTile(o); // a fresh face: swap in place so the colour slots cross-fade
    t.className = tiles.className; t.dataset.face = tiles.dataset.face; t.setAttribute('style', tiles.getAttribute('style') || ''); t.innerHTML = tiles.innerHTML; t.setAttribute('aria-label', tiles.getAttribute('aria-label'));
  }
  function secSheetOpts() { return { title: 'Security System', detent: 'fitted', size: 'page', trailing: 'close', content: h('div', { style: { maxWidth: '560px', margin: '0 auto' } }, K.AlarmPanel({ state: 'armed_home' })) }; }

  Mock.mount({
    kind: 'page', id: 'security', title: 'Security', area: 'security', status: 'shipped',
    summary: 'The Security tab: the Security and Contact Sensors chips, the alarm card on a module, Doors as tiles (a lock and two garage doors), guests while a toggle is on, cameras, and the hidden Mach-E section. Sample data is the debug gallery fixture.',
    source: ['apple/Sources/HassUI/Features/Security/SecurityScreen.swift', 'apple/Sources/HassUI/Features/Security/SecurityDoorTile.swift', 'apple/Sources/HassUI/Features/Security/SecurityTiles.swift',
      'apple/Sources/HassUI/Features/Security/SecuritySystemSheet.swift', 'apple/Sources/HassUI/Features/Home/GuestPresenceSection.swift', 'apple/Sources/HassUI/Features/Home/CameraGrid.swift',
      'apple/Sources/HassCore/Config/SecurityConfig.swift', 'apple/Sources/HassCore/Security/GarageDoorController.swift'],
    spec: ['.agents/pages/security/spec.md', '.agents/pages/security/ios.md', '.agents/design/direction-g.md'],
    patterns: ['status-rail', 'dynamic-grid', 'camera-streams', 'entity-tile', 'optimistic-actions', 'motion'],
    hig: ['Tab bars', 'Alerts', 'Color', 'Dynamic Type', 'HomeKit: cameras'],
    entities: ['alarm_control_panel.aqara_hub_m3_0056_security_system_2', 'lock.aqara_smart_lock_u400', 'cover.garage_left_door', 'cover.garage_right_door', 'binary_sensor.contact_sensors', 'lock.fordpass_3fmtk3su5mma09266_doorlock'],
    kitComponents: ['ChipRail', 'StatusChip', 'AlarmPanel', 'GlassTile', 'TileGrid', 'PageSectionHeader', 'CameraTile', 'TabBar', 'NavigationGlass', 'ReconnectingArc', 'OfflineChip'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-landscape', 'duo-unfolded-portrait', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'Armed Home, doors locked and closed', render: function (c) { return page(c, {}); } },
      'loading': { title: 'First sign-in, nothing saved', note: 'door tiles keep their names with a soft pulsing bar where the state goes; the alarm card has no pending look and reads Unavailable; the chips read Unavailable (the rail has no pending mode)', render: function (c) {
        return page(c, { alarm: 'unavailable', unavailable: true, pending: true, chips: UNAVAIL_CHIPS, cams: ['connecting', 'connecting', 'connecting', 'connecting'] }); } },
      'refreshing': { title: 'Saved snapshot on screen, live values swap in', note: 'identical to default by design: no spinner, nothing re-fades (owner 2026-10-17)', render: function (c) { return page(c, {}); } },
      'error': { title: 'Everything unavailable', note: 'Home Assistant reports unavailable: the alarm modes disable and dim their glyphs, tiles read "Unavailable" (FENTON_GALLERY_SCENARIO=unavailable)', render: function (c) {
        return page(c, { alarm: 'unavailable', unavailable: true, chips: UNAVAIL_CHIPS, cams: CAMS_SNAP }); } },
      'offline': { title: 'No network', note: 'values stay; offline chip under the header and the cloud badge on Profile; a garage tap fails at once (see garage-error)', render: function (c) { return page(c, { cams: CAMS_SNAP, page: { connection: 'offline' } }); } },
      'reconnecting': { title: 'Connection down 2 s+', note: 'in flight (claude/reconnecting-spinner): the arc left of Quick Links; was a "Reconnecting…" chip under the header', render: function (c) { return page(c, { cams: ['snapshot', 'connecting', 'snapshot', 'snapshot'], page: { connection: 'reconnecting' } }); } },
      'reconnecting-was': { title: 'Reconnecting, today (main)', note: 'the orange chip the arc replaces', render: function (c) { return page(c, { page: { connection: 'reconnecting-chip' } }); } },
      'long-text': { title: 'Alarm triggered, three sensors open, a jam and a moving door', note: 'chip summaries, the red-washed card and the longest tile states at once', render: function (c) {
        return page(c, { alarm: 'triggered', contacts: ['armed', 3], front: { state: 'jammed' }, left: { state: 'closing', phase: 'sending', opens: false }, right: { state: 'opening', phase: 'idle' }, guests: true }); } },
      'disarmed': { title: 'Disarmed', render: function (c) { return page(c, { alarm: 'disarmed', since: 'Oct 14' }); } },
      'armed-away': { title: 'Armed Away', render: function (c) { return page(c, { alarm: 'armed_away', since: '7:48 AM' }); } },
      'armed-night': { title: 'Armed Night', render: function (c) { return page(c, { alarm: 'armed_night', since: '10:30 PM' }); } },
      'triggered': { title: 'Alarm triggered (FENTON_GALLERY_SCENARIO=triggered)', note: 'the module takes the dense ground washed #D70015 at 42% (60% with Reduce Transparency); it holds steady and never pulses', render: function (c) { return page(c, { alarm: 'triggered', contacts: ['armed', 1] }); } },
      'doors-open': { title: 'Doors open and unlocked (FENTON_GALLERY_SCENARIO=openAway)', note: 'a filled tile means open, unlocked or moving; the Contact Sensors chip reads the house (open while away)', render: function (c) {
        return page(c, { alarm: 'armed_away', contacts: ['away', 2], front: { state: 'unlocked' }, left: { state: 'open' }, right: { state: 'closed' } }); } },
      'garage-sending': { title: 'Garage: Sending Open…', note: 'the tile fills at once with the optimistic Opening glyph and says Sending Open… for 1 s, taps ignored for 2 s, then Opening until Home Assistant reports', render: function (c) {
        return page(c, { left: { state: 'opening', phase: 'sending', opens: true } }); } },
      'garage-error': { title: 'Garage: Error (call failed, offline or no response)', note: 'the red error face for 8 s, then the tile follows Home Assistant again; offline fails at once (canSend false)', render: function (c) {
        return page(c, { left: { state: 'closed', phase: 'error', opens: true }, page: { connection: 'offline' }, cams: CAMS_SNAP }); } },
      'guests': { title: 'Guests staying over', note: 'the section shows only while a guest toggle is on', render: function (c) { return page(c, { guests: true }); } },
      'mach-e': { title: 'Mach-E section (hidden in the app)', note: 'not shipped: SecurityConfig.showsVehicleSection is false (the web hides it); the debug gallery shows it so the tile stays tested', status: 'gallery only', render: function (c) { return page(c, { mach: true }); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'chips scroll or wrap, the alarm modes wrap to fewer columns, door tiles and cameras go to one column', render: function (c) { return page(c, { guests: true }); } },
    },

    motion: [
      { id: 'alarm-mode', what: 'The panel reports a new mode: the badge, title and the chosen mode button cross-fade to the new colour', token: 'state 0.6 s ease-in-out, colour only', state: 'default',
        source: 'SecuritySystemSheet.swift AlarmPanel and AlarmModeButton .stateColorTransition; motion.md section 6', reduce: 'still cross-fades at 0.2 s',
        play: function (stage) {
          function set(state, title, fam) { var panel = stage.querySelector('.ui-alarm'), badge = panel.querySelector('.badge'); stage.querySelectorAll('.ui-mode').forEach(function (b) { b.classList.toggle('sel', b.dataset.mode === state); }); badge.style.setProperty('--bfill', 'var(--fam-' + fam + '-fill)'); panel.querySelector('.ti').textContent = title; }
          set('armed_away', 'Armed Away', 'sec-away'); return Mock.sleep(Mock.anim.ms.state() + 300).then(function () { set('armed_home', 'Armed Home', 'sec-home'); return Mock.sleep(Mock.anim.ms.state() + 300); });
        } },
      { id: 'triggered-wash', what: 'The alarm triggers: the card ground takes the red wash', token: 'state 0.6 s ease-in-out; steady, never a pulse', state: 'default',
        source: 'AlarmPanel.ground, stateColorTransition("AlarmPanel"); direction-g.md Controls', reduce: 'cross-fade at 0.2 s',
        play: function (stage) { var p = stage.querySelector('.ui-alarm'); p.classList.add('triggered'); return Mock.sleep(Mock.anim.ms.state() + 700).then(function () { p.classList.remove('triggered'); return Mock.sleep(Mock.anim.ms.state() + 300); }); } },
      { id: 'door-tile', what: 'A lock turns: the tile fills with the Doors and windows colour and the padlock swaps open', token: 'state 0.6 s ease-in-out for colour; the glyph swaps with a symbol replace (identity under Reduce Motion)', state: 'default',
        source: 'GlassTile (GlassTileFace) .stateColorTransition("GlassTile"), glyph .contentTransition(.symbolEffect(.replace)); motion.md section 6', reduce: 'colour cross-fades at 0.2 s, the glyph swaps with no effect',
        play: function (stage) {
          var t = tileEl(stage, 'Front Door'); setTile(t, { title: 'Front Door', subtitle: 'Unlocking', symbol: 'lock.open', family: 'contact', isActive: true, kind: 'command' });
          return Mock.sleep(Mock.anim.ms.state() + 600).then(function () { setTile(t, { title: 'Front Door', subtitle: 'Unlocked', symbol: 'lock.open', family: 'contact', isActive: true, kind: 'command' }); return Mock.sleep(700); })
            .then(function () { setTile(t, { title: 'Front Door', subtitle: 'Locked', symbol: 'lock', family: 'contact', isActive: false, kind: 'command' }); return Mock.sleep(Mock.anim.ms.state() + 300); });
        } },
      { id: 'garage-sequence', what: 'A garage door tap: Sending Open… for 1 s, Opening until the door reports, then Open; a failure shows Error in red for 8 s', token: 'state 0.6 s for the fill; feedback timings from GarageDoorController.Timing (1 s, 2 s, 10 s, 45 s, 8 s)', state: 'default',
        source: 'HassCore/Security/GarageDoorController.swift, SecurityTiles.swift GarageDoorTile; spec.md Garage door command', reduce: 'colour cross-fades at 0.2 s; the VoiceOver announcement is unchanged',
        play: function (stage) {
          var t = tileEl(stage, 'Left Door');
          function door(sub, o) { setTile(t, Object.assign({ title: 'Left Door', subtitle: sub, symbol: 'door.garage.open', family: 'contact', isActive: true, kind: 'command' }, o)); }
          door('Sending Open…'); return Mock.sleep(1100).then(function () { door('Opening'); return Mock.sleep(1500); }).then(function () { door('Open'); return Mock.sleep(1200); })
            .then(function () { setTile(t, { title: 'Left Door', subtitle: 'Error', symbol: 'door.garage.closed', family: 'contact', isError: true, kind: 'command' }); return Mock.sleep(Mock.anim.ms.state() + 900); })
            .then(function () { setTile(t, { title: 'Left Door', subtitle: 'Closed', symbol: 'door.garage.closed', family: 'contact', isActive: false, kind: 'command' }); return Mock.sleep(Mock.anim.ms.state() + 200); });
        } },
      { id: 'chip-colour', what: 'The Contact Sensors chip changes with the house when a door opens (closed, open at home, open away, open while armed)', token: 'state 0.6 s ease-in-out, colour only', state: 'default',
        source: 'StatusRail.swift StatusChipStyle; direction-g.md Contact Sensors reads the house', reduce: 'cross-fade at 0.2 s',
        play: function (stage) {
          var c = stage.querySelector('.ui-chip[data-chip="Contact Sensors"]'), seq = [['home', '2 Open'], ['away', '2 Open'], ['armed', '2 Open'], ['closed', 'All Closed']];
          return seq.reduce(function (p, s) { return p.then(function () { c.style.setProperty('--cf', 'var(--chip-contact-' + s[0] + '-fill)'); c.style.setProperty('--cg', 'var(--chip-contact-' + s[0] + '-glyph)'); c.querySelector('.su').textContent = s[1]; return Mock.sleep(Mock.anim.ms.state() + 450); }); }, Promise.resolve());
        } },
    ],

    transitions: [
      { from: 'Security chip', to: 'Security System sheet', kind: 'sheet', note: 'The Security chip presents the alarm card in a fitted page sheet (hassSheet(.page)). The page scales back and dims; content is present on arrival (motion.md section 4.4).',
        play: function (stage) { return Mock.presentDemo(stage, secSheetOpts(), { hold: 1100 }); } },
      { from: 'Contact Sensors chip', to: 'Contact Sensors overview sheet', kind: 'sheet', note: 'The shared chip overview opens at large (hassSheet(.page, height: .full)) because it navigates to a room group.',
        play: function (stage) { return Mock.presentDemo(stage, { title: 'Contact Sensors', detent: 'large', size: 'page', trailing: 'close', content: h('div', { style: { padding: '24px 16px', font: '15px var(--font)' } }, 'Room overview sheet: see room-overview-contacts') }, { hold: 1000 }); } },
      { from: 'Camera tile', to: 'Camera viewer sheet', kind: 'sheet', note: 'A camera card presents the viewer: a sheet, dark by design, not a zoom (patterns/motion.md Departures).',
        play: function (stage) { return Mock.presentDemo(stage, { title: 'Front Door', detent: 'fitted', size: 'page', appearance: 'dark', content: h('div', { style: { aspectRatio: '16 / 9', borderRadius: '20px', background: Mock.scene('front-door') } }) }, { hold: 1000 }); } },
      { from: 'Disarm button on the card', to: 'Disarm alert', kind: 'fade', note: 'On this page the alert belongs to the card itself and appears over the page (the sheet case is in disarm-confirm-alert). Arming sends at once.', state: 'default',
        play: function (stage) {
          var scrim = h('div.ui-alert-scrim.g-dark', K.Alert({ title: 'Disarm the Security System?', message: 'Doors and motion stop triggering the alarm.', buttons: [{ title: 'Cancel', role: 'cancel' }, { title: 'Disarm', role: 'destructive' }] }));
          stage.appendChild(scrim); return Mock.anim.fade(scrim, { ms: 200 }).then(function () { return Mock.sleep(1100); }).then(function () { return Mock.anim.fade(scrim, { from: 1, to: 0, ms: 200 }); }).then(function () { scrim.remove(); });
        } },
      { from: 'Security', to: 'Climate tab', kind: 'cut', note: 'A tab switch is a cut (motion.md section 4.1); each tab keeps its stack and scroll position.',
        play: function (stage) {
          var ctx = Mock.current, a = stage.querySelector('.ui-page'), b = Mock.page(ctx, { title: 'Climate', section: 'climate', body: [h('div', { style: { height: '200px' } })] });
          a.hidden = true; a.parentNode.insertBefore(b, a); return Mock.sleep(800).then(function () { b.remove(); a.hidden = false; });
        } },
    ],

    a11y: [
      { rule: 'Reading order', note: 'Open Navigation (iPhone, iPad), the reconnecting arc when present, Quick Links, Profile; the page title; the status chips (Security, Contact Sensors); the alarm card (header, then Disarm, Home, Away, Night); "Doors" (heading) and its tiles; Guests Staying Over; Cameras; the tab bar last.' },
      { rule: 'Alarm card', note: 'The header is one element: label "Security System", value "Armed Home, Since 6:12 PM" (security.system.state). Each mode is a button named Disarm, Home, Away or Night with the selected trait on the current one; hints "Sets the security system to Home" and "Disarms the security system". Disarm always confirms with an alert (Cancel kept).' },
      { rule: 'Door tiles', note: 'A tile is one button: label the door, value its state ("Front Door, Locked"), hint what a tap does ("Unlocks", "Opens the door", "Closes the door"). Garage feedback is announced without moving focus ("Left Door, Sending Open…"). Unavailable tiles are disabled and dim only the glyph; text keeps 4.5:1.' },
      { rule: 'State is not colour alone', note: 'Every door state has words (Locked, Unlocked, Jammed, Opening, Error) and its own glyph (padlock, open padlock, open or closed garage); the red error face adds to the word "Error". Alarm modes have their own glyphs and titles.' },
      { rule: 'Targets', note: 'Chips 48 pt, mode buttons 64 pt, tiles 72 pt or more, camera tiles far larger, header circles 44 pt.' },
      { rule: 'Dynamic Type', note: 'At AX5 the mode buttons fall to one column once 64 pt (scaled) no longer fits four across, door tiles stack glyph over text in one column, cameras one column; section headers stack; nothing truncates.' },
      { rule: 'Reduce Motion and Transparency', note: 'Colour cross-fades shorten to 0.2 s; the triggered wash goes to 60% over a solid ground; modules and tiles use the solid finish.' },
      { rule: 'Privacy', note: 'FENTON_REDACT_PRIVATE=1 hides the alarm mode (card header and selection) and the Security chip text for shared screenshots.' },
    ],

    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Alerts: confirm destructive or hard-to-undo actions', verdict: 'pass', note: 'Disarm opens the house and always asks; arming does not (reversible). Cancel stays on every device.' },
        { rule: 'Color: not the only differentiator', verdict: 'pass', note: 'Words and glyphs on every tile and mode; error face plus the word Error.' },
        { rule: 'HomeKit: do not cover camera views', verdict: 'pass', note: 'Only a small name label sits over the picture; the live dot is red and decorative.' },
        { rule: 'Layout: tiles at a consistent minimum width, reflow with type size', verdict: 'pass', note: '140 pt scaled minimum, equal heights, hinge-aware even columns.' },
        { rule: 'Feedback: confirm that a command is on its way', verdict: 'pass', note: 'Garage tiles say Sending Open… and announce progress; locks show the optimistic state until Home Assistant reports.' },
        { rule: 'Tab bars: five tabs, Settings last', verdict: 'pass', note: 'Security is the second tab.' },
      ],
      swiftui: [
        { rule: 'ScaledMetric for fixed sizes', verdict: 'pass', note: 'minTileWidth 140 (subheadline), badge 44 (title2), mode width 64 (footnote).' },
        { rule: 'Animate colour with the app token', verdict: 'pass', note: 'stateColorTransition for the panel, modes and tiles; the triggered wash fades and never pulses.' },
        { rule: 'Optimistic state rolls back on failure', verdict: 'pass', note: 'OptimisticActions with .liveChange rules for the alarm and locks; GarageDoorController owns its own timers (unit-tested with a manual clock).' },
        { rule: 'No per-frame state writes while scrolling', verdict: 'pass', note: 'scrollTelemetry only; the chip rail is the UIKit-hosted ChipRail.' },
        { rule: 'Do not hard-code white or black', verdict: 'departure', note: 'The page is always dark over the dimmed wallpaper, so the card and tiles use fixed inks there (Surface.secondaryOnModule); the same card in a sheet uses the adaptive inks (direction-g.md Layers).' },
      ],
    },

    notes: [
      'Splits: none. Security is always one full-width column (split-view.md); on the unfolded Duo landscape and iPad landscape the alarm card stretches the full width because AlarmPanel on the page has no maximum width (the sheet caps it at 560 pt). Hinge-aware even columns apply to the Doors and camera grids, but the page is not hinge-aware: on the unfolded Duo landscape the fold crosses the alarm card, the third door tile and the third camera here (the content is 868 pt wide, its centre is 41 pt left of the fold). Not run on a device; check before relying on it.',
      'empty: Security has no empty state: the card, three doors and four cameras always exist; guests appear only while a toggle is on (state guests).',
      'loading: AlarmPanel and the chips ignore valuesPending (only GlassTile reads it), so first sign-in shows "Unavailable" on the card and chips while the door tiles show soft pending bars. Worth a design decision; not changed here.',
      'Docs versus code: spec.md lists the alarm as a tile in a "Security" section that opens the sheet; the native page draws the card inline above a "Doors" grid, and the web\'s "Vehicle" section is the hidden "Mach-E".',
      'Docs versus code: ios.md says the Security System sheet is opened by the Security chip and the card; on this page the Disarm alert is attached to the card on the page itself (no sheet underneath).',
      'Door tile glyphs: LockTile uses "lock" and "lock.open", the vehicle tile "car"; garage tiles use door.garage.closed or .open from SymbolMap. Kit stand-ins are drawn.',
      'Promote to kit: SecClimate.doorTile (LockTile, GarageDoorTile), the Security page body, and the missing symbols (car, circle and others, registered in components/climate/_security-climate.js).',
      'Kit gap found: the atlas rule `.k-wrap h2` leaks into the app header `.ui-hdr h2` (adds a 44 pt top margin); worked around locally in _security-climate.js.',
      'Cameras are the four shared go2rtc streams (CameraGrid, idPrefix security.camera); pictures are stand-ins.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: 21 states, five devices, alarm modes, door and garage sequences, guests, cameras, Mach-E (gallery only).' }],
  });
})();
</script></body></html>
