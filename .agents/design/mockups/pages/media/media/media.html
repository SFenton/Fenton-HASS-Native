<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media · page mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../components/media/_media-lights-cameras.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components;
  function page(ctx, o) { return MLC.mediaPage(ctx, o || {}); }
  function tileEl(stage, title) { return stage.querySelector('.ui-tile[aria-label^="' + title + '"]'); }
  function homePage(ctx) { return Mock.page(ctx, { title: 'Home', section: 'home', badge: 3, choresBadge: 2, body: [K.ChipRail({ chips: Mock.chips.home(), frame: { x: 0, w: ctx.contentW } })] }); }
  function remoteOpts(ctx) { var r = MLC.remotes['living-room-shield']; return { title: r.title, subtitle: r.sub, detent: 'large', size: 'page', trailing: 'close', content: MLC.remoteBody(ctx, r, {}), tabs: MLC.remoteTabs(ctx, r, 'controls') }; }

  Mock.mount({
    kind: 'page', id: 'media', title: 'Media', area: 'media', status: 'shipped',
    summary: 'Every TV and media source in the house, one section per room: the room\'s TV leads on its own row and opens its remote; sources and quick launches run in place. Pushed under Home from Quick Links; dark page on the house photo.',
    source: ['apple/Sources/HassUI/Features/Media/MediaScreen.swift', 'apple/Sources/HassCore/Config/MediaPageConfig.swift', 'apple/Sources/HassUI/Features/Home/HomeRoute.swift', 'apple/Sources/HassDesign/GlassTile.swift', 'apple/Sources/HassDesign/DynamicGridLayout.swift'],
    spec: ['.agents/pages/media/spec.md', '.agents/pages/media/ios.md'],
    patterns: ['entity-tile', 'media-remote', 'dynamic-grid', 'page-backdrop', 'header-edge-fade'],
    hig: ['Layout', 'Buttons', 'Toolbars', 'Color', 'Dynamic Type'],
    entities: ['media_player.living_room_shield', 'media_player.music_room_tv_android', 'sensor.music_room_active_media_source', 'media_player.sony_projector', 'input_boolean.is_nintendo_switch_active', 'input_boolean.is_theater_shield_active'],
    kitComponents: ['GlassTile', 'TileGrid', 'PageSectionHeader', 'NavigationGlass', 'ReconnectingArc', 'OfflineChip', 'ChipRail'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-landscape', 'duo-unfolded-portrait', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'Living Room playing, Music Room on, projector on', note: 'section columns follow the width: one on iPhone and the folded Duo, two on iPad portrait and the unfolded Duo (even), three on iPad landscape', render: function (c) { return page(c); } },
      'loading': { title: 'First sign-in, nothing saved', note: 'names at once and a soft pulsing bar where each value goes (GlassTile pending); the page reads EntityStore, so there is no spinner', render: function (c) { return page(c, { mode: 'pending' }); } },
      'refreshing': { title: 'Saved snapshot, fresh values swap in', note: 'identical to default by design: nothing re-fades (owner 2026-10-17)', render: function (c) { return page(c); } },
      'error': { title: 'Every entity unavailable', note: 'subtitles read Unavailable; source and script tiles dim their glyph and cannot be tapped; lead tiles still open their remote (its Power key is how the TV turns on)', render: function (c) { return page(c, { mode: 'unavailable' }); } },
      'offline': { title: 'No network', note: 'values stay on their last state; offline chip under the header; cloud badge on Profile', render: function (c) { return page(c, { connection: 'offline' }); } },
      'reconnecting': { title: 'Connection down 2 s+', note: 'in flight (claude/reconnecting-spinner): arc left of Quick Links; was a "Reconnecting…" chip under the header', render: function (c) { return page(c, { connection: 'reconnecting' }); } },
      'reconnecting-was': { title: 'Reconnecting, today (main)', note: 'the orange chip the arc replaces', render: function (c) { return page(c, { connection: 'reconnecting-chip' }); } },
      'all-off': { title: 'Everything off', note: 'the Living Room lead swaps to the television-off glyph; no tile fills', render: function (c) { return page(c, { mode: 'alloff' }); } },
      'xbox-source': { title: 'Xbox is the Music Room source', note: 'a source tile reads On only for its own source; the others read Off', render: function (c) { return page(c, { mode: 'xbox' }); } },
      'long-text': { title: 'Long tile titles at Large', note: 'titles wrap to a second line; tiles in a row share the tallest height', render: function (c) {
        var secs = MLC.mediaSections('default'); secs[1].cards[3].t = 'Windows PC in the Music Room Closet'; secs[2].cards[1].t = 'Nintendo Switch OLED Docked Console';
        return Mock.page(c, { title: 'Media', section: 'home', back: 'Home', badge: 3, choresBadge: 2, body: [K.TileGrid({ items: secs.map(function (s) { var rest = s.cards.slice(1).map(function (x) { return MLC.mediaTile(x); }); return h('div.ui-section', { style: { gap: '12px', minWidth: 0 } }, K.PageSectionHeader({ title: s.title }), MLC.mediaTile(s.cards[0]), rest.length ? K.TileGrid({ items: rest, min: MLC.fitMin(c, 140, 64), max: 4 }) : null); }), min: MLC.fitMin(c, 340), max: 3, gap: 24, equal: false })] }); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'tiles stack glyph over text; sections and tiles go to one column', render: function (c) { return page(c); } },
      'closed': { title: 'Remote sheet open behind (presenter)', note: 'the page a remote presents from', render: function (c) { return page(c); } },
    },

    motion: [
      { id: 'source-tile', what: 'A source tile turns on in place (Xbox): the colour fills and the subtitle reads On, optimistically', token: 'state 0.6 s ease-in-out, colour only (stateColorTransition on GlassTileFace)', state: 'default',
        source: 'MediaScreen.swift MediaCardTile; MediaRemoteController.tap (optimistic intents revert after 20 to 120 s); motion.md section 6', reduce: 'still cross-fades at 0.2 s',
        play: function (stage) { var t = tileEl(stage, 'Xbox'); return MLC.flip(t, true, 'On').then(function () { return Mock.sleep(500); }).then(function () { return MLC.flip(t, false, 'Off'); }); } },
      { id: 'lead-fill', what: 'The Living Room SHIELD starts playing: its lead tile fills media pink', token: 'state 0.6 s ease-in-out (a house-caused change)', state: 'all-off',
        source: 'GlassTileFace via MediaCardTile; motion-components.md GlassTile', reduce: 'cross-fade at 0.2 s',
        play: function (stage) { var t = tileEl(stage, 'Living Room SHIELD'); return MLC.flip(t, true, 'Playing').then(function () { return Mock.sleep(500); }).then(function () { return MLC.flip(t, false, 'Off'); }); } },
      { id: 'pending-pulse', what: 'First sign-in: a soft bar pulses where each tile\'s state will go', token: 'opacity 0.35 to 1 over 1.4 s, repeats until live data lands', state: 'loading',
        source: 'HassDesign/PendingValue.swift; motion.md section 5', reduce: 'static at 65% opacity', play: function () { return Mock.sleep(2800); } },
    ],

    transitions: [
      { from: 'Quick Links sheet', to: 'Media page', kind: 'push', state: 'default', note: 'Quick Links closes and the page pushes under Home (HomeRoute.media): the system push, interactive back swipe, Back circle leading. Content is present on arrival.',
        play: function (stage) {
          var ctx = Mock.current, a = stage.querySelector('.ui-page'), b = homePage(ctx), parent = a.parentNode; b.style.zIndex = 0; parent.insertBefore(b, a); a.style.zIndex = 1;
          a.hidden = true; return Mock.anim.push(b, (a.hidden = false, a)).then(function () { return Mock.sleep(500); }).then(function () { b.remove(); a.style.zIndex = ''; });
        } },
      { from: 'Lead tile', to: 'Remote sheet', kind: 'sheet', state: 'closed', note: 'Living Room SHIELD, Music Room Remote and Theater Room open their remote (page sheet at full height). The tile is not a zoom: motion.md lists zoom only for tiles that are the thing they open, and no zoom is wired on this page.',
        play: function (stage) { return Mock.presentDemo(stage, remoteOpts(Mock.current), { hold: 1300 }); } },
      { from: 'Source tile', to: 'In place', kind: 'cut', state: 'default', note: 'Xbox, Server, Windows PC, Fortnite, Nintendo Switch and Theater SHIELD run their command and change colour; nothing navigates.', play: function (stage) { return Mock.sleep(300); } },
    ],

    a11y: [
      { rule: 'Reading order', note: 'Back, Quick Links, Profile; the page title; then each room: its heading, the lead tile, the source tiles; the tab bar last. Each section is a container with an identifier (media.section.<room>).' },
      { rule: 'Section headings', note: 'Living Room, Music Room and Theater Room are heading elements (RoomSectionHeader), so the rotor jumps between rooms.' },
      { rule: 'Lead tiles', note: 'Buttons named by the device with its state as the value ("Living Room SHIELD, Playing"); a chevron marks that they open a remote. They are never disabled.' },
      { rule: 'Source and script tiles', note: 'Switches (value On or Off, from the source labels); disabled while their entity is unavailable, which VoiceOver reads as dimmed. State is words and glyph, not only the pink fill.' },
      { rule: 'Targets', note: 'Tiles are 72 pt tall at Large (60 pt minimum is the app rule), far over 44 pt; tiles in a row share the tallest height.' },
      { rule: 'Dynamic Type', note: 'Section width (340 pt) and tile width (140 pt) scale with type; AX5 gives one column, stacked tiles; titles wrap, never truncate.' },
      { rule: 'Reduce Transparency', note: 'Tiles take the solid finish (opaque fills), the wallpaper becomes the plain base colour.' },
    ],

    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Layout: adaptive grids, content never hides behind chrome', verdict: 'pass', note: 'DynamicGridLayout (sections 340 pt, tiles 140 pt) scales with type and width; Duo unfolded rounds columns to an even count.' },
        MLC.R.target44, MLC.R.colorNotAlone,
        { rule: 'Toolbars: Back for a pushed page; Quick Links and Profile trailing on every page', verdict: 'pass', note: 'Pushed under Home: glass Back replaces the hamburger.' },
        { rule: 'Materials: Liquid Glass only on the navigation layer', verdict: 'pass', note: 'Tiles are tinted-glass content-layer tiles; the header circles and tab bar are glass.' },
        { rule: 'Navigation: Quick Links as a header button, not a tab', verdict: 'departure', note: 'Owner decision 2026-10-16 (direction-g.md Navigation).' },
      ],
      swiftui: [
        MLC.R.scaled, MLC.R.motionTokens,
        { rule: 'Use the shared tile, never a parallel implementation', verdict: 'pass', note: 'GlassTile(family: .media); the Music Room controller is shared with its remote so an optimistic source change shows on both.' },
        { rule: 'No per-frame state writes while scrolling', verdict: 'pass', note: 'scrollTelemetry only; the page measures nothing per frame.' },
        { rule: 'Tile tap semantics', verdict: 'fix', note: 'ios.md says RemoteGlassTile adds selection traits "TODO(orchestrator)": source tiles read as toggles, which is right for On/Off but not for the Music Room source choice (selected). Fold .selection into GlassTile.Kind.' },
      ],
    },

    notes: [
      'empty: this page has no empty state; the sections come from MediaPageConfig and every card always draws (an unavailable entity shows in the error state).',
      'The Master Bedroom Apple TV is not on this page (web parity, spec.md); it opens from the Master Bedroom room page. The brief\'s statesHint lists it; it is drawn in the media-remote-sheet mockup.',
      'Code versus docs: ios.md says the page is "pushed from the Quick Links sheet"; the code pushes HomeRoute.media onto the Home stack (Back leads to Home), drawn here.',
      'Fortnite shows the controller glyph: its artwork lives in the web bundle, not on the server (ios.md). It is a Quick App Launch tile on this page, a toggle tile whose entity is the Music Room active source.',
      'Xbox\'s tile says On only while the active source is Xbox or Fortnite (MediaPageConfig); the Devices row in the Music Room remote uses a different resolver (cloud state or the Sync Box path), so the two can disagree.',
      'The reconnecting arc is in flight on claude/reconnecting-spinner; main still shows the orange chip (state reconnecting-was).',
      'Sample states are the gallery fixtures. Wallpaper and glyphs are kit stand-ins.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: three rooms, every tile state, six devices, AX5, offline and reconnecting.' }],
  });
})();
</script></body></html>
