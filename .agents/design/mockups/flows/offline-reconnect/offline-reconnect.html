<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline and reconnect · flow mockup</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<script src="../../_kit/kit.js"></script>
<script src="../../pages/login/_login-launch-flows.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, LL = Mock.LL, A = Mock.anim;
  var REVIEW_DATE = '2026-10-23';
  var SNAP = ['snapshot', 'snapshot', 'snapshot', 'snapshot'];
  function home(connection, o) { return function (ctx) { return LL.homePage(ctx, Object.assign({ connection: connection }, o)); }; }
  function settings(connection) { return function (ctx) { return LL.haSettings(ctx, { connection: connection }); }; }

  Mock.mount({
    kind: 'flow', id: 'offline-reconnect', title: 'Offline and reconnect', area: 'shell', status: 'in-flight:claude/reconnecting-spinner',
    summary: 'What the person sees when the house connection drops. A blip under 2 s shows nothing. A retrying connection shows a small arc in the header (in flight; today the orange Reconnecting chip under it). No network at all shows the offline chip at once and a cloud on Profile. Values stay on screen and never blank; nothing animates on reconnect itself.',
    source: ['apple/Sources/HassUI/App/Shell/ReconnectingOverlay.swift', 'apple/Sources/HassUI/App/Shell/ReconnectingChip.swift', 'apple/Sources/HassUI/Features/Settings/HomeAssistantSettingsView.swift', 'apple/Sources/HassCore/Connection/ReconnectingPolicy.swift', 'apple/Sources/HassUI/App/AppSession.swift'],
    spec: ['.agents/platforms/apple/connection-lifecycle.md', '.agents/design/direction-g.md', '.agents/design/reconnecting-spinner.md'],
    patterns: ['resume-lifecycle', 'motion'],
    hig: ['Loading', 'Feedback', 'Motion', 'Accessibility'],
    kitComponents: ['ReconnectingArc', 'OfflineChip', 'ProfileButton', 'ArcSpinner'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-portrait', 'duo-unfolded-landscape', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'connected': { title: '1 · Connected', note: 'live values, cameras live, nothing extra in the header', render: home('live') },
      'down-under-2s': { title: '2 · Down, under 2 s: nothing', note: 'ReconnectingPolicy.delay is 2 s so a blip never shows anything; identical to connected', render: home('live') },
      'reconnecting-arc': { title: '3 · Down 2 s+: the arc (target, in flight)', note: 'branch claude/reconnecting-spinner: a 20 pt white arc 12 pt left of Quick Links; no text, not a control. On the Duo rail it stays in the page header', render: home('reconnecting', { cams: ['snapshot', 'connecting', 'snapshot', 'snapshot'] }) },
      'reconnecting-chip': { title: '3 · Down 2 s+: the chip (today, main)', note: 'the "was": an orange breathing dot and "Reconnecting…" in a capsule under the header at the trailing edge', render: home('reconnecting-chip', { cams: SNAP }) },
      'offline-chip': { title: '4 · No network: the offline chip', note: 'shown at once, no 2 s wait; "Offline. Showing last known values."; the Profile button carries a cloud badge; no arc (nothing is retrying)', render: home('offline', { cams: SNAP }) },
      'values-stay-stale': { title: '5 · Values stay on screen', note: 'chips, weather and the last camera snapshots are kept ("Last live ..."); nothing blanks, re-fades or reorders while down', render: home('reconnecting', { cams: SNAP }) },
      'live-again': { title: '6 · Live again', note: 'the arc (or chip) leaves; values update in place; nothing animates on reconnect itself', render: home('live') },
      'settings-reconnecting': { title: 'HA settings: Connection row, retrying', note: 'Home Assistant settings reads the same connection: "Reconnecting…" (no Version row while it is down)', render: settings('Reconnecting…') },
      'settings-offline': { title: 'HA settings: Connection row, offline', note: '"Offline"; the account rows keep the last user, or read "Unavailable offline" when none was loaded', render: settings('Offline') },
      'settings-rejected': { title: 'HA settings: server refused the token', note: '"Signed out by server" is momentary: a rejected token ends the session and shows the welcome back sign-in (flows/session-expired-welcome-back)', render: settings('Signed out by server') },
      'ax5': { title: 'Accessibility 5 text size (offline)', override: { ts: 'ax5' }, render: home('offline', { cams: SNAP }) },
    },

    motion: [
      { id: 'arc-in-out', what: 'In flight: the header arc fades in once down 2 s, out when live again', token: 'crossFade 0.35 s each way (MotionTokens.crossFade); present then lit: a blip never shows it, coming back mid-fade re-lights it where it is', state: 'reconnecting-arc',
        source: 'HassUI/App/Shell/ReconnectingArc.swift, ReconnectingIndicatorHost.swift (claude/reconnecting-spinner)', reduce: 'unchanged: opacity is not motion, so Reduce Motion keeps it; the arc itself turns at half speed, never still',
        play: function (stage) { var slot = stage.querySelector('.ui-slot'); slot.classList.remove('on'); return Mock.sleep(300).then(function () { return A.arc(slot, true); }).then(function () { return Mock.sleep(1100); }).then(function () { return A.arc(slot, false); }); } },
      { id: 'chip-in-out', what: 'Today (main): the Reconnecting or Offline chip appears under the header', token: 'standard 0.3 s smooth: opacity plus a move in from the top edge (`.move(edge: .top)`, the chip with its header padding); Reduce Motion: crossFade 0.35 s', state: 'reconnecting-chip',
        source: 'HassUI/App/Shell/ReconnectingOverlay.swift (animation on showsChip, transition)', reduce: 'cross-fade only, no move',
        note: 'The catalog and the owner\'s notes say a 10 pt move; the code\'s transition is .move(edge: .top) on the padded chip, which slides it down from above the header by its whole height. Drawn per the code.',
        play: function (stage) {
          var row = stage.querySelector('.ui-conn-row').parentNode, dy = -(Mock.current.device.barTop + 44 + 36);
          if (Mock.settings.reduceMotion) return A.fade(row, { ms: 350 });
          var go = function (from, to) { return row.animate([{ opacity: from.o, transform: 'translateY(' + from.y + 'px)' }, { opacity: to.o, transform: 'translateY(' + to.y + 'px)' }], { duration: A.ms.standard(), easing: A.easing.standard, fill: 'both' }).finished.catch(function () {}); };
          return go({ o: 0, y: dy }, { o: 1, y: 0 }).then(function () { return Mock.sleep(900); }).then(function () { return go({ o: 1, y: 0 }, { o: 0, y: dy }); });
        } },
      { id: 'dot-breathes', what: 'The chip\'s orange dot breathes while reconnecting', token: 'opacity 0.45 to 1, 1.4 s sine, repeating (TimelineView); the kit draws it as a CSS pulse', state: 'reconnecting-chip', source: 'HassUI/App/Shell/ReconnectingChip.swift dotOpacity(at:reduceMotion:)', reduce: 'the dot holds lit (opacity 1)',
        play: function () { return Mock.sleep(3000); } },
      { id: 'values-in-place', what: 'Live values return in place; nothing animates because the connection came back', token: 'none (colour changes use state 0.6 s as ever, numbers roll 0.2 s)', state: 'values-stay-stale', source: 'motion.md section 3 row "Resume, reconnect, snapshot load"; section 6', reduce: 'unchanged',
        play: function (stage) { var pills = [].slice.call(stage.querySelectorAll('.ui-cam .state')); return Mock.sleep(300).then(function () { return Promise.all(pills.map(function (p) { return A.fade(p, { from: 1, to: 0, ms: A.ms.quick() }); })); }).then(function () { return Mock.sleep(300); }); } },
    ],

    transitions: [
      { from: 'Connected', to: 'Reconnecting (arc)', kind: 'fade', state: 'connected', note: 'After 2 s down the arc is placed and fades up over 0.35 s; Quick Links and Profile never move (the group grows to the left). In flight; today the chip fades and moves in under the header.',
        play: function (stage) {
          var bar = stage.querySelector('.ui-bar'), qb = bar.querySelector('[aria-label="Quick Links"]');
          var slot = K.ReconnectingArc({ on: false }); bar.insertBefore(slot, qb); return Mock.sleep(300).then(function () { return A.arc(slot, true); }).then(function () { return Mock.sleep(900); }).then(function () { return A.arc(slot, false); });
        } },
      { from: 'Reconnecting', to: 'Rejected token', kind: 'cut', state: 'reconnecting-arc', note: 'If Home Assistant refuses the token the connection status becomes rejected: that is not a "down" state (no arc, no chip) but ends the session and swaps to the welcome back sign-in. See flows/session-expired-welcome-back.',
        play: function () { return Mock.sleep(600); } },
    ],

    a11y: [
      { rule: 'The arc (in flight)', note: 'One element, "Reconnecting to Home Assistant", updatesFrequently, no action and no 44 pt target (a status, not a control). Reduce Motion turns the arc at half speed, never still, because a still arc reads as frozen.' },
      { rule: 'The chip (today)', note: 'One combined element. Reconnecting: label "Reconnecting to Home Assistant" (identifier reconnecting.chip). Offline: "Offline. Showing last known values." (offline.chip). The dot and the cloud glyph are hidden.' },
      { rule: 'Not colour alone', note: 'The chip has words; the arc has a spoken label and a turning shape; the Profile cloud badge is a glyph.' },
      { rule: 'Profile badge offline', note: 'The Profile button gains a cloud-slash badge; its label is unchanged ("Profile, Stephen Fenton").' },
      { rule: 'Values never clear', note: 'Stale values stay (with "Last live" on cameras) so a person reading with VoiceOver or Switch Control keeps their place; nothing reorders while down.' },
      { rule: 'AX5', note: 'The offline chip wraps to several lines. It is an overlay, not part of the layout, so at AX5 it covers part of the large title and the first chips (the arc does not, it is a header item); the header buttons keep their 44 pt.' },
    ],

    reviews: {
      date: '2026-10-23', by: 'apple-hig skill, swiftui-pro skill',
      hig: [
        { rule: 'Feedback: show a problem without blocking', verdict: 'pass', note: 'A small chip or badge only; values stay (ReconnectingOverlay.swift; AGENTS.md No reload on reopen).', by: 'apple-hig skill' },
        { rule: 'Loading: no indicator for a wait too short to matter', verdict: 'pass', note: 'ReconnectingPolicy.delay is 2 s; offline shows at once (ReconnectingPolicy.swift:10).', by: 'apple-hig skill' },
        { rule: 'Motion: Reduce Motion', verdict: 'pass', note: 'Chip moves are dropped and the dot holds lit (ReconnectingOverlay.swift:38; ReconnectingChip.swift:18-20).', by: 'apple-hig skill' },
        { rule: 'Motion: make motion optional (arc, in flight)', verdict: 'departure', note: 'The in-flight arc keeps turning at half speed under Reduce Motion, owner 2026-10-14. Branch not in this tree; from the mockup and the doc.', by: 'apple-hig skill' },
      ],
      swiftui: [
        { rule: 'A task per state, cancelled on change', verdict: 'pass', note: '.task(id: state) in ReconnectingOverlay (lines 43-54); a blip never shows.', by: 'swiftui-pro skill' },
        { rule: 'Offline is also spoken on Profile and in settings', verdict: 'pass', note: 'ProfileButton\'s accessibilityValue ends with "Offline" (ShellHeader.swift:230-233); the settings Connection row reads "Offline" (HomeAssistantSettingsView.swift:71, 214-215).', by: 'swiftui-pro skill' },
        { rule: 'Show state in more than colour', verdict: 'pass', note: 'A cloud-slash glyph on Profile and words in the chip (ShellHeader.swift:338-352; ReconnectingChip.swift:27-41).', by: 'swiftui-pro skill' },
      ],
    },

    notes: [
      'In flight: the arc is on claude/reconnecting-spinner (unmerged). Main still draws the chip. Both are shown; the arc is the target. When the branch merges the chip states and the chip-in-out motion go away (the offline chip stays).',
      'refreshing, loading, empty, error, long-text: not states of this flow. It is a layer over any signed-in page; the Home page mockup carries those. The page drawn is the trimmed Home of the kit.',
      'Docs vs code: ReconnectingPolicy.showsReconnecting returns false when offline, but main\'s ReconnectingOverlay still shows the chip for both (offline with its own wording); only the branch\'s indicator host uses showsReconnecting to leave the arc out when offline.',
      'The Duo rail: the arc stays in the page header, trailing, opposite the title, and never joins the rail group (reconnecting-spinner.md says "to be confirmed on the Duo simulator").',
      'Dot breathing: the kit draws the dot with a CSS pulse (opacity 0.35 to 1, 1.4 s); the code is a sine from 0.45 to 1 over 1.4 s. Close enough for a stand-in.',
      'HA settings is a full-screen cover whose appearance is inherited from the shell; drawn here as a dark sheet (confirm in the simulator).',
    ],
    changelog: [{ date: REVIEW_DATE, note: 'First pass: connected, blip, arc (target), chip (was), offline, stale values, live again, settings rows, AX5.' }],
  });
})();
</script></body></html>
