<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Todo list section and item row · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/chores/_chores.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, C = window.Chores;

  var ITEMS = C.sections('stephens-chores')[0].items;
  function sw(ctx, surface, cap, node, note) { return C.swatch(ctx, surface, cap, node, note); }
  function both(ctx, cap, make, note) { return h('div.k-swatch-grid', sw(ctx, 'page', cap, make(), note), sw(ctx, 'sheet', cap, make())); }
  function lonely(item, o) { return C.section(Object.assign({ title: 'Past Due', items: [item], edit: true }, o)); }
  function rel(node) { return h('div', { style: { position: 'relative', height: '230px', overflow: 'hidden', borderRadius: '16px' } }, node); }

  Mock.mount({
    kind: 'component', id: 'todo-list-section', title: 'Todo list section and item row', area: 'chores', status: 'shipped', frame: false,
    summary: 'One todo list as a section: a 20 pt header, an optional warning, a compact arc while it has never loaded, then its open tasks as checkable rows on one module. Drawn on the dimmed page and in a sheet (the Your Summary chore tabs reuse it). Size class control picks the width.',
    source: ['apple/Sources/HassUI/Features/Chores/TodoListSection.swift', 'apple/Sources/HassUI/Features/Chores/TodoListAlignment.swift', 'apple/Sources/HassUI/Features/Chores/TodoPageView.swift', 'apple/Sources/HassDesign/ModuleList.swift', 'apple/Sources/HassCore/Todo/TodoItem.swift', 'apple/Sources/HassCore/Todo/TodoRowActions.swift', 'apple/Sources/HassUI/Features/Settings/Profile/SummaryChoresTab.swift'],
    spec: ['.agents/pages/chores/ios.md', '.agents/pages/chores/spec.md'], patterns: ['module-list'],
    hig: ['Lists and tables', 'Context menus', 'Color', 'Dynamic Type'], entities: [], kitComponents: ['ModuleList', 'PageSectionHeader', 'InlineAlert', 'ArcSpinner'], devices: ['iphone', 'ipad-portrait'],
    states: {
      'section': { title: 'A section: header and rows', note: 'dense module (#141416 at 78%) because one row is overdue; thin when nothing is late', render: function (ctx) { return both(ctx, 'Past Due', function () { return C.section({ title: 'Past Due', items: ITEMS, edit: true }); }); } },
      'thin': { title: 'No overdue row: the thin module', render: function (ctx) { return both(ctx, 'Upcoming', function () { return C.section({ title: 'Upcoming', items: [{ title: 'Water the plants', due: 2 * C.D }, { title: 'Book the vet', due: 30 * C.D }], edit: true }); }); } },
      'row-open': { title: 'Row: future due', render: function (ctx) { return both(ctx, 'calendar glyph, secondary ink', function () { return lonely({ title: 'Water the plants', due: 2 * C.D }, { title: 'Upcoming' }); }); } },
      'row-hours': { title: 'Row: overdue under a day', note: 'orange text with a clock', render: function (ctx) { return both(ctx, '#FFB340 (sheet: #995400 in light)', function () { return lonely({ title: 'Take out the recycling', due: -3 * C.H }); }); } },
      'row-long': { title: 'Row: overdue a day or more', note: 'red text with a clock', render: function (ctx) { return both(ctx, '#FF6961 (sheet: #C21717 in light)', function () { return lonely({ title: 'Clean the gutters', due: -9 * C.D }); }); } },
      'row-battery': { title: 'Row: battery task and no due date', note: 'a battery-maintenance task appends its level: "Replace Battery · 18%"; no due line, 52 pt row', render: function (ctx) { return both(ctx, 'no due label', function () { return lonely({ title: 'Replace Battery · 18%', due: null }, { title: 'No Due Date' }); }); } },
      'row-long-title': { title: 'Row: long title wraps', render: function (ctx) { return both(ctx, 'wraps, the check stays on the first line', function () { return lonely({ title: 'Replace the batteries in the upstairs hallway smoke detector and then test every alarm in the whole house', due: -3 * C.H }); }); } },
      'row-no-edit': { title: 'Row: no Edit button (groceries)', note: 'a 16 pt trailing pad instead of the 44 pt Edit target', render: function (ctx) { return both(ctx, 'grocery row', function () { return C.section({ title: 'Grocery List', items: [{ title: 'Oat milk' }, { title: 'Coffee beans' }], edit: false }); }); } },
      'row-done': { title: 'Row: done (not reachable today)', note: 'green filled check, struck-through title in the secondary ink; every list hides completed items, so only a list with hideCompleted false would show it', render: function (ctx) { return both(ctx, 'completed', function () { return C.section({ title: 'Past Due', items: [{ title: 'Take out the recycling', due: -3 * C.H, done: true }], edit: true }); }); } },
      'loading': { title: 'Loading: header and a compact arc', note: 'controller.items is nil: nothing fetched or cached yet', render: function (ctx) { return both(ctx, 'ArcSpinner(.compact), "Loading Past Due"', function () { return C.section({ title: 'Past Due', loading: true }); }); } },
      'error': { title: 'Error: inline warning above the rows', note: '"Unable to update task" (a failed check-off; the row returned) or "Unable to load list"; the rows stay', render: function (ctx) { return both(ctx, 'warning then rows', function () { return C.section({ title: 'Past Due', items: ITEMS.slice(0, 2), edit: true, error: 'Unable to update task' }); }); } },
      'swipe-leading': { title: 'Swipe from the leading edge', note: 'Complete (green); a full swipe performs it', render: function (ctx) { return both(ctx, 'Complete', function () { var s = C.section({ title: 'Past Due', items: ITEMS, edit: true }); var r = s.querySelector('.cz-row'); r.parentNode.replaceChild(C.swipeRow(r.cloneNode(true), 'leading', { dense: true }), r); return s; }); } },
      'swipe-trailing': { title: 'Swipe from the trailing edge', note: 'Delete (red, outermost) then Edit (blue)', render: function (ctx) { return both(ctx, 'Delete, Edit', function () { var s = C.section({ title: 'Past Due', items: ITEMS, edit: true }); var r = s.querySelector('.cz-row'); r.parentNode.replaceChild(C.swipeRow(r.cloneNode(true), 'trailing', { dense: true }), r); return s; }); } },
      'context-menu': { title: 'Context menu', note: 'Complete (or Mark Not Done), Edit, Delete last in red; the row lifts', render: function (ctx) { return h('div.k-swatch-grid', sw(ctx, 'page', 'touch and hold', rel(C.contextMenu(C.row(ITEMS[0], { edit: true }), ['complete', 'edit', 'delete'])))); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the title wraps (and breaks a long word), the check column scales, the Edit target stays 44 pt', render: function (ctx) { return both(ctx, 'AX5', function () { return C.section({ title: 'Past Due', items: ITEMS.slice(0, 2), edit: true }); }); } },
    },
    motion: [
      { id: 'row-leaves', what: 'A task is completed or deleted: its row leaves and the module closes up; if the call fails it returns', token: 'standard 0.3 s smooth (the page\'s one implicit list animation); 0.2 s fade under Reduce Motion', state: 'section',
        source: 'TodoPageView motionSafeAnimation(MotionTokens.standard, reduced: .quick); TodoPageLayout.animationKey; motion.md section 6', reduce: 'the row fades at 0.2 s and nothing slides',
        play: function (stage) { var r = stage.querySelector('.cz-row[data-item="Replace Humidifier Filter"]'); return r ? C.leave(r).then(function () { return Mock.sleep(500); }).then(function () { return C.enter(r); }).then(function () { return Mock.sleep(300); }) : Promise.resolve(); } },
      { id: 'check-colour', what: 'The check circle and title change colour with the task\'s state', token: 'state 0.6 s ease-in-out (0.2 s reduced), colour only (stateForeground)', state: 'row-open',
        source: 'TodoItemRow .stateForeground("TodoItemRow"); motion.md section 6', reduce: 'still cross-fades at 0.2 s',
        play: function (stage) { var r = stage.querySelector('.cz-row'); if (!r) return Promise.resolve(); r.classList.add('done'); return Mock.sleep(Mock.anim.ms.state() + 400).then(function () { r.classList.remove('done'); return Mock.sleep(Mock.anim.ms.state() + 200); }); } },
    ],
    a11y: [
      { rule: 'Toggle row', note: 'The whole left side is one button with the toggle trait: label = title, value "Not done, Due in 3 days" or "Done", hint "Marks the task done." / "Marks the task not done.". Edit is its own 44 x 44 button "Edit {title}".' },
      { rule: 'Custom actions', note: 'Edit and Delete are VoiceOver custom actions on the toggle (Complete is the toggle); Delete asks first. They match the swipe and the context menu (TodoRowActions).' },
      { rule: 'Due is not colour alone', note: 'Glyph (calendar or clock) and words ("2 hours overdue"); orange and red text need the dense module to keep 4.5:1; in a sheet the colours switch to the sheet tokens.' },
      { rule: 'Dynamic Type', note: 'The check follows the title\'s font inside a 24 pt scaled column, centred on the first line; the row is 52 pt (60 with a due line) at minimum and grows.' },
      { rule: 'Hit area', note: 'The whole row, far over 44 pt; the section header is a heading.' },
    ],
    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: "Lists and tables: row anatomy and 44 pt targets", verdict: "pass", note: "Row is 52 pt (60 with a due line), the whole left side toggles, the Edit glyph is a 44 x 44 button (TodoListSection.swift lines 183-232).", by: "apple-hig skill" },
        { rule: "Color: overdue is not colour alone", verdict: "pass", note: "Orange or red DueLabel with a clock glyph and wording; dense module for 4.5:1 (lines 38-41, 249-275).", by: "apple-hig skill" },
        { rule: "Loading: compact arc where a list has never loaded", verdict: "pass", note: "ArcSpinner(.compact, label: \"Loading {title}\") in a 44 pt row (lines 33-36).", by: "apple-hig skill" },
        { rule: "Undo and redo: the done look is unreachable here", verdict: "fix", note: "The strikethrough and green check for a done row can only appear on the Summary sheet's tabs (hideCompleted defaults true); on the pages a tick removes the row with no undo. Medium.", by: "apple-hig skill" },
        { rule: "Materials: a dense module under warm text", verdict: "departure", note: "direction-g.md Layers: #141416 at 78% instead of the thin module when any row is overdue (TodoListSection.swift line 41) so orange and red text keep 4.5:1 over the lit windows.", by: "apple-hig skill" },
      ],
      swiftui: [
        { rule: "Views: one view per ForEach element", verdict: "pass", note: "ForEach(Array(items.enumerated()), id: \\.element.id) emits one row; separators and backgrounds are modifiers (lines 42-55).", by: "swiftui-pro skill" },
        { rule: "Performance: Array(items.enumerated()) in a List body", verdict: "fix", note: "Each update allocates the enumerated array and a Date.now (lines 38, 42); isFirst and isLast could come from item identity, and `now` from TimelineView only when a label needs it. Low.", by: "swiftui-pro skill" },
        { rule: "Accessibility: toggle trait, value, hint", verdict: "pass", note: "accessibilityValue \"Not done, Due in 3 days\" or \"Done\", .isToggle, hint (lines 209-214).", by: "swiftui-pro skill" },
        { rule: "Dynamic Type: scaled check column and wrapping title", verdict: "pass", note: "@ScaledMetric checkColumn and fixedSize vertical title (lines 168, 196).", by: "swiftui-pro skill" },
      ],
    },
    notes: [
      'Surfaces: the dimmed page (the Chores pages) and a sheet (the Your Summary Overdue and Upcoming Chores tabs, which reuse TodoListSection with a tileSurface of .sheet so secondary ink follows the sheet). The sheet swatch follows the Sheet appearance control.',
      'Each row inside the real page is a List row with swipe actions, a context menu and a ModuleRowBackground slice; the swipe and menu are drawn statically here.',
      'In-sheet colours: the swatch uses the kit sheet tokens for the check, edit glyph and due tones; a few of them (overdue orange on a white cell) are the sheet palette (Ink.warning), not the page orange.',
      'Promote to kit: this component (TodoItemRow + TodoListSection) and the swipe drawing; _chores.js holds the local implementation.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: section, every row variant, loading, error, swipe, context menu, page and sheet surfaces.' }],
  });

})();
</script></body></html>
