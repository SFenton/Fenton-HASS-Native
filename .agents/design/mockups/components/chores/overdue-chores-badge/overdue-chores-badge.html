<script>
(function () {
  var h = Mock.h, K = Mock.components, C = window.Chores;

  function parts(ctx) {
    var tab = function (n) { return K.TabBar({ selected: 'chores', badges: { chores: n } }); };

    var wall = h('div.ui-wall'), col = h('div', { style: { position: 'absolute', inset: '70px 0 0 0', padding: '0 16px', display: 'flex', flexDirection: 'column', gap: '18px', overflow: 'hidden', zIndex: 2 } },
      row('Tab bar: 0 (no badge)', tab(0)), row('Tab bar: 3', tab(3)), row('Tab bar: 12 (the system badge prints 12; the kit caps at 9+)', tab(12)),

  function pg(ctx, o) { return Mock.page(ctx, Object.assign({ title: 'Home', section: 'home', body: [K.ChipRail({ chips: Mock.chips.home() })] }, o)); }

  Mock.mount({

    summary: 'The count of the signed-in resident\'s overdue chores, published to the shell by a view modifier: a red badge on the Chores tab (iPhone tab bar, Duo rail), a capsule on the Chores row of the flyout (iPad, unfolded Duo) and, with expired food, on the Profile button. Nothing for a viewer who is not a resident.',
    source: ['apple/Sources/HassUI/Features/Chores/OverdueChoresBadge.swift', 'apple/Sources/HassUI/App/Shell/AppSection.swift', 'apple/Sources/HassUI/App/MainTabView.swift', 'apple/Sources/HassUI/App/Shell/NavigationFlyout.swift', 'apple/Sources/HassUI/App/Shell/ShellHeader.swift', 'apple/Sources/HassCore/Profile/ProfileSummary.swift'],
    spec: ['.agents/pages/chores/spec.md', '.agents/pages/chores/ios.md', '.agents/design/apple/ipados.md'], patterns: [],
    hig: ['Tab bars', 'Badging'], entities: ['todo.stephen_s_past_due_with_unassigned', 'todo.steph_s_past_due_with_unassigned'],
    kitComponents: ['TabBar', 'NavigationFlyout', 'ProfileButton', 'RailGroup'], devices: ['iphone', 'duo-folded', 'ipad-portrait'],
    states: {
      'parts': { title: 'The three surfaces, by count', note: '0 hides the badge; the tab and flyout print the number; Profile caps at 9+', render: parts },
      'tab-3': { title: 'Three overdue: iPhone tab bar, Duo rail, header', note: 'the tab bar (or the Duo rail) carries the badge and the Profile button carries the same count', render: function (d) { return pg(d, { choresBadge: 3, badge: 3 }); } },
      'none': { title: 'Nothing overdue', note: 'count 0 hides the tab badge; Profile has no badge unless food expired', render: function (d) { return pg(d, {}); } },
      'flyout': { title: 'Flyout open (iPad, unfolded Duo, iPhone hamburger)', note: 'the Chores row gets a red capsule with the number; spoken "Chores, 3 overdue"', render: function (d) { return pg(d, { choresBadge: 3, badge: 3, flyoutOpen: true }); } },
      'non-resident': { title: 'Signed in as neither resident', note: 'the modifier publishes nil: no badge anywhere (the web shows none either)', render: function (d) { return pg(d, {}); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the badge keeps its size (a system badge); the Profile badge is a fixed disc', render: function (d) { return pg(d, { choresBadge: 3, badge: 3 }); } },
    },
    motion: [],
    a11y: [
      { rule: 'Spoken', note: 'Flyout row: "Chores, 3 overdue" (NavigationMenu.accessibilityLabel, the capsule itself hidden). The tab bar item is the system item: Label("Chores") with .badge(3), which VoiceOver speaks as the tab name then the badge value, not "overdue" (MainTabView.swift line 114 does not apply the label). Profile: "Profile, Stephen Fenton, 3 items need attention" (its count adds expired food).' },
      { rule: 'Not colour alone', note: 'The badge is a number on red; the count is also in the spoken label and Your Summary\'s Overdue Chores tab.' },
      { rule: 'One source', note: 'The tab, the flyout, the Profile button, Your Summary and the resident page all read the same Past Due list\'s open count (ios.md), so they cannot disagree.' },
    ],
    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: "Badging: a badge for a count that needs attention, none at zero", verdict: "pass", note: "NavigationMenu.badge returns nil for 0 or nil (AppSection.swift lines 81-85) and the tab passes ?? 0 to .badge (MainTabView.swift line 115).", by: "apple-hig skill" },
        { rule: "Tab bars: use the system badge", verdict: "pass", note: "TabView with tabItem Label and .badge(Int) (MainTabView.swift lines 111-116), so the iPhone bar, the iPad bar and the Duo rail place it.", by: "apple-hig skill" },
        { rule: "Accessibility: the badge is spoken with its meaning", verdict: "fix", note: "The \"Chores, 3 overdue\" label is applied only to the flyout row (NavigationFlyout.swift line 137); the TabView item speaks the system badge value, \"3\", with no word saying what it counts. Corrected in this mockup's a11y text. Low.", by: "apple-hig skill" },
        { rule: "Badging: cap large numbers", verdict: "fix", note: "TabView.badge and the flyout capsule print the full number, only the Profile button uses ProfileSummary.badgeText (\"9+\", ShellHeader.swift lines 355-370); three places, two behaviours. Low.", by: "apple-hig skill" },
        { rule: "Color: do not rely on colour alone", verdict: "pass", note: "A number on a red capsule; the count is also in Your Summary's Overdue Chores tab and the Profile value.", by: "apple-hig skill" },
      ],
      swiftui: [
        { rule: "Data flow: publish with onChange(of:initial:)", verdict: "pass", note: "OverdueChoresBadge.body uses onChange(of: overdue, initial: true) to set navigator.overdueChores (OverdueChoresBadge.swift lines 21-25).", by: "swiftui-pro skill" },
        { rule: "Design: fonts and sizes in the badge", verdict: "fix", note: "The Profile badge uses .caption2.weight(.bold) capped with dynamicTypeSize(...xLarge) (ShellHeader.swift lines 359-361); swiftui-pro design: avoid caption2. The flyout capsule uses .caption (NavigationFlyout.swift line 113). Low.", by: "swiftui-pro skill" },
        { rule: "Views: modifier on a stack in the shell", verdict: "pass", note: "The ViewModifier is applied once in MainTabView, so the badge works before the Chores tab is opened (line 48).", by: "swiftui-pro skill" },
      ],
    },
    notes: [
      'Corrected 2026-10-23 by the skill review: the a11y line used to say the tab speaks "Chores, 3 overdue"; that label is applied only in NavigationFlyout.swift line 137, the TabView item uses the system badge.',
      'The kit\'s TabBar prints "9+" past nine, but TabView.badge(Int) prints the number (and the flyout capsule prints the full number); only the Profile button uses ProfileSummary.badgeText ("9+"). Drawn as the kit has it; promote a fix to the kit if exact is wanted.',
      'The badge modifier is applied in MainTabView, so it works before the Chores tab is ever opened; the viewer id is cached in UserDefaults (chores.viewerUserId) and refreshed from auth/current_user.',
      'A viewer who is not a resident (a guest account) gets no badge and no personal copy anywhere.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: tab, rail, flyout and Profile in context and by count.' }],
  });
