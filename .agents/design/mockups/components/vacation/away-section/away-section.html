<!doctype html>
<html lang="en"><head>

<title>Away section and parts · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/vacation/_vacation-sprinklers.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, V = Mock.VS.V;
  var cfg = Mock.componentConfig('AwayParts', { surfaces: ['page', 'sheet'], swatchWidth: '372px' });
  function wide(w) {
    return function (ctx) {
      var inner = h('div.k-swatch.page.g-dark', { style: { width: w + 'px', maxWidth: 'none', flex: 'none' } }, h('div.k-cap', 'page · AwaySectionGrid at ' + w + ' pt'), h('div.in', Mock.components.AwayParts({ kind: 'grid' })));
      return h('div', { style: { overflowX: 'auto' } }, inner);
    };
  }
  cfg.states['grid-narrow'] = { title: 'AwaySectionGrid, one column (iPhone, folded Duo, portrait)', render: wide(372) };
  cfg.states['grid-wide'] = { title: 'AwaySectionGrid, two columns (iPad, unfolded Duo landscape)', render: wide(820) };
  Mock.mount(Object.assign(cfg, {
    states: cfg.states,
    id: 'away-section', title: 'Away section, section grid, action button, notice box', area: 'vacation', status: 'shipped',
    summary: 'The pieces Vacation Mode and Solo Trip are built from: AwaySection (optional title, description, content), AwaySectionGrid (two sections side by side from 340 pt each), AwayActionButton (prominent, bordered, destructive), SoloTripNoticeBox (an InfoBox) and the error InlineAlert. Variants are drawn on the page and the sheet surface.',
    source: ['apple/Sources/HassUI/Features/Vacation/VacationComponents.swift', 'apple/Sources/HassUI/Features/Vacation/SoloTripScreen.swift', 'apple/Sources/HassDesign/InfoBox.swift', 'apple/Sources/HassDesign/PrimaryButton.swift', 'apple/Sources/HassDesign/SettingsSection.swift'],
    spec: ['.agents/pages/vacation/ios.md', '.agents/patterns/settings-section.md', '.agents/patterns/info-box.md'],
    patterns: ['settings-section', 'info-box', 'dynamic-grid'],
    hig: ['Layout', 'Buttons', 'Color', 'Dynamic Type'],
    kitComponents: ['PageSectionHeader', 'TileGrid', 'InfoBox', 'PrimaryButton', 'InlineAlert', 'GlassTile', 'ModuleList'],
    devices: ['iphone', 'ipad-landscape'],
    a11y: [
      { rule: 'AwaySection', note: 'A plain container: the title is a heading (PageSectionHeader on a page, FormHeader 15 pt semibold in a sheet), the description is subheadline secondary text, both wrap (fixedSize vertical). No accessibility element of its own.' },
      { rule: 'AwayActionButton', note: 'A real button with the title as its label. The bordered one has a 50 pt capsule with plain ink on a tinted fill (the tint as text measured 4.2:1 on its own fill, 2026-10-17); a destructive label stays red (it clears 4.5:1). Identifiers soloTrip.status.<action>.' },
      { rule: 'SoloTripNoticeBox', note: 'An InfoBox: one element reading the title then the message. Green only for a state Home Assistant has confirmed; neutral otherwise. Identifier soloTrip.notice.' },
      { rule: 'Inline error', note: 'Red text with a circle glyph, read as an error, placed under the control it concerns.' },
      { rule: 'Grid', note: 'AwaySectionGrid is a DynamicGridLayout (min 340, max 2): reading order is the source order, mode section first, in one column or two.' },
      { rule: 'Dynamic Type', note: 'Everything uses system text styles and wraps; the grid minimum is 340 pt, so at AX5 it is one column. Check with the Text size control.' },
    ],
    reviews: { date: '2026-10-23', by: 'author',
      hig: [{ rule: 'Buttons: a prominent action is filled; secondary actions are tinted or plain; destructive is red', verdict: 'pass', note: 'Primary capsule, bordered action, bordered destructive.' },
        { rule: 'Color: legible text on tinted fills', verdict: 'pass', note: 'Plain ink on the tinted bordered fill; the notice text stays the primary label on a 16% wash.' },
        { rule: 'Layout: adapt to the available width', verdict: 'pass', note: 'One or two columns by width.' },
        { rule: 'Headings: a section title should add information', verdict: 'departure', note: 'No title is drawn above the mode section: the navigation title already says it (owner 2026-10-13).' }],
      swiftui: [{ rule: 'Use the environment to switch surface styles', verdict: 'pass', note: 'AwaySection reads tileSurface: PageSectionHeader on a page, FormHeader in a sheet.' },
        { rule: 'Scaled text styles', verdict: 'pass', note: 'subheadline and body; no fixed sizes.' },
        { rule: 'Animate colour with the app token', verdict: 'pass', note: 'Buttons and notices have no explicit colour animation; tiles use stateColorTransition.' }] },
    notes: [
      'The sheet surface variants are legacy: AwaySection\'s doc comment says Vacation opens in the Account and Quick Links sheets, but Settings is a tab now, so only the page style ships on these pages.',
      'AwayParts is a local registration that bundles the five pieces for this one mockup; the real types are separate SwiftUI views. Promote to kit: a builder per piece.',
      'The bordered button is drawn as a 50 pt capsule at the tint\'s 22% fill; the exact system bordered large style on iOS 26 was not measured.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: section, grid, three buttons, two notices, error.' }],
  }));
})();
</script></body></html>
