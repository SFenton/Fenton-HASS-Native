<script>
(function () {
  var cfg = Mock.componentConfig('VacationDateFields', { surfaces: ['page', 'sheet'], swatchWidth: '372px' });
  Mock.mount(Object.assign(cfg, {
    states: cfg.states,
    id: 'vacation-date-fields', title: 'Vacation date fields (start, end, range error)', area: 'vacation', status: 'shipped',
    summary: 'VacationDateFields: the vacation\'s start and end, each one compact date-and-time picker on a material row (ScheduleDateFields), under the dates description; a range error appears between the description and the fields when the start is not before the end. Used inline on Vacation Mode (writes after 0.9 s) and in the Confirm Vacation sheet (a local draft).',
    source: ['apple/Sources/HassUI/Features/Vacation/VacationModeScreen.swift', 'apple/Sources/HassDesign/ScheduleDateFields.swift', 'apple/Sources/HassCore/Config/VacationConfig.swift'],
    spec: ['.agents/patterns/schedule-date-fields.md', '.agents/pages/vacation/ios.md'],
    patterns: ['schedule-date-fields', 'settings-section'],
    hig: ['Date pickers', 'Layout', 'Dynamic Type', 'Dark Mode'],
    kitComponents: ['ScheduleDateFields', 'InlineAlert'],
    devices: ['iphone', 'ipad-portrait'],
    a11y: [
      { rule: 'Field', note: 'A labelled row at least 44 pt tall: a wrapping Text label ("Starts") beside a label-hidden compact DatePicker that carries the same accessibility label; identifiers vacation.dates.start and .end (inline) or vacation.confirm.start and .end (sheet).' },

      { rule: 'Commit', note: 'On the page each change is held for 0.9 s of quiet, then written once; the draft clears when the saved value changes or 3 s after reporting.' },

    reviews: {
