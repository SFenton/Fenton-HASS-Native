<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick link and room navigation tile · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/rooms/_rooms.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, R = Mock.rooms;
  function box(kind, ctx, label, nodes) { return h('div.k-swatch.' + kind + (kind === 'page' ? '.g-dark' : '.in-sheet.' + (ctx.appearance === 'dark' ? 'g-dark' : 'g-light')), { style: { flex: '1 1 100%' } }, h('div.k-cap', label), nodes); }

  var cfg = Mock.componentConfig('QuickLinkTile', { surfaces: ['sheet'] });
  var rooms = R.rooms.slice(0, 8).map(function (r) { return Mock.tile({ title: r.title, symbol: r.sym, fill: r.fill, kind: 'navigate', layout: 'stack', titleLines: 2 }); });
  cfg.states['in-context'] = { title: 'In context: the Quick Links grid and the Rooms grid', note: 'two columns, one height, glyph top-leading, name on the bottom line; the Rooms grid shows eight of sixteen', render: function (ctx) {
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '18px' } }, box('sheet', ctx, 'sheet · QuickLinksGrid', h('div.rm-qlwrap', R.qlGrid())), box('sheet', ctx, 'sheet · RoomNavigationGrid (first eight)', K.TileGrid({ items: rooms, min: 140, max: 4 })));
  } };
  cfg.states.ax5 = { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, render: cfg.states.states.render };

  Mock.mount(Object.assign(cfg, {
    states: cfg.states,
    id: 'quick-link-tile', title: 'Quick link and room navigation tile', area: 'rooms', status: 'shipped',
    summary: 'A solid-colour navigation tile: a filled white glyph top-leading, white name on the bottom line (two lines reserved), a chevron centred on the trailing edge, and for some links a state line. Seven Quick Links (Security System follows the alarm mode) and sixteen rooms use it; the colour is fixed, the same in light and dark.',
    source: ['apple/Sources/HassUI/Features/Rooms/QuickLinksSheet.swift', 'apple/Sources/HassDesign/QuickLinkPalette.swift', 'apple/Sources/HassDesign/RoomPalette.swift', 'apple/Sources/HassDesign/GlassTile.swift', 'apple/Sources/HassDesign/TileLayout.swift', 'apple/Sources/HassCore/Rooms/RoomNavigation.swift'],
    spec: ['.agents/design/direction-g.md', '.agents/patterns/entity-tile.md', '.agents/pages/rooms/ios.md'],
    patterns: ['entity-tile', 'dynamic-grid', 'motion'],
    hig: ['Color', 'Typography', 'Dynamic Type', 'Buttons', 'Accessibility', 'Dark Mode'],
    entities: ['alarm_control_panel.aqara_hub_m3_0056_security_system_2', 'sensor.evershelf_total_items', 'sensor.evershelf_expiring_soon'],
    kitComponents: ['GlassTile', 'TileGrid'],
    devices: ['iphone', 'ipad-portrait'],
    motion: [
      { id: 'security-colour', what: 'The Security System tile follows the alarm mode: fill cross-fades and the glyph swaps', token: 'state 0.6 s ease-in-out (0.2 s reduced), colour only; glyph swap is the system symbol replace', state: 'variants',
        source: 'HassDesign/GlassTile.swift stateColorTransition; QuickLinks.securityAppearance; motion.md section 6', reduce: 'cross-fades at 0.2 s; the glyph swap is an identity change',
        play: function (stage) { var t = [].filter.call(stage.querySelectorAll('.ui-tile'), function (x) { return x.querySelector('.ti').textContent === 'Security System'; })[0]; if (!t) return Promise.resolve();
          t.style.setProperty('--fill', 'var(--fam-sec-away-fill)'); t.querySelector('.glyph').innerHTML = Mock.icon('shield', { fill: true }); var s = t.querySelector('.st'); if (s) s.textContent = 'Armed Away'; return Mock.sleep(Mock.anim.ms.state() + 300); } },
    ],
    a11y: [
      { rule: 'Name, role, hint', note: 'One button: label = name (plus the state line as value, "Security System, Armed Home"); hint "Opens Rooms in Quick Links" for the two that push inside the sheet and "Opens the Media page" for the rest; a room says "Opens the Kitchen page". Identifiers quickLinks.<id> and rooms.<path>. The tile is the control, never wrapped in a Button.' },
      { rule: 'Contrast', note: 'White ink on every fill is at least 4.5:1 (rooms 4.7:1 or better); Rooms navy is at least 0.05 OKLab from every room, family and alarm fill so it never reads as a state.' },
      { rule: 'Not colour alone', note: 'The name is always written; Security System\'s mode is in words and in a glyph per mode; a redacted screenshot shows the plain shield.' },
      { rule: 'Targets and layout', note: '96 pt tall at the default size (glyph + 8 pt + two title lines + padding), equal across a grid, growing with text; chevron vertically centred with its own reserve so text never runs under it.' },
      { rule: 'Dynamic Type', note: 'Two title lines reserved at every size; one column at AX sizes.' },
      { rule: 'Light and dark', note: 'Fixed fills and fixed white ink: identical in both appearances; tinted glass adds the translucent fill and highlight on a page and only the bottom shade and hairline in a sheet.' },
    ],
    reviews: {
      date: '2026-10-23', by: 'author',
      hig: [
        { rule: 'Color: contrast of text on colour', verdict: 'pass', note: 'Fills were moved from the web values until white held 4.5:1 (RoomPalette, QuickLinkPalette).' },
        { rule: 'Buttons: 44 pt minimum target', verdict: 'pass', note: '96 pt tiles.' },
        { rule: 'Color: not the only differentiator', verdict: 'pass', note: 'Name, glyph, state line.' },
        { rule: 'Typography: Dynamic Type', verdict: 'pass', note: 'Scaled minimum width and title lines.' },
        { rule: 'Color: colour should carry consistent meaning', verdict: 'departure', note: 'Sixteen room hues and seven link hues are recognition aids, chosen not to collide with device families or alarm modes (direction-g.md Colour: Room tiles, Quick Links tiles; owner 2026-10-16).' },
      ],
      swiftui: [
        { rule: 'One tile component for every tile', verdict: 'pass', note: 'GlassTile(fillRGB:) with .tileLayout(.anchoredBottom).tileTitleLines(2); no parallel view.' },
        { rule: 'Pure palette lookups tested apart from drawing', verdict: 'pass', note: 'QuickLinkPalette.fill and RoomPalette.fill are static tables with tests.' },
        { rule: 'Do not wrap a non-hit-testable label in a Button', verdict: 'pass', note: 'The tile carries its own action (entity-tile.md, 2026-10-11).' },
        { rule: 'Animate colour with the app token; honour Reduce Motion', verdict: 'pass', note: 'stateColorTransition, 0.2 s reduced.' },
      ],
    },
    notes: [
      'Colours: rooms are RoomPalette.fills (e.g. Kitchen #547F12, Garage #A6222C); links are Rooms #1F3A5F, Security System the alarm mode\'s fill (Home #1565C0, Away #C62828, Night #7B1FA2, Disarmed #2A732E, Triggered #D70015, unknown slate #4C6270), Food the food family, Vacuums cleaning, Media media, Custom Lights amber #7A4A00, Sprinklers water.',
      'Subtitles: Security System the alarm state in title case ("Triggered" here, "Alarm Triggered" on the chip); Food & Recipes "<n> Items • <m> Expiring Soon" (singular "1 Item"); Rooms and the room tiles have none.',
      'Sprinklers shows only while input_boolean.show_outdoor_faucets is on (not in the rooms docs).',
      'Promote to kit: Mock.rooms.qlTile / roomsGrid; the kit\'s GlassTile already draws the solid-fill face.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: seven links, alarm modes, redaction, room tiles, light and dark.' }],
  }));
})();
</script></body></html>
