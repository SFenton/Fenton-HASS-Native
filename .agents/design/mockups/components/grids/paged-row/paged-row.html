<style>
  /* local helper CSS (promote to kit): a paged row of equal cells with a page indicator and previous/next controls */
  .inv-paged { overflow: hidden; width: 100%; position: relative; }

  .inv-pg .stripwrap { position: relative; }
  .inv-pg .stripwrap.ctl { padding: 0 52px; }
  .inv-pg .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: .5px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; transition: opacity var(--t-quick) var(--ease-quick); }
  .inv-pg .nav.prev { left: 0; } .inv-pg .nav.next { right: 0; } .inv-pg .nav[disabled] { opacity: .35; cursor: default; }
  .inv-pg .dots { display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 44px; background: none; border: 0; width: 100%; cursor: pointer; padding: 0; }
  .inv-pg .dots i { display: block; height: 7px; width: 7px; border-radius: 99px; background: rgba(255,255,255,.45); transition: width var(--t-quick) var(--ease-quick), background-color var(--t-quick) var(--ease-quick); }
  .inv-pg .dots i.on { width: 18px; background: #fff; }
  .inv-pg .cell-lab { font-size: var(--fs-foot); color: rgba(235,235,245,.85); }
</style>

        return V.grid([sw(c, 'page', 'Home weather card: 6 per page, page 1 of 4', card({ per: 6, label: '24-hour weather forecast' })), sw(c, 'page', 'page 2 of 4', card({ per: 6, page: 1, label: '24-hour weather forecast' })),

        return V.grid([sw(c, 'page', 'iPad card: 9 per page, controls', card({ per: 9, controls: true, label: '24-hour weather forecast' }), 760), sw(c, 'page', 'narrow regular (a half pane): 6 per page', card({ per: 6, controls: true, page: 1, label: '24-hour weather forecast' }), 520),

      'loading': { title: 'First sign-in: placeholder cells', note: 'WeatherCardHourPlaceholder cells pulse (0.35 to 1 over 1.4 s; static under Reduce Motion); the row still pages so the layout does not change when data arrives', render: function (c) {
