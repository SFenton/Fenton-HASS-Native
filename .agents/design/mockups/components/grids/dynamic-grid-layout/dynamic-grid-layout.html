<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DynamicGridLayout · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/inventory/_inventory.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, V = Mock.inv;
  var NAMES = ['Kitchen', 'Office', 'Gym', 'Guest Room', 'Hallway', 'Garage', 'Back Deck'];
  function tiles(n) { return NAMES.slice(0, n).map(function (t) { return { title: t + ' Light', subtitle: 'Off', symbol: 'lightbulb', family: 'lights' }; }); }
  /** DynamicGridMetrics.init: columns = floor((width + spacing) / (min + spacing)) clamped to 1...max, rounded down to even with a hinge. */
  function cols(w, min, max, gap, even, sc) { var m = min * (sc || 1), n = Math.min(Math.max(Math.floor((w + gap) / (m + gap)), 1), Math.max(max, 1)); if (even && n >= 2) n -= n % 2; return n; }
  function ruler(c, w, o) {
    o = o || {}; var min = o.min || 150, max = o.max || 6, gap = 12, n = cols(w, min, max, gap, o.even, c.scale), cell = ((w - gap * (n - 1)) / n).toFixed(1);
    return V.swatch('page', w + ' pt wide (' + (o.label || '') + '): ' + n + ' column' + (n > 1 ? 's' : '') + ', cell ' + cell + ' pt', K.TileGrid({ items: tiles(o.count || 7), min: min, max: max }), c, w + 28);
  }
  function el(s, kids) { return h('div.ui-section', kids); }
  function embedHome(cx) {
    var names = [['Front Door', 'front-door'], ['Driveway', 'driveway'], ['Upper Deck', 'upper-deck'], ['Lower Deck', 'lower-deck']];
    return Mock.page(cx, { title: 'Home', section: 'home', badge: 3, choresBadge: 2, body: [h('div.ui-section', K.PageSectionHeader({ title: 'Cameras' }), K.TileGrid({ min: 160, max: 4, equal: false, items: names.map(function (n) { return K.CameraTile({ title: n[0], scene: n[1], state: 'live' }); }) }))] });
  }
  function embedRoom(cx) {
    function sec(t, items) { return h('div.ui-section', K.PageSectionHeader({ title: t }), K.TileGrid({ min: 150, max: 2, items: items })); }
    var lights = tiles(3), devs = [{ title: 'Dishwasher', subtitle: 'Idle', symbol: 'drop', family: 'water' }, { title: 'Humidifier', subtitle: 'Off', symbol: 'humidifier', family: 'water' }, { title: 'Range Hood', subtitle: 'Off', symbol: 'fan', family: 'vents' }, { title: 'Master Bedroom Closet Light', subtitle: 'Off', symbol: 'lightbulb', family: 'lights' }];
    return Mock.page(cx, { title: 'Kitchen', back: 'Rooms', section: 'home', badge: 3, choresBadge: 2, body: [K.TileGrid({ min: 340, max: 2, equal: false, gap: 24, items: [sec('Lights', lights), sec('Devices', devs)] })] });
  }

  var base = Mock.componentConfig('TileGrid', { surfaces: ['page', 'sheet'] });
  var cfg = Object.assign(base, {
    states: base.states,
    id: 'dynamic-grid-layout', title: 'DynamicGridLayout (equal heights, spans, grid headers)', area: 'design', status: 'shipped',
    summary: 'The one responsive grid: columns = floor((width + spacing) / (min cell + spacing)) clamped to 1 to max; leftover width is shared; an incomplete last row aligns leading; the minimum scales with Dynamic Type (one column at AX5); equalRowHeights lifts every row to the tallest tile; gridSpan and gridHeader place wide items and section titles; the unfolded Duo rounds the count down to an even number.',
    source: ['apple/Sources/HassDesign/DynamicGridLayout.swift', 'apple/Sources/HassDesign/GlassTile.swift', 'apple/Sources/HassUI/Features/Home/CameraGrid.swift', 'apple/Sources/HassUI/Features/Rooms/RoomScreen.swift'],
    spec: ['.agents/patterns/dynamic-grid.md', '.agents/design/direction-g.md'],
    patterns: ['dynamic-grid', 'entity-tile', 'status-pill'],
    hig: ['Layout', 'Collections', 'Dynamic Type', 'Split views'],
    kitComponents: ['TileGrid', 'GlassTile', 'PageSectionHeader', 'CameraTile'],
    devices: ['iphone', 'ipad-portrait', 'duo-unfolded-landscape'],
    a11y: [
      { rule: 'Reading order', note: 'Tiles read in placement order: row by row, leading to trailing; a gridHeader is its heading row. The layout never reorders for a live value change (motion.md section 6).' },
      { rule: 'Targets', note: 'Tiles are at least 44 pt in both directions at any size (the 150 pt minimum width is scaled with the text).' },
      { rule: 'Dynamic Type', note: 'minCellWidth is multiplied by the text scale, so AX5 yields a single column and no tile truncates; equalRowHeights follows the larger text on every layout pass.' },
      { rule: 'Rotation and unfolding', note: 'The column count is recomputed on each pass; on the unfolded Duo (any pose) it rounds down to an even number (never below two) so no tile straddles the fold.' },
      { rule: 'Spans', note: 'An item never spans more columns than exist; an incomplete last row is not stretched (web UX contract).' },
    ],
    reviews: {
      date: '2026-10-23', by: 'author',
      hig: [
        { rule: 'Layout: adapt to the available width and size class', verdict: 'pass', note: 'Columns follow the width; four is a floor on iPad portrait, never a cap (plan Phase 4, 2026-10-15).' },
        { rule: 'Collections: consistent spacing and alignment', verdict: 'pass', note: '12 pt spacing; leading-aligned incomplete rows.' },
        { rule: 'Split views: avoid content across the fold', verdict: 'pass', note: 'Even column rounding with a hinge.' },
        { rule: 'Dynamic Type: reflow', verdict: 'pass', note: 'Scaled minimum cell width.' },
      ],
      swiftui: [
        { rule: 'Use Layout, not GeometryReader, for custom grids', verdict: 'pass', note: 'DynamicGridLayout is a Layout with a per-width row cache (several proposals per pass).' },
        { rule: 'Read the environment through a wrapper view', verdict: 'pass', note: 'callAsFunction wraps HingeAwareGrid because a Layout cannot read the environment.' },
        { rule: 'Handle infinite proposals', verdict: 'pass', note: 'A non-finite width gives maxColumns at the minimum width (an unbounded probe once trapped on Int(.infinity)).' },
        { rule: 'LazyVGrid for long collections', verdict: 'departure', note: 'The grid measures every child to equalise heights and place spans; collections are tens of tiles, not hundreds.' },
      ],
    },
    notes: [
      'The kit\'s TileGrid uses CSS auto-fill to reproduce the rule; the column counts in the width states are computed with the same formula as DynamicGridMetrics (the swatch title states the count).',
      'Hinge rounding applies on any unfolded Duo pose (the environment hinge is set whenever the fold is open), including portrait, where a 3-column fit becomes 2.',
      'Used by: Home cameras (min 160, max 4), room pages (two 340 pt section columns, each max 2), Chores quick links (max 4), Media (up to three columns), the room overview sheets (equal heights with headers), Sprinklers pills, Vacation sections (min 340, max 2).',
      'TODO(orchestrator) in the pattern doc: the web\'s content-aware spans are not ported.',
      'motion: none. A rotation or unfolding re-lays the grid with the system\'s own transition; nothing is animated by the layout.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: width ruler, spans, grid headers with equal heights, hinge-even columns, AX5 single column, in context.' }],
  });
  cfg.states['widths'] = { title: 'Columns by width (min 150, max 6)', note: 'iPhone 370 pt content: 2; iPad portrait 802: 5; iPad landscape 1162: 6 (the cap). Counts follow floor((w + 12) / 162)', render: function (c) {
    return V.grid([ruler(c, 370, { label: 'iPhone' }), ruler(c, 434, { label: 'unfolded Duo half' }), ruler(c, 560, { label: 'a narrow pane' }), ruler(c, 802, { label: 'iPad portrait' }), ruler(c, 1162, { label: 'iPad landscape, capped at 6', count: 7 })]); } };
  cfg.states['spans-headers'] = { title: 'gridSpan(2), gridHeader and equal heights', note: 'a spanning tile takes two tracks; an incomplete last row stays leading; one wrapping title (Master Bedroom Closet Light) lifts every tile row; a gridHeader takes a whole row and keeps its own height', render: function (c) {
    function hdr(t) { var n = K.PageSectionHeader({ title: t }); n.classList.add('gridheader'); return n; }
    function items() { return [hdr('Lights'), { title: 'Kitchen Light', subtitle: 'On', symbol: 'lightbulb', family: 'lights', isActive: true }, { title: 'Master Bedroom Closet Light', subtitle: 'Off', symbol: 'lightbulb', family: 'lights' }, { title: 'Hall Light', subtitle: 'Off', symbol: 'lightbulb', family: 'lights' }, hdr('Devices'), { title: 'Dishwasher', subtitle: 'Idle', symbol: 'drop', family: 'water' }]; }
    var grid = K.TileGrid({ items: items(), min: 150, max: 6, span: { 5: 2 } });
    return V.grid([V.swatch('page', 'one grid, two headed runs, a span-2 last tile', grid, c, 380), V.swatch('page', 'same, equalRowHeights off (rows keep their own height)', K.TileGrid({ items: items().slice(0, 4), min: 150, max: 6, equal: false }), c, 380)]); } };
  cfg.states['hinge'] = { title: 'Even columns on the unfolded Duo', note: 'unfolded portrait content is about 554 pt: a 3-column fit rounds to 2 so no tile straddles the horizontal fold; landscape rounds 5 to 4', render: function (c) {
    return h('div', V.embed('duo-unfolded-portrait', c, function (cx) { return Mock.page(cx, { title: 'Lights', back: 'Rooms', section: 'home', body: [K.TileGrid({ items: tiles(7), min: 150, max: 6 })] }); }, .5, 'Unfolded portrait: 3 fit, 2 used'),
      V.embed('duo-unfolded-landscape', c, function (cx) { return Mock.page(cx, { title: 'Lights', back: 'Rooms', section: 'home', body: [K.TileGrid({ items: tiles(7), min: 150, max: 6 })] }); }, .5, 'Unfolded landscape: 5 fit, 4 used'),
      V.embed('iphone', c, function (cx) { return Mock.page(cx, { title: 'Lights', back: 'Rooms', section: 'home', body: [K.TileGrid({ items: tiles(7), min: 150, max: 6 })] }); }, .5, 'iPhone: 2 columns')); } };
  cfg.states['in-context'] = { title: 'In context: Home cameras and a room page', render: function (c) {
    return h('div', V.embed('iphone', c, embedHome, .6, 'Home cameras: min 160, max 4 (2 on iPhone)'), V.embed('ipad-portrait', c, embedRoom, .45, 'Room page: two section columns side by side, each its own max-2 grid'), V.embed('iphone', c, embedRoom, .6, 'The same room page on iPhone: sections stack')); } };
  cfg.states['ax5'] = { title: 'Accessibility 5: one column', override: { ts: 'ax5' }, note: 'the minimum cell width scales with the text, so the grid collapses to a single column', render: function (c) { return V.grid([V.swatch('page', 'AX5, 370 pt: 1 column', K.TileGrid({ items: tiles(3), min: 150, max: 6 }), c, 398)]); } };
  cfg.motion = [];
  Mock.mount(cfg);
})();
</script></body></html>
