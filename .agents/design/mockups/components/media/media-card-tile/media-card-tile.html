<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media tile · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../components/media/_media-lights-cameras.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components;
  function card(c, o) { return MLC.mediaTile(c, o); }
  var LEAD_ON = { t: 'Living Room SHIELD', sym: 'tv', offSym: 'tv.slash', lead: true, on: true, sub: 'Playing' };
  var LEAD_OFF = { t: 'Living Room SHIELD', sym: 'tv', offSym: 'tv.slash', lead: true, on: false, sub: 'Off' };
  var LEAD_UN = { t: 'Living Room SHIELD', sym: 'tv', offSym: 'tv.slash', lead: true, on: false, sub: 'Unavailable' };
  var SRC_OFF = { t: 'Xbox', sym: 'gamecontroller', on: false, sub: 'Off' }, SRC_ON = { t: 'Xbox', sym: 'gamecontroller', on: true, sub: 'On' }, SRC_UN = { t: 'Xbox', sym: 'gamecontroller', on: false, un: true, sub: 'Unavailable' };
  function both(ctx, label, node, o) { return MLC.grid([MLC.sw(ctx, 'page', label, node(), Object.assign({ flex: '1 1 260px' }, o)), MLC.sw(ctx, 'sheet', label, node(), { flex: '1 1 260px' })]); }
  var GROUPS = function (items) { return function (ctx) { return MLC.stack(items.map(function (x) { return both(ctx, x[0], x[1], x[2]); })); }; };

  Mock.mount({
    kind: 'component', id: 'media-card-tile', title: 'Media tile', area: 'media', status: 'shipped', frame: false,
    summary: 'The Media page\'s tile: a GlassTile in the media family (dark with a pink glyph while off, filled media pink while on). A lead tile opens its remote (chevron); a source or script tile runs its command in place.',
    source: ['apple/Sources/HassUI/Features/Media/MediaScreen.swift', 'apple/Sources/HassDesign/GlassTile.swift', 'apple/Sources/HassCore/Config/MediaPageConfig.swift'],
    spec: ['.agents/patterns/entity-tile.md', '.agents/pages/media/ios.md', '.agents/design/direction-g.md'],
    patterns: ['entity-tile'], hig: ['Buttons', 'Color'], entities: ['media_player.living_room_shield', 'sensor.music_room_active_media_source'],
    kitComponents: ['GlassTile'], devices: ['iphone', 'duo-folded', 'ipad-portrait'],
    states: {
      'lead': { title: 'Lead tile (opens a remote): off, playing, unavailable', note: 'kind navigate: chevron; never disabled, even unavailable (the remote\'s Power key turns the TV on)', render: GROUPS([['off', function () { return card(LEAD_OFF); }], ['playing', function () { return card(LEAD_ON); }], ['unavailable', function () { return card(LEAD_UN); }]]) },
      'source': { title: 'Source or script tile (runs in place): off, on, unavailable', note: 'a toggle: On or Off from the source labels; unavailable dims the glyph only and disables the tap', render: GROUPS([['off', function () { return card(SRC_OFF); }], ['on', function () { return card(SRC_ON); }], ['unavailable', function () { return card(SRC_UN); }]]) },
      'pending': { title: 'First sign-in (pending)', note: 'the name at once, a soft pulsing bar where the state goes', render: GROUPS([['lead', function () { return card(LEAD_ON, { pending: true }); }], ['source', function () { return card(SRC_OFF, { pending: true }); }]]) },
      'wraps': { title: 'Long title wraps', render: GROUPS([['two lines', function () { return card({ t: 'Nintendo Switch OLED Docked Console', sym: 'gamecontroller', on: true, sub: 'On' }); }]]) },
      'ax5': { title: 'Accessibility 5: stacked tile', override: { ts: 'ax5' }, render: GROUPS([['lead', function () { return card(LEAD_ON); }], ['source', function () { return card(SRC_OFF); }]]) },
    },
    motion: [
      { id: 'tile-fill', what: 'A tile turns on: the media pink fills, the glyph goes white, the subtitle reads On', token: 'state 0.6 s ease-in-out, colour only', source: 'GlassTileFace stateColorTransition; motion-components.md GlassTile', reduce: 'cross-fade at 0.2 s', state: 'source',
        play: function (stage) { var t = stage.querySelector('.ui-tile'); return MLC.flip(t, true, 'On').then(function () { return Mock.sleep(500); }).then(function () { return MLC.flip(t, false, 'Off'); }); } },
    ],
    a11y: [
      { rule: 'Name and value', note: 'A button named by the device with its state as the value; the lead tile\'s chevron marks that it opens a remote. Source tiles are switches (On or Off); unavailable ones are dimmed and cannot be activated.' },
      { rule: 'Not colour alone', note: 'The pink fill is joined by the words On, Off, Playing or Unavailable and the glyph (television-off while off).' },
      { rule: 'Targets and type', note: '72 pt minimum height; wraps at large sizes; AX sizes stack the glyph over the text.' },
      { rule: 'Contrast', note: 'White on the pink fill is 4.5:1 or better (media fill #A03A61); the off glyph is the family colour mixed toward grey on the dark module.' },
    ],
    reviews: { date: '2026-10-23',
      hig: [MLC.R.target44, MLC.R.colorNotAlone, MLC.R.glass, { rule: 'Buttons: a tile that opens something shows a disclosure', verdict: 'pass', note: 'Chevron on lead tiles only.' }],
      swiftui: [MLC.R.scaled, MLC.R.motionTokens, { rule: 'One tile implementation', verdict: 'pass', note: 'GlassTile; no parallel card (pattern-first).' }] },
    notes: ['Page and sheet swatches are shown because the same tile style is used on room pages (module) and in sheets (cell); on the Media page itself it is always on the dark page.', 'The kit GlassTile draws the face; the card data (titles, glyphs, labels) comes from MediaPageConfig (components/media/_media-lights-cameras.js).'],
    changelog: [{ date: '2026-10-23', note: 'First pass.' }],
  });
})();
</script></body></html>
