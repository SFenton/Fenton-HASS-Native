<script>

  }

        { rule: "Loading: show something quickly, without flashing a placeholder", verdict: "departure", note: "While loading the frame stays empty so a fast load fades straight in (CachedImage.swift lines 31 to 32), and a memory-cached image draws on the first frame so cells scrolling back never flash; the placeholder symbol shows only for no URL or a failure.", by: "apple-hig skill" },
        { rule: "Typography and Color: captions over photos keep 4.5:1; failure states stay legible", verdict: "pass", note: "ImageCard puts white text over a bottom scrim already 55% black by half the card height, and the failure glyph uses Ink.secondary because the system gray measured about 3:1 on the card; at accessibility sizes the card becomes a row with a thumbnail on a module.", by: "apple-hig skill" },
        { rule: "Privacy: sensitive content is not kept longer or more widely than needed", verdict: "pass", note: "Fixed: ImagePipeline.write uses .completeFileProtection, so cached stills are unreadable while the device is locked." },
        { rule: "Accessibility: Reduce Motion", verdict: "pass", note: "The only motion is a 0.2 s opacity fade for a first image or a different URL, which the setting allows; a same-key refresh swaps with no animation.", by: "apple-hig skill" },
      ],
      swiftui: [
        { rule: "Performance: AsyncImage honours HTTP caching on iOS 27; do not add an image cache solely for that", verdict: "departure", note: "The app keeps its own ImagePipeline (NSCache 96 MB, disk 200 MB with ETag and Last-Modified revalidation, ImageIO downsampling to a size bucket) because the deployment target is iOS 17 and it must keep the previous image up while a rotated camera token decodes (image-cache.md); an iOS 27-only AsyncImage(request:) could replace the disk layer later.", by: "swiftui-pro skill" },
