<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bathroom fan room tile · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../modals/room-devices/_devices-vacuums.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, dv = Mock.dv;
  function tile(o) { return dv.fanTile(o); }
  function rail(o) { return h('div', { style: { padding: '12px', borderRadius: '22px', background: o.lit ? '#006E62' : '#1c1c1e', display: 'inline-block' } }, dv.fanRail(o)); }
  function grid(items, ctx) { return dv.fitGrid(K.TileGrid({ items: items, min: 150, max: 2 })); }
  /* the tile inside a room page section: a phone gives the lead row the full width; regular width joins the two-column grid (RoomSectionView.leadJoinsGrid) */
  function inRoom(ctx) {
    var lead = tile({ title: 'Bathroom Fan', on: true, locked: true, status: 'Off in 12:34' });
    var rest = [{ title: 'Vanity Light', subtitle: 'Off', symbol: 'lightbulb', family: 'lights' }, { title: 'Towel Rack', subtitle: 'On', symbol: 'bolt.fill', family: 'power', isActive: true }];
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } }, K.PageSectionHeader({ title: 'Devices' }), ctx.regular ? grid([lead].concat(rest)) : [lead, grid(rest)]);
  }

  Mock.mount({
    kind: 'component', id: 'bathroom-fan-room-tile', title: 'Bathroom fan room tile and rail button', area: 'room-devices', status: 'shipped', frame: false,
    summary: 'The fan\'s tile on a bathroom room page: an air-family navigate tile whose body opens the fan sheet, with Lock and Power as 44 pt round buttons on a trailing rail, one chevron slot in from the edge.',
    source: ['apple/Sources/HassUI/Features/Rooms/BathroomFanRoomTile.swift', 'apple/Sources/HassUI/Features/Rooms/FanRailButton.swift', 'apple/Sources/HassDesign/GlassTile.swift', 'apple/Sources/HassCore/RoomDevices/BathroomFanController.swift'],
    spec: ['.agents/patterns/entity-tile.md', '.agents/patterns/room-device-sheets.md'],
    patterns: ['entity-tile', 'room-device-sheets', 'dynamic-grid'],
    hig: ['Buttons', 'Color', 'Dynamic Type', 'Layout'],
    entities: ['switch.master_bathroom_fan_switch_top', 'input_boolean.master_bathroom_fan_automation_lock', 'input_boolean.master_bathroom_fan_timer_pending', 'input_datetime.master_bathroom_fan_timer_ends_at'],
    kitComponents: ['GlassTile', 'TileGrid', 'PageSectionHeader'],
    devices: ['iphone', 'ipad-portrait'],

    states: {
      'variants': { title: 'Off, on, timer, locked, unavailable', render: function (ctx) {
        return dv.swatches(ctx, [
          { label: 'Off', w: 330, build: function () { return tile({ on: false, locked: false, status: 'Off' }); }, note: 'translucent white 12% circles on the dark off tile' },
          { label: 'On', w: 330, build: function () { return tile({ on: true, locked: false, status: 'On' }); }, note: 'Power is a solid white circle with the glyph in the tile\'s dark teal #006E62' },
          { label: 'On, timer running', w: 330, build: function () { return tile({ on: true, locked: false, status: 'Off in 12:34' }); }, note: 'the status line counts down each second (TimelineView), never carries the lock' },
          { label: 'On, locked', w: 330, build: function () { return tile({ on: true, locked: true, status: 'On' }); }, note: 'Lock draws lock.fill on white; unlocked draws lock.open' },
          { label: 'Off, locked', w: 330, build: function () { return tile({ on: false, locked: true, status: 'Off' }); } },
          { label: 'Unavailable', w: 330, build: function () { return tile({ unavailable: true }); }, note: 'the rail is absent while the fan is unavailable' },
        ], ['page']); } },
      'in-room': { title: 'In a room page section', note: 'phone: full-width lead row above the grid; regular width: joins the two-column grid', render: function (ctx) { return dv.swatches(ctx, [{ label: 'Room page section (' + (ctx.regular ? 'regular width' : 'compact width') + ')', w: ctx.regular ? 560 : 380, build: inRoom }], ['page']); } },
      'rail': { title: 'Rail buttons (FanRailButton)', render: function (ctx) {
        return dv.swatches(ctx, [
          { label: 'Inactive on the dark off tile', w: 220, build: function () { return rail({ on: false, locked: false }); } },
          { label: 'Inactive on the lit teal tile', w: 220, build: function () { return rail({ on: false, locked: false, lit: true }); }, note: 'black 18% so the white glyph keeps contrast on teal' },
          { label: 'Active (locked, fan on)', w: 220, build: function () { return rail({ on: true, locked: true, lit: true }); } },
        ], ['page']); } },
      'sheet-tiles': { title: 'The sheet\'s Power and Lock tiles', note: 'the same entities as full tiles in the fan sheet (sheet surface follows the appearance control)', render: function (ctx) {
        return dv.swatches(ctx, [
          { label: 'Power on, Lock locked', w: 380, build: function () { return dv.tileGrid([K.GlassTile({ title: 'Power', subtitle: 'On', symbol: 'power', family: 'air', isActive: true }), K.GlassTile({ title: 'Lock', subtitle: 'Locked', symbol: 'lock.fill', family: 'sec-home', isActive: true })], 2); } },
          { label: 'Power off, Lock unlocked', w: 380, build: function () { return dv.tileGrid([K.GlassTile({ title: 'Power', subtitle: 'Off', symbol: 'power', family: 'air' }), K.GlassTile({ title: 'Lock', subtitle: 'Unlocked', symbol: 'lock.open', family: 'sec-home' })], 2); } },
          { label: 'Unavailable', w: 380, build: function () { return dv.tileGrid([K.GlassTile({ title: 'Power', subtitle: 'Unavailable', symbol: 'power', family: 'air', isUnavailable: true }), K.GlassTile({ title: 'Lock', subtitle: 'Unavailable', symbol: 'lock.open', family: 'sec-home', isUnavailable: true })], 2); } },
        ], ['sheet']); } },
      'long-text': { title: 'Long countdown', note: 'one line, shrinking to 85% before it truncates', render: function (ctx) { return dv.swatches(ctx, [{ label: 'Off in 1:00:00', w: 330, build: function () { return tile({ title: 'Guest Bathroom Fan', on: true, locked: true, status: 'Off in 1:00:00' }); } }], ['page']); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the rail drops to the bottom-leading corner under the text; the circles grow 1.5x at most and stay circles', render: function (ctx) { return dv.swatches(ctx, [{ label: 'On, locked, timer', w: 380, build: function () { return tile({ on: true, locked: true, status: 'Off in 12:34' }); } }, { label: 'Off', w: 380, build: function () { return tile({ on: false, status: 'Off' }); } }], ['page']); } },
    },

    motion: [
      { id: 'rail-fill', what: 'Power fills white (and the tile fills teal) when the fan comes on; the Lock circle fills white when locked', token: 'state 0.6 s ease-in-out, colour only (the tile stateColorTransition and the rail\'s fill)', state: 'variants',
        source: 'HassDesign/GlassTile.swift; HassUI/Features/Rooms/FanRailButton.swift; motion.md section 6', reduce: 'still cross-fades at 0.2 s',
        play: function (stage) {
          var t = stage.querySelector('.ui-tile'); dv.setTile(t, true, 'On'); t.querySelector('.dv-rail').classList.add('lit'); t.querySelectorAll('.dv-rail button').forEach(function (b) { b.classList.add('on'); });
          return Mock.sleep(Mock.anim.ms.state() + 700).then(function () { dv.setTile(t, false, 'Off'); t.querySelector('.dv-rail').classList.remove('lit'); t.querySelectorAll('.dv-rail button').forEach(function (b) { b.classList.remove('on'); }); return Mock.sleep(Mock.anim.ms.state() + 300); });
        } },
      { id: 'countdown', what: 'The tile\'s status line counts down once a second while a timer runs', token: 'TimelineView(.periodic, by: 1) only while showsCountdown, hourly otherwise; no animation', state: 'variants',
        source: 'HassUI/Features/Rooms/BathroomFanRoomTile.swift', reduce: 'unchanged (nothing animates)',
        play: function (stage) { var tiles = stage.querySelectorAll('.ui-tile'), st = tiles[2].querySelector('.st'), n = 754; return new Promise(function (res) { var i = 0, id = setInterval(function () { n--; var m = Math.floor(n / 60), s = n % 60; st.textContent = 'Off in ' + m + ':' + (s < 10 ? '0' : '') + s; if (++i >= 4) { clearInterval(id); res(); } }, 1000); }); } },
    ],

    a11y: [
      { rule: 'One tile, two buttons', note: 'The tile is a button named "Bathroom Fan" with the value "on, off in 12 minutes, locked" and the hint of its destination (identifier room.card.<title>); Lock and Power are separate toggle buttons inside it ("Lock", value On/Off; "Power", value On/Off). The tile identifier is set with tileIdentifier so it does not hide the rail\'s ids.' },
      { rule: 'Value text', note: 'The eye reads "Off in 12:34"; VoiceOver is given "on, off in 12 minutes, locked" (rounded to whole minutes so the value does not change every second); the lock is never in the visible text.' },
      { rule: 'Targets', note: 'Rail circles are 44 pt (scaling up to 66 pt with Dynamic Type); the tile is far larger.' },
      { rule: 'Not colour alone', note: 'Lock draws lock.fill or lock.open; Power draws the power glyph; the words On, Off and the countdown are in the text.' },
      { rule: 'Contrast', note: 'White glyph on the translucent circle over dark teal; teal glyph #006E62 on white. At AX5 the rail moves under the text so the text never squeezes into a sliver.' },
    ],

    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Buttons: 44 pt minimum hit target', verdict: 'pass', note: '44 pt circles, scaled up to 1.5x.' },
        { rule: 'Layout: do not place controls over other controls', verdict: 'pass', note: 'The rail sits one chevron slot in from the edge so the chevron and Power never overlap (owner 2026-10-17).' },
        { rule: 'Color: not the only differentiator', verdict: 'pass', note: 'Glyph variants and words.' },
        { rule: 'Dynamic Type', verdict: 'pass', note: 'At AX sizes the rail moves to the bottom-leading corner under the text.' },
        { rule: 'Nested buttons', verdict: 'departure', note: 'Two buttons sit inside a navigating tile (owner design 2026-10-17, entity-tile.md Accessory rail): the tile body navigates and the rail acts; the tile exposes the state as one value so VoiceOver stays unambiguous.' },
      ],
      swiftui: [
        { rule: 'TimelineView for a live clock', verdict: 'pass', note: 'Per second only while a countdown shows; hourly otherwise keeps view identity.' },
        { rule: '@ScaledMetric for sizes', verdict: 'pass', note: 'Diameter and glyph are scaled metrics; the glyph is held under 45% of the circle.' },
        { rule: 'Accessibility identifiers on accessory tiles', verdict: 'pass', note: 'tileIdentifier(_:) instead of accessibilityIdentifier on the whole tile.' },
        { rule: 'Colour with the app token', verdict: 'pass', note: 'FanRailButton fill and ink come from ColorFamily.air.fill and the tile\'s state colours.' },
      ],
    },

    notes: [
      'The tile is the shared GlassTile with an accessory builder: the kit GlassTile takes `accessory`, so this mockup only adds the rail (dv.fanRail) and shifts it one chevron slot in (dv.fanTile).',
      'iPad: a lead-row fan joins the two-column grid (RoomSectionView.leadJoinsGrid); phones keep the full-width lead row (entity-tile.md). The "in-room" state shows both through the Device control.',
      'The Lock button is hidden if the lock entity is unavailable while the fan is available; the mockup shows the common case (both present).',
      'Promote to kit: dv.fanRail and the accessory offset belong in GlassTile.js (accessory placement is GlassTile\'s job in the app).',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass built with the kit: six tile states, room-page placement, rail buttons, AX5.' }],
  });
})();
</script></body></html>
