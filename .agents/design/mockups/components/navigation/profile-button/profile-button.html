<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile button · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../_shell-navigation.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, I = Mock.icon;
  var base = Mock.componentConfig('ProfileButton', { surfaces: ['page'] });

  function swatch(title, node, text) { return h('div', { style: { flex: 'none' } }, h('div.k-swatch.page', { style: { width: '220px' } }, h('div.k-cap', title), h('div.in.row', node)), text ? SN.cap('', text) : null); }
  /* Before iOS 26 the bar draws no glass: a 44 pt material circle shows behind a 32 pt disc (ProfileButton.Metrics.resolve(liquidGlassBar: false)). */
  function preGlass(badge) {
    var disc = h('button.ui-monogram', { type: 'button', 'aria-label': 'Profile, Stephen Fenton', style: { width: '32px', height: '32px', fontSize: '13px' } }, 'SF');
    var ring = h('span', { style: { width: '44px', height: '44px', borderRadius: '50%', background: 'rgba(60,60,64,.55)', border: '.5px solid rgba(255,255,255,.18)', display: 'grid', placeItems: 'center', position: 'relative' } }, disc);
    if (badge) ring.appendChild(h('span.ui-badge', { 'aria-hidden': 'true', style: { top: '-2px', right: '-4px' } }, String(badge)));
    return ring;
  }

  var states = {
    'monogram': { title: 'Monogram, no badge', note: 'the 44 pt disc is the whole button; no glass ring', render: function (ctx) { return h('div.sn-row', swatch('monogram', K.ProfileButton({ name: 'Stephen Fenton' }), 'Initials from the first two words, .callout semibold 16 pt, white on #0066CC (5.6:1), capped at xLarge.')); } },
    'symbol-until-name-known': { title: 'Symbol until the name is known', note: 'person.crop.circle on the bar\'s standard glass circle', render: function (ctx) { return h('div.sn-row', swatch('no name', K.ProfileButton({ name: '' })), swatch('no name + badge 3', K.ProfileButton({ name: '', badge: 3 }), 'The cached name (ShellNavigator.profileName) shows at once on a relaunch, so the button never changes after the first frame.')); } },
    'badges': { title: 'Attention badge: 1, 9, 9+', note: 'overdue chores plus expired food; "9+" past nine; hidden from VoiceOver, spoken in the value', render: function (ctx) { return h('div.sn-row', [1, 9, 12].map(function (n) { return swatch('badge ' + n + (n > 9 ? ' (9+)' : ''), K.ProfileButton({ badge: n })); })); } },
    'offline-badge': { title: 'Offline badge (cloud with a slash)', note: 'bottom-trailing, opposite the attention badge; no network path', render: function (ctx) { return h('div.sn-row', swatch('offline', K.ProfileButton({ offline: true })), swatch('offline + badge 3', K.ProfileButton({ offline: true, badge: 3 }), 'The value reads "Stephen Fenton, 3 items need attention, Offline".')); } },
    'rail-person-symbol': { title: 'Duo rail: the person symbol in the shared glass group', note: 'a monogram is a custom view and cannot move into the vertical rail, so the group shows the symbol', render: function (ctx) {
      return h('div.sn-row', swatch('Duo rail group', K.RailGroup({ badge: 3 })), SN.cap('ShellHeaderGrouping.oneGroup', 'One ToolbarItemGroup, no fixed spacer (owner 2026-10-20). The attention badge rides on the symbol; the monogram stays in the horizontal bar on the folded Duo only when it is not grouped.')); } },
    'pre-ios26': { title: 'Before iOS 26: 32 pt disc in a 44 pt material circle', note: 'the bar draws no glass, so each header button draws its own circle', render: function (ctx) { return h('div.sn-row', swatch('iOS 17 to 25', preGlass(3), 'Metrics.resolve(liquidGlassBar: false): diameter 32, no overhang, ringed. Quick Links beside it is the same 44 pt material circle (headerCircle()).')); } },
    'in-header': { title: 'In the header, with Quick Links 12 pt apart', note: 'iOS 27 measured: glass 44, disc 44, gap 12', render: function (ctx) {
      return h('div.sn-row', SN.stripSwatch({ leading: 'menu', badge: 3, name: 'Stephen Fenton' }, 'iPhone, signed in, 3 items', 'ShellHeaderItems on iOS 26+: Quick Links, ToolbarSpacer(.fixed), Profile with its shared glass hidden; the disc overhangs the 10 pt hidden-glass padding.'),
        SN.stripSwatch({ leading: 'menu', name: '', offline: true }, 'iPhone, name unknown, offline', 'Symbol on glass, offline badge bottom-trailing.')); } },
    'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'a bar item keeps its size: the initials are capped at xLarge so they never outgrow the disc; the Large Content Viewer shows it bigger', render: function (ctx) {
      return h('div.sn-row', swatch('monogram at AX5', K.ProfileButton({ badge: 3 }), 'Still a 44 pt disc; press and hold shows "Profile" with person.crop.circle.'), swatch('badge 12 at AX5', K.ProfileButton({ badge: 12 })), SN.stripSwatch({ leading: 'menu', badge: 3 }, 'header at AX5')); } },
  };
  Object.keys(base.states).forEach(function (k) { states['kit-' + k] = base.states[k]; });
  states['kit-variants'] = base.states.variants;

  Mock.mount(Object.assign(base, {
    id: 'profile-button', title: 'Profile button (monogram, attention badge, offline badge)', area: 'shell', status: 'shipped',
    summary: 'The trailing-most header button on every page: the signed-in person\'s initials on a 44 pt disc (or the person symbol on glass until the name is known), badged with overdue chores plus expired food, and a cloud badge while offline. Opens Your Summary.',
    source: ['apple/Sources/HassUI/App/Shell/ShellHeader.swift', 'apple/Sources/HassUI/App/Shell/ShellAttention.swift', 'apple/Sources/HassUI/App/Shell/ShellHeaderGrouping.swift', 'apple/Sources/HassUI/App/Shell/ShellNavigator.swift'],
    spec: ['.agents/design/direction-g.md', '.agents/pages/settings/profile.md', '.agents/design/apple/duo.md', '.agents/platforms/apple/badge.md'],
    patterns: ['motion'],
    hig: ['Toolbars', 'Badging', 'Buttons', 'Accessibility'],
    kitComponents: ['ProfileButton', 'RailGroup', 'QuickLinksButton', 'NavigationGlass'],
    devices: ['iphone', 'duo-folded', 'ipad-portrait'],
    states: states,
    motion: [],
    transitions: [
      { from: 'Profile button', to: 'Your Summary sheet', kind: 'sheet', state: 'in-header', note: 'The button asks ShellNavigator for the Account sheet; it hangs on the section\'s stack once (shellSheets), opens at the large detent (hassSheet(.form, height: .full)) and closes the flyout first. Content is present on arrival.',
        play: function (stage) {
          // The strip swatches have no page behind them: present over a throwaway device page.
          var host = h('div', { style: { margin: '16px 0' } }); SN.stageRoot().appendChild(host);
          var c = SN.ctxFor('iphone', Mock.current), prev = Mock.current; Mock.current = c;
          var dev = Mock.frame(c, SN.rootPage(c, 'home')); host.appendChild(h('div.sn-z', { style: { zoom: .6 } }, dev)); host.dataset.device = 'iphone'; host.className = 'sn-fig';
          return Mock.sleep(100).then(function () { return Mock.presentDemo(dev.querySelector('.screen'), SN.accountSheet(c), { hold: 1000 }); }).then(function () { host.remove(); Mock.current = prev; });
        } },
    ],
    a11y: [
      { rule: 'Name, role, state', note: 'Label "Profile"; value "<name>, <n> items need attention" (singular "1 item needs attention"), plus ", Offline" while offline; hint "Opens your summary and account"; identifier nav.profile. The badges are hidden from VoiceOver and spoken through the value. The offline badge has its own label "Offline" (nav.offline).' },
      { rule: 'Reading order', note: 'Last in the header: Open Navigation, the reconnecting arc when present, Quick Links, Profile; then the page.' },
      { rule: 'Targets', note: 'The disc is 44 pt, the hit area a 44 pt circle on every bar; the glass-less pre-iOS 26 form keeps a 44 pt material circle around a 32 pt disc.' },
      { rule: 'Dynamic Type / AX5', note: 'Bar items do not scale: the initials are capped at xLarge and the badges at xLarge, so they never outgrow their disc. The Large Content Viewer (accessibilityShowsLargeContentViewer, "Profile", person.crop.circle) shows the enlarged item on press and hold.' },
      { rule: 'State is not colour alone', note: 'Attention is a number, offline is a cloud-with-slash glyph; the monogram colour never changes.' },
      { rule: 'Contrast', note: 'White on #0066CC is 5.6:1 in light and dark mode; the badge is white on #D93025.' },
    ],
    reviews: {
      date: '2026-10-23', by: 'author',
      hig: [
        { rule: 'Toolbars: account access in the trailing group', verdict: 'pass', note: 'Profile is trailing-most on every page, like Apple apps\' account button.' },
        { rule: 'Badging: a number only for items that need attention, never decorative', verdict: 'pass', note: 'Overdue chores plus expired food; zero until the viewer is a known resident.' },
        { rule: 'Buttons: 44 pt minimum hit area', verdict: 'pass', note: '44 pt disc or circle.' },
        { rule: 'Toolbars: group related items, separate unrelated ones', verdict: 'pass', note: 'iPhone and iPad: two circles 12 pt apart (ToolbarSpacer fixed). Duo rail: one group, no spacer (HIG Designing for iPhone Duo).' },
        { rule: 'Materials: Liquid Glass behind symbols, content colour for avatars', verdict: 'departure', note: 'The monogram disc hides the bar\'s shared glass and fills its place: owner 2026-10-18 option A (FestivalNativeApps parity, issue #311); left alone, iOS 26 lightened the disc until the initials measured 2.7:1.' },
        { rule: 'Accessibility: Large Content Viewer for fixed-size bar items', verdict: 'pass', note: 'accessibilityShowsLargeContentViewer on the button.' },
      ],
      swiftui: [
        { rule: 'Use ToolbarItem placements and sharedBackgroundVisibility rather than manual positions', verdict: 'pass', note: 'ProfileHeaderItem hides the shared background only for the monogram.' },
        { rule: 'Cap Dynamic Type on fixed-size chrome', verdict: 'pass', note: 'dynamicTypeSize(...xLarge) on initials and badges.' },
        { rule: 'Hide decorative badges from accessibility and speak the value', verdict: 'pass', note: 'accessibilityHidden(true) on the badge; accessibilityValue carries it.' },
        { rule: 'A view should not duplicate a second code path for OS versions', verdict: 'departure', note: 'Metrics.resolve(liquidGlassBar:) keeps the iOS 17 to 25 look (32 pt disc in a material circle); the deployment target is iOS 17 (AGENTS.md).' },
        { rule: 'Animate state changes with a token', verdict: 'fix', note: 'The badge appears with no fade: patterns/motion.md "Not done: ProfileButton badge opacity" (0.2 s) is waiting for the header lane to merge.' },
      ],
    },
    notes: [
      'iOS 26.5 differs from iOS 27 (direction-g.md): the bar gives a hidden-glass custom view a cell 8 pt wider, so Quick Links to Profile is 16 pt there; the mockup draws iOS 27 (12 pt).',
      'Docs versus code: none; direction-g.md, iphone.md and the code agree on the disc, the badge and the offline badge. The catalog statesHint "badge-1" has no special look: a one-digit badge is the 18 pt capsule.',
      'The kit stands in for glass with a CSS blur; the app draws system glass. The monogram colour #0066CC is exact.',
      'Motion: none today (no motion on this surface). The 0.2 s badge fade is planned; see patterns/motion.md Departures.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: monogram, symbol, badges, offline, Duo rail group, pre-iOS 26, header context, AX5.' }],
  }));
})();
</script></body></html>
