<title>Reconnecting and offline indicators · component mockup</title>

<script>
(function () {
  var h = Mock.h, K = Mock.components, I = Mock.icon;
  var base = Mock.componentConfig('OfflineChip', { surfaces: ['page'] });

  function bar(arc, w) { return SN.strip({ leading: 'menu', arc: arc, badge: 3, width: w }); }
  function conn(ctx, mode, sec) { return SN.rootPage(ctx, sec || 'home', { connection: mode }); }
  function board(ctx, mode, extra) {
    return SN.board(ctx, [
      { key: 'iphone', zoom: .78, caption: extra && extra.iphone, build: function (c) { return conn(c, mode); } },
      { key: 'duo-folded', zoom: .78, caption: extra && extra.duo, build: function (c) { return conn(c, mode, 'security'); } },
      { key: 'ipad-portrait', zoom: .46, caption: extra && extra.ipad, build: function (c) { return conn(c, mode, 'climate'); } },
    ]);
  }
  /* The timeline of ReconnectingPolicy and the indicator: one row per case. */
  function timeline() {
    function row(label, parts) { return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', margin: '6px 0' } }, h('div.sn-mono', { style: { width: '170px', flex: 'none', color: 'var(--k-fg2)' } }, label),
      h('div', { style: { display: 'flex', height: '26px', borderRadius: '6px', overflow: 'hidden', border: '1px solid var(--k-line)', flex: '1 1 380px', maxWidth: '640px' } }, parts.map(function (p) { return h('div', { style: { flex: p[0] + ' 1 0', background: p[1], color: p[2] || '#fff', font: '600 11px/26px var(--mono)', textAlign: 'center', whiteSpace: 'nowrap', overflow: 'hidden' } }, p[3] || ''); }))); }
    return h('div', { style: { color: 'var(--k-fg)' } },
      row('blip under 2 s', [[2, '#2e333c', 'var(--k-fg2)', 'down < 2 s: nothing'], [3, 'transparent', 'var(--k-fg2)', 'live']]),
      row('retrying 2 s or more', [[2, '#2e333c', 'var(--k-fg2)', 'down 0 to 2 s'], [4, '#6b7280', '#fff', 'arc fades up 0.35 s, turns'], [1, '#2e333c', 'var(--k-fg2)', 'live']]),
      row('no network path', [[2, '#8a5200', '#fff', 'chip at once'], [3, '#8a5200', '#fff', 'chip stays, cloud badge, no arc']]),
      row('main today: retrying', [[2, '#2e333c', 'var(--k-fg2)', '0 to 2 s'], [3, '#b36a00', '#fff', '"Reconnecting…" chip, dot breathes'], [1, '#2e333c', 'var(--k-fg2)', 'live']]));
  }

  var states = {
    'arc': { title: 'Reconnecting: the header arc (target)', note: 'in flight: 20 pt white arc left of Quick Links, no text', render: function (ctx) {
      return h('div', board(ctx, 'reconnecting', { iphone: 'iPhone: arc 12 pt left of Quick Links (the same gap as Quick Links to Profile).', duo: 'Folded Duo: Quick Links and Profile are in the rail; the arc is a custom view and stays in the horizontal header, trailing, opposite the title. To be confirmed on the Duo simulator.', ipad: 'iPad: same as iPhone.' }),
        h('div.sn-row', { style: { marginTop: '12px' } }, SN.stripSwatch({ leading: 'menu', arc: true, badge: 3 }, 'header, down 2 s+'), SN.stripSwatch({ leading: 'menu', badge: 3 }, 'header, live (arc gone, nothing moved)')));
    } },
    'offline': { title: 'Offline: the chip stays (no network path)', note: 'unchanged by the branch: icloud.slash, "Offline. Showing last known values.", cloud badge on Profile', render: function (ctx) {
      return board(ctx, 'offline', { iphone: 'The chip sits under the header at the trailing edge, clear of the large title; values stay on screen.' }); } },
    'was': { title: 'Reconnecting, today on main (the "was")', note: 'orange breathing dot and the word "Reconnecting…" under the header; the arc replaces it', render: function (ctx) {
      return board(ctx, 'reconnecting-chip', { iphone: 'ReconnectingChip(offline: false): 8 pt orange dot, footnote semibold, on the dense module with a 0.5 pt rim.' }); } },
    'reduce-motion': { title: 'Reduce Motion on', override: { reduceMotion: true }, note: 'dot holds fully lit (was); arc fades the same and turns at half speed, never still', render: function (ctx) {
      return h('div.sn-row', SN.stripSwatch({ leading: 'menu', arc: true, badge: 3 }, 'arc, Reduce Motion'), h('div.k-swatch.page', { style: { width: '300px' } }, h('div.k-cap', 'was: chip, dot still'), K.OfflineChip({ variant: 'reconnecting' }))); } },
    'timeline': { title: 'When each one shows', note: 'ReconnectingPolicy.delay is 2 s; offline shows at once', render: function (ctx) { return timeline(); } },
    'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the chip text wraps inside its capsule; the arc is a fixed 20 pt status mark', render: function (ctx) {
      return h('div.sn-row', h('div.k-swatch.page', { style: { width: '360px', maxWidth: '100%' } }, h('div.k-cap', 'offline chip'), K.OfflineChip({ variant: 'offline' })), h('div.k-swatch.page', { style: { width: '360px', maxWidth: '100%' } }, h('div.k-cap', 'was: reconnecting chip'), K.OfflineChip({ variant: 'reconnecting' })), SN.stripSwatch({ leading: 'menu', arc: true, badge: 3 }, 'arc at AX5')); } },
    'swatches': base.states.states,
  };

  function figEl(stage, key) { return stage.querySelector('.sn-fig[data-device="' + key + '"]'); }
  function chipRow(stage) { return stage.querySelector('.ui-conn-row'); }

  Mock.mount(Object.assign(base, {
    id: 'reconnecting-chip', title: 'Reconnecting and offline chip', area: 'shell', status: 'in-flight:claude/reconnecting-spinner',
    summary: 'How the shell says the values on screen may be stale. Target (branch claude/reconnecting-spinner, owner 2026-10-23): a 20 pt white arc in the header, left of Quick Links, while the connection retries; the offline chip stays for no network. Main today: an orange "Reconnecting…" chip under the header.',
    source: ['apple/Sources/HassUI/App/Shell/ReconnectingChip.swift', 'apple/Sources/HassUI/App/Shell/ReconnectingOverlay.swift', 'apple/Sources/HassCore/Connection/ReconnectingPolicy.swift',
      { path: 'apple/Sources/HassUI/App/Shell/ReconnectingArc.swift', note: '(in flight, claude/reconnecting-spinner worktree)' }, { path: 'apple/Sources/HassUI/App/Shell/ReconnectingIndicatorHost.swift', note: '(in flight)' }, { path: 'apple/Sources/HassUI/App/Shell/OfflineChip.swift', note: '(in flight)' }],
    spec: ['.agents/design/direction-g.md', '.agents/design/motion.md', '.agents/platforms/apple/connection-lifecycle.md', { path: '.agents/design/reconnecting-spinner.md', note: '(in flight)' }],
    patterns: ['motion'],
    hig: ['Progress indicators', 'Loading', 'Toolbars', 'Accessibility'],
    kitComponents: ['ReconnectingArc', 'OfflineChip', 'ArcSpinner', 'ProfileButton'],
    devices: ['iphone', 'duo-folded', 'ipad-portrait'],
    states: states,
    motion: [
      { id: 'arc-fade', what: 'The reconnecting arc fades in once the connection has been down 2 s, and out when live again (target)', token: 'crossFade 0.35 s ease-in-out each way (MotionTokens.crossFade, reducedMoment); 2 s delay is ReconnectingPolicy.delay', state: 'arc',
        source: 'ReconnectingArc.swift (in flight); proposals/reconnecting-spinner', reduce: 'unchanged: opacity is not motion, so Reduce Motion keeps the fade',
        play: function (stage) { var s = stage.querySelector('.ui-slot'); return Mock.anim.arc(s, false).then(function () { return Mock.sleep(500); }).then(function () { return Mock.anim.arc(s, true); }).then(function () { return Mock.sleep(900); }); } },
      { id: 'arc-turn', what: 'The arc turns, one turn per 0.82 s, while it is visible', token: 'ArcSpinner: linear 0.82 s per turn, repeats; spinners are an allowed repeatForever (motion.md section 7)', state: 'arc',
        source: 'HassDesign/ArcSpinner.swift', reduce: 'half speed (1.64 s a turn): a still arc reads as frozen',
        play: function () { return Mock.sleep(3000); } },
      { id: 'dot-breathe', what: 'Main today: the chip\'s orange dot breathes', token: 'opacity 0.45 to 1 as a sine over 1.4 s (TimelineView, ReconnectingChip.dotOpacity)', state: 'was',
        source: 'ReconnectingChip.swift', reduce: 'the dot holds fully lit (no TimelineView updates)',
        play: function () { return Mock.sleep(3000); } },
      { id: 'chip-enter', what: 'A chip comes in under the header and goes out again (offline, and the "was")', token: 'standard 0.3 s smooth: opacity plus .move(edge: .top)', state: 'offline',
        source: 'ReconnectingOverlay.swift / OfflineOverlay.swift: .animation(standard, value: showsChip)', reduce: 'cross-fade on crossFade 0.35 s, no move',
        play: function (stage) {
          var row = chipRow(stage); if (!row) return Promise.resolve();
          var rm = !!Mock.settings.reduceMotion, ms = rm ? 350 : 300, h0 = row.offsetHeight;
          var inK = rm ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(-' + h0 + 'px)' }, { opacity: 1, transform: 'none' }];
          var outK = rm ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-' + h0 + 'px)' }];
          return row.animate(inK, { duration: ms, easing: Mock.anim.easing.standard, fill: 'both' }).finished.then(function () { return Mock.sleep(900); }).then(function () { return row.animate(outK, { duration: ms, easing: Mock.anim.easing.standard, fill: 'both' }).finished; }).then(function () { return Mock.sleep(200); });
        } },
    ],
    transitions: [
      { from: 'Live', to: 'Reconnecting (arc)', kind: 'fade', state: 'arc', note: 'The connection drops; after 2 s the arc is placed in the bar and fades up. Quick Links and Profile never move (the group grows to the left). A blip shorter than 2 s shows nothing; coming back mid fade-out lights it again where it is.',
        play: function (stage) { var s = stage.querySelector('.ui-slot'); return Mock.anim.arc(s, false).then(function () { return Mock.sleep(300); }).then(function () { return Mock.anim.arc(s, true); }).then(function () { return Mock.sleep(800); }); } },
      { from: 'Reconnecting (arc)', to: 'Live', kind: 'fade', state: 'arc', note: 'The arc fades down 0.35 s, then leaves the bar. Values on screen were never cleared.',
        play: function (stage) { var s = stage.querySelector('.ui-slot'); return Mock.anim.arc(s, true).then(function () { return Mock.sleep(500); }).then(function () { return Mock.anim.arc(s, false); }).then(function () { return Mock.sleep(500); }); } },
      { from: 'Live', to: 'Offline chip', kind: 'overlay', state: 'offline', note: 'No network path: the chip is shown at once (there is nothing to wait out), the Profile button gets its cloud badge, and no arc runs.',
        play: function (stage) { var row = chipRow(stage); return row ? row.animate([{ opacity: 0, transform: 'translateY(-34px)' }, { opacity: 1, transform: 'none' }], { duration: Mock.settings.reduceMotion ? 350 : 300, easing: Mock.anim.easing.standard, fill: 'both' }).finished.then(function () { return Mock.sleep(700); }) : Promise.resolve(); } },
    ],
    a11y: [
      { rule: 'Arc (target)', note: 'One element, "Reconnecting to Home Assistant", updatesFrequently, no action and no 44 pt target: it is a status, not a control (reconnecting.arc). VoiceOver reaches it after Open Navigation and before Quick Links. It is hidden entirely (not just transparent) when live.' },
      { rule: 'Offline chip', note: 'One combined element "Offline. Showing last known values." (offline.chip); the Profile button adds "Offline" to its value and its own cloud badge label (nav.offline).' },
      { rule: 'Main today', note: 'The chip reads "Reconnecting to Home Assistant" (reconnecting.chip); the orange dot is hidden from VoiceOver.' },
      { rule: 'State is not colour alone', note: 'The arc is a moving shape with a spoken label; the offline chip carries a slashed-cloud glyph and words; the was-chip carries a word.' },
      { rule: 'Dynamic Type / AX5', note: 'The chip text is footnote and wraps inside the capsule; the arc is a fixed 20 pt mark (not text).' },
      { rule: 'Reduce Motion', note: 'The arc keeps turning at half speed, the dot stops breathing, the chip cross-fades instead of moving.' },
      { rule: 'Contrast', note: 'White text on the dense module (#141416 at 78%) over the dark scrim; the arc is white at 96% on the wallpaper (the scrim is at least 0.44 black in the header).' },
    ],
    reviews: {
      date: '2026-10-23', by: 'apple-hig skill, swiftui-pro skill',
      hig: [
        { rule: 'Accessibility: tell VoiceOver about visible changes', verdict: 'fix', note: 'The chip appears and clears with no announcement or layout-changed notification and no .updatesFrequently trait (ReconnectingOverlay.swift:33-55; ReconnectingChip.swift:48-50), so a VoiceOver user is not told that the values may be stale. Medium.', by: 'apple-hig skill' },
        { rule: 'Loading: show an indicator only for a wait that matters', verdict: 'pass', note: 'The chip waits ReconnectingPolicy.delay (2 s) and clears when live; offline shows at once (ReconnectingPolicy.swift:10; ReconnectingOverlay.swift:43-54).', by: 'apple-hig skill' },
        { rule: 'Layout: do not cover content with transient chrome', verdict: 'fix', note: 'On main the chip is an overlay at the top trailing edge just under the header (ReconnectingOverlay.swift:33-37) and sits over page content such as the first chip or title row; the in-flight arc exists to fix this. Low.', by: 'apple-hig skill' },
        { rule: 'Motion: Reduce Motion', verdict: 'pass', note: 'The dot stops breathing (ReconnectingChip.swift:18-20, 32) and the chip fades without moving (ReconnectingOverlay.swift:38, 41).', by: 'apple-hig skill' },
        { rule: 'Writing: say the state and what it means', verdict: 'pass', note: '"Offline. Showing last known values." and "Reconnecting…" (ReconnectingChip.swift:40).', by: 'apple-hig skill' },
        { rule: 'Motion: make motion optional (arc, in flight)', verdict: 'departure', note: 'The in-flight arc keeps turning at half speed under Reduce Motion (owner 2026-10-14, direction-g.md Loading and feedback). Branch not in this tree; taken from the mockup and the doc.', by: 'apple-hig skill' },
      ],
      swiftui: [
        { rule: 'A task per state, cancelled on change', verdict: 'pass', note: '.task(id: state) sleeps the delay and is cancelled when the connection returns (ReconnectingOverlay.swift:43-54).', by: 'swiftui-pro skill' },
        { rule: 'Do not drive a tiny pulse from a per-frame TimelineView', verdict: 'fix', note: 'TimelineView(.animation) re-evaluates the dot every display frame for as long as the chip shows (ReconnectingChip.swift:32); a repeatForever opacity animation or a phaseAnimator keeps it off the main thread. Low.', by: 'swiftui-pro skill' },
        { rule: 'Group a status into one element with a label', verdict: 'pass', note: '.accessibilityElement(children: .combine) plus a label (ReconnectingChip.swift:48-49).', by: 'swiftui-pro skill' },
      ],
    },
    notes: [
      'In flight: not on main. Branch claude/reconnecting-spinner replaces ReconnectingChip with the header arc (ReconnectingArc, ReconnectingIndicatorHost) and keeps the offline chip (OfflineChip, OfflineOverlay). The mockup draws the target; state "was" draws main. Read from the worktree .claude/worktrees/reconnecting-spinner (read-only).',
      'Docs versus code: the catalog hint "enters opacity plus 10 pt move" is not what the code does: the transition is .opacity combined with .move(edge: .top), which moves the chip by its own height (about 34 pt) over the standard 0.3 s; the mockup draws the code. motion.md section 5 and direction-g.md still say "Reconnecting… chip" (they predate the branch).',
      'Offline is not reconnecting: a connection with no network path shows the offline chip at once and never the arc (ReconnectingPolicy.showsReconnecting).',
      'On the folded Duo the arc position is "to be confirmed on the Duo simulator" per the branch doc; the mockup puts it in the horizontal header, trailing.',
      'Promote to kit: nothing; SN.strip and SN.board are local helpers in components/navigation/_shell-navigation.js.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: arc target, offline chip, the "was" chip, timeline, Reduce Motion, AX5.' }],
  }));
})();
</script></body></html>
