<script>
(function () {
  var h = Mock.h, K = Mock.components, CM = Mock.cm;

    return CM.cards(CARDS.slice(0, n || 4).map(function (c) { return K.ImageCard({ title: c[0], subtitle: c[1], scene: 'recipe' }); }), 150, 2);
  }
  function gate(phase, label, n) { var g = K.ContentGate({ content: content(n), phase: phase, label: label, minHeight: 200 }); return g; }
  /* The sequence, parameterised by profile and Reduce Motion (patterns/content-gate.md "Sequence" and "Timing profiles"). */

  function playGate(g, readout, o) {
    var page = o.profile === 'page', rm = o.rm, spin = g.querySelector('.spin'), content = g.querySelector('.content'), t0 = performance.now(), loadAt = o.dataAt;
    function say(t) { readout.textContent = Math.round(performance.now() - t0) + ' ms · ' + t; }

  }

    var host = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px', width: '100%' } }, h('div', { style: { font: '600 12px var(--mono)', opacity: .7 } }, title), g, ro);

    return host;
  }
  function sequence(ctx) {
    var out = CM.grid(ctx, [
      { label: 'phase: loading (first 150 ms: nothing)', node: gate('loading', null, 2), min: 300 },
      { label: 'phase: spinner (after 150 ms)', node: gate('spinner', 'Loading recipes', 2), min: 300 },
      { label: 'phase: ready (content faded in)', node: gate('ready', null, 2), min: 300 },
    ], { surfaces: ['page', 'sheet'] });

  }
  function plays(ctx) {
    var cards = {};
    cards.rn = card(ctx, 'NORMAL · .results profile', { profile: 'results', rm: false, dataAt: 900 });
    cards.rr = card(ctx, 'REDUCE MOTION · .results', { profile: 'results', rm: true, dataAt: 900 });
    cards.pn = card(ctx, 'NORMAL · .page profile (data at 300 ms)', { profile: 'page', rm: false, dataAt: 300 });
    cards.pr = card(ctx, 'REDUCE MOTION · .page', { profile: 'page', rm: true, dataAt: 300 });

      h('div', { style: { flex: '1 1 300px', display: 'flex', flexDirection: 'column', gap: '14px' } }, cards.rn, CM.play(function () { return Promise.all([cards.rn.__play(), cards.rr.__play()]); }, 'Play .results'), cards.rr),
      h('div', { style: { flex: '1 1 300px', display: 'flex', flexDirection: 'column', gap: '14px' } }, cards.pn, CM.play(function () { return Promise.all([cards.pn.__play(), cards.pr.__play()]); }, 'Play .page'), cards.pr));
    wrap.__playResults = function () { return Promise.all([cards.rn.__play(), cards.rr.__play()]); };
    wrap.__playPage = function () { return Promise.all([cards.pn.__play(), cards.pr.__play()]); };
    wrap.__playReload = function () {
      var g = cards.rn.__gate, content = g.querySelector('.content'), spin = g.querySelector('.spin'), ro = cards.rn.querySelector('[data-readout]'); var t0 = performance.now();

      g.dataset.phase = 'ready'; content.style.opacity = 1; content.style.transform = 'none'; say('showing results; a new search starts');

    };

  }
  function timeline(ctx) {
    function seg(label, ms, color, total) { return h('div', { title: label + ' ' + ms + ' ms', style: { flex: ms + ' 0 0', minWidth: 0, background: color, height: '22px', borderRadius: '4px', color: '#fff', font: '600 10px/22px var(--mono)', padding: '0 4px', overflow: 'hidden', whiteSpace: 'nowrap' } }, label); }
    function bar(name, segs) { return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } }, h('span', { style: { font: '600 12px var(--mono)' } }, name), h('div', { style: { display: 'flex', gap: '2px' } }, segs.map(function (s) { return seg(s[0], s[1], s[2]); }))); }
    var A = 'var(--g-tint-fill)', B = 'var(--fam-water-fill)', G = '#6c6c70', Y = 'var(--fam-occupancy-fill)';
    var n = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px', width: '100%' } },
      bar('.results (search, sort, filter; Food results)', [['wait 150', 150, G], ['in 200', 200, A], ['loading, data at 900', 550, '#3a3f48'], ['out 140', 140, B], ['content 170', 170, Y]]),
      bar('.page (first cold load; Food hub, Recipes, inventory pages)', [['in 200', 200, A], ['held to 1000 (min)', 800, '#3a3f48'], ['out 500', 500, B], ['content 170', 170, Y]]),

    var tbl = h('table.cm-tbl', h('thead', h('tr', ['Value', '.results', '.page'].map(function (t) { return h('th', t); }))), h('tbody', [
      ['spinnerDelay', '150 ms', '0'], ['spinnerEnter', '200 ms', '200 ms'], ['spinnerExit', '140 ms', '500 ms'], ['contentEnter', '170 ms (+ 4 pt rise)', '170 ms (+ 4 pt rise)'], ['contentExit (reload)', '170 ms', '170 ms'], ['childTimeout', '1500 ms', '1500 ms'], ['minimumLoading', '0', '1000 ms'], ['loadTimeout', 'none', '10 s']].map(function (r) { return h('tr', h('th', { scope: 'row' }, h('code', r[0])), h('td', r[1]), h('td', r[2])); })));
    return CM.grid(ctx, [{ label: 'Timing profiles (ContentGateModel.Profile)', node: n, w: 620 }, { label: 'Constants', node: tbl, w: 420 }], { surfaces: ['sheet'] });
  }
  function snapshot(ctx) {
    var open = gate('ready', null, 2);

  }

    kind: 'component', id: 'content-gate', title: 'ContentGate (loading gate)', area: 'design', status: 'shipped', frame: false,
    summary: 'How a network-backed page or sheet with nothing saved waits: the content is laid out but hidden, an arc spinner fades in after 150 ms, and when the data and every reported image are ready the spinner fades out and the content fades in and rises 4 pt. Two timing profiles (.results for regions that reload, .page for a page\'s first cold load).',
    source: ['apple/Sources/HassDesign/Loading/ContentGate.swift', 'apple/Sources/HassDesign/Loading/ContentGateModel.swift', 'apple/Sources/HassDesign/Loading/ReadinessTracker.swift', 'apple/Sources/HassDesign/Images/CachedImage.swift', 'apple/Sources/HassDesign/ArcSpinner.swift'],

    motion: [
      { id: 'results', what: 'A results region loads: a spinner appears only if it takes over 150 ms, then the content arrives', token: '.results: delay 150 ms, in 200 ms, out 140 ms, content 170 ms + 4 pt rise', state: 'loading',
        source: 'ContentGateModel.Profile.results; patterns/content-gate.md "Sequence"', reduce: 'the content fades in with no 4 pt rise; the spinner keeps turning at half speed',
        play: function (stage) { return stage.querySelector('[data-gates]').__playResults(); } },
      { id: 'page', what: 'A page\'s first cold load: the spinner at once, held at least 1 s even when the data is there, out over 500 ms', token: '.page: in 200 ms, minimum 1000 ms, out 500 ms, content 170 ms; load timeout 10 s', state: 'loading',
        source: 'ContentGateModel.Profile.page (the web DashboardPageLoadGate)', reduce: 'no rise; the spinner at half speed (HIG departure recorded 2026-10-16)',
        play: function (stage) { return stage.querySelector('[data-gates]').__playPage(); } },

        play: function (stage) { return stage.querySelector('[data-gates]').__playReload(); } },

    transitions: [],
    a11y: [
      { rule: 'Hidden content', note: 'While loading the content has opacity 0, no hit testing and is hidden from VoiceOver; when it appears the gate posts a layoutChanged notification so focus lands on the page.' },
      { rule: 'The spinner', note: 'One element labelled "Loading" (or "Loading Pantry"), updatesFrequently, not a control. It exists only while it shows, so a fast load never builds it.' },
      { rule: 'Reduce Motion', note: 'The 4 pt rise is dropped and the fade kept (opacity is allowed); the spinner keeps turning at half speed.' },
      { rule: 'No waiting past a limit', note: 'One slow image holds the gate for 1.5 s at most; a page whose data never arrives shows its content after 10 s (.page).' },
      { rule: 'Dynamic Type', note: 'The spinner is fixed at 44 pt; its label and the gated content scale; cards become rows at accessibility sizes.' },

        { rule: 'Motion: respect Reduce Motion', verdict: 'pass', note: 'No rise, fade kept.' },
