<link rel="stylesheet" href="../../../_kit/kit.css">

<script>
(function () {
  var h = Mock.h, K = Mock.components, CM = Mock.cm, I = Mock.icon;
  var S = K.ArcSpinner;
  function lab(t) { return h('span', { style: { font: 'var(--fs-sub) var(--font)', opacity: .85 } }, t); }
  function sizes(ctx) {
    function one(size, label, color) { return h('div.cm-row', S({ size: size, color: color }), lab(label)); }
    return CM.grid(ctx, [
      { label: 'page: 44 pt, 3 pt ring', node: one('page', 'A page or sheet that is loading'), min: 280 },
      { label: 'compact: 20 pt, 2.5 pt ring', node: one('compact', 'Pills, rows, the header arc'), min: 280 },
      { label: 'inline: 16 pt, 2 pt ring', node: one('inline', 'Buttons and subtitles'), min: 280 },
      { label: 'inline, orange (the reconnecting chip)', node: one('inline', 'Reconnecting', '#FF9F0A'), min: 280 },
    ]);
  }
  function inContext(ctx) {
    var signing = h('button.ui-primary', { type: 'button', disabled: true, style: { gap: '8px' } }, S({ size: 'inline', label: 'Signing In' }), 'Signing In…');
    var pill = h('span.cm-chip', { style: { background: 'var(--g-module-thin)', color: '#fff' } }, S({ size: 'compact', label: 'Updating' }), 'Updating');
    var row = h('div.cm-row', { style: { padding: '10px 14px', borderRadius: 'var(--radius-tile)', background: 'var(--sheet-cell)', color: 'var(--ink)' } }, S({ size: 'compact', label: 'Looking for a Barcode' }), h('span', { style: { font: '600 var(--fs-body) var(--font)' } }, 'Looking for a Barcode'));
    var sub = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '2px' } }, h('span', { style: { font: '600 var(--fs-body) var(--font)' } }, 'Living Room TV'), h('span.cm-row', { style: { gap: '6px', font: 'var(--fs-foot) var(--font)', opacity: .85 } }, S({ size: 'inline', label: 'Sending Open' }), 'Sending Open'));
    var hdr = h('div.cm-row', { style: { justifyContent: 'space-between', width: '100%' } }, h('span', { style: { font: '700 var(--fs-t2) var(--font-d)' } }, 'Home'), h('span.ui-glass', { style: { display: 'inline-grid', placeItems: 'center', width: '44px', height: '44px', borderRadius: '50%' } }, S({ size: 'compact', label: 'Reconnecting' })));
    return CM.grid(ctx, [
      { label: 'Primary button, pressed (Signing In…)', node: signing, surfaces: ['page'], min: 300 },
      { label: 'Pill (Updating)', node: pill, min: 240 },
      { label: 'Row (scanner)', node: row, min: 300 },
      { label: 'Subtitle (media remote command)', node: sub, min: 240 },
      { label: 'Header (reconnecting arc, in flight)', node: hdr, min: 300 },
    ]);
  }
  function titled(ctx) {
    return CM.grid(ctx, [
      { label: 'ProgressView("Loading recipes").progressViewStyle(.arc)', node: K.ArcProgress({ label: 'Loading recipes' }), min: 300 },
      { label: 'Determinate: ProgressView(value:) keeps the linear bar', node: K.ArcProgress({ label: 'Importing', fraction: .4 }), min: 300 },
      { label: 'Compact titled arc', node: K.ArcProgress({ label: 'Loading', size: 'compact' }), min: 300 },
    ]);
  }
  function anatomy(ctx) {
    var big = h('div', { style: { width: '176px', height: '176px', color: '#fff', margin: '0 auto' } }, S({ size: 'page' }));
    big.firstChild.style.width = '176px'; big.firstChild.style.height = '176px'; big.firstChild.querySelector('svg').style.animationPlayState = 'paused';
    var key = h('ul', { style: { margin: 0, paddingLeft: '1.2em', font: 'var(--fs-sub) var(--font)' } }, ['Ring: 22% of the text colour.', 'Top quarter (centred at -90 degrees): 96%.', 'Right quarter (centred at 0 degrees): 72%.', 'Butt caps; one turn per 0.82 s, linear.', 'Takes the colour of the text around it (currentColor), so it works on a tinted button.'].map(function (t) { return h('li', t); }));
    return CM.grid(ctx, [{ label: 'Anatomy (frozen, drawn at 4x)', node: h('div.cm-row', { style: { gap: '24px' } }, big, key), w: 560 }], { surfaces: ['page'] });
  }
  function paused(ctx) {
    var a = S({ size: 'page' }); a.querySelector('svg').style.animation = 'none';
    var b = S({ size: 'page' }); b.querySelector('svg').style.animation = 'none'; b.querySelector('svg').style.transform = 'rotate(137deg)';
    return CM.grid(ctx, [{ label: 'arcSpinnersPaused (galleries and UI tests only)', node: h('div.cm-row', a, b, lab('Held still: a spinner that never stops keeps the app from going idle, so XCUITest waits out its timeout.')), w: 560 }], { surfaces: ['page'] });
  }
  var compare = { a: null, b: null };
  function reduce(ctx) {
    function box(rm) {
      var s = S({ size: 'page' }), svg = s.querySelector('svg'); svg.style.animation = 'none';
      var n = h('span', { style: { font: '600 var(--fs-body) var(--mono)', fontVariantNumeric: 'tabular-nums' } }, '0.0 turns');
      var c = h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' } }, s, h('span', { style: { font: 'var(--fs-sub) var(--font)' } }, rm ? 'Reduce Motion: 1.64 s a turn' : 'Normal: 0.82 s a turn'), n);
      c.__run = function () { var period = rm ? 1640 : 820, t0 = performance.now(), dur = 3300; return new Promise(function (res) { (function tick(now) { var t = Math.min(now - t0, dur); svg.style.transform = 'rotate(' + (360 * t / period) + 'deg)'; n.textContent = (t / period).toFixed(1) + ' turns'; if (t < dur) requestAnimationFrame(tick); else res(); })(t0); }); };
      return c;
    }
    var a = box(false), b = box(true), play = CM.play(function () { return Promise.all([a.__run(), b.__run()]); }, 'Run 3.3 s');
    var host = h('div', { 'data-compare': 'true', style: { display: 'flex', flexDirection: 'column', gap: '12px' } }, h('div.cm-row', { style: { gap: '36px' } }, a, b), play);
    host.__play = function () { return Promise.all([a.__run(), b.__run()]); };
    return CM.grid(ctx, [{ label: 'Turn speed: normal against Reduce Motion', node: host, w: 560 }], { surfaces: ['page'] });
  }
  Mock.mount({
    kind: 'component', id: 'arc-spinner', title: 'ArcSpinner and ArcProgressViewStyle', area: 'design', status: 'shipped', frame: false,
    summary: 'The app\'s one loading indicator: the web\'s arc (a 22% ring with its top quarter at 96% and its right quarter at 72%, one turn per 0.82 s), not the system petal spinner. Three sizes, one colour (the text around it), spoken as "Loading" or the action it stands for. Under Reduce Motion it keeps turning at half speed.',
    source: ['apple/Sources/HassDesign/ArcSpinner.swift', 'apple/Sources/HassDesign/ArcProgressViewStyle.swift', 'apple/Sources/HassDesign/Loading/ContentGate.swift', 'apple/Sources/HassUI/App/Shell/ReconnectingChip.swift'],
    spec: ['.agents/design/direction-g.md', '.agents/patterns/content-gate.md', '.agents/design/motion.md'],
    patterns: ['content-gate', 'motion'],
    hig: ['Progress indicators', 'Loading', 'Motion', 'Accessibility: Reduce Motion'],
    entities: [],
    kitComponents: ['ArcSpinner', 'ArcProgress', 'PrimaryButton'],
    devices: ['iphone', 'ipad-portrait'],
    states: {
      'default': { title: 'Three sizes', render: sizes },
      'in-context': { title: 'In real places', note: 'Signing In…, Updating, Looking for a Barcode, Sending Open and the header arc (in flight)', render: inContext },
      'titled': { title: 'Titled arc and the determinate bar', render: titled },
      'anatomy': { title: 'Anatomy', render: anatomy },
      'paused': { title: 'Paused (galleries)', render: paused },
      'reduce-motion': { title: 'Turn speed: normal and Reduce Motion', render: reduce },
      'loading': { title: 'The spinner is the loading state', note: 'see the content-gate mockup for when it appears', render: sizes },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the arc itself keeps its size (a fixed 44, 20 or 16 pt); the label beside it grows and wraps', render: inContext },
    },
    motion: [
      { id: 'turn', what: 'The arc turns once every 0.82 s, linear, for as long as something is pending', token: 'ArcSpinner.period 0.82 s linear (a spinner, the one allowed repeatForever)', state: 'default',
        source: 'HassDesign/ArcSpinner.swift angle(at:reduceMotion:); motion.md section 5', reduce: 'half speed: 1.64 s a turn (a still arc reads as frozen)',
        play: function (stage) { var s = stage.querySelector('.ui-arc svg'); s.getAnimations().forEach(function (a) { a.cancel(); }); return CM.anim(s, [{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: Mock.settings.reduceMotion ? 1640 : 820, iterations: 3, easing: 'linear' }).then(function () { s.style.animation = ''; }); } },
      { id: 'speed-compare', what: 'The same arc at normal and Reduce Motion speed, side by side with a turn counter', token: '0.82 s and 1.64 s a turn', state: 'reduce-motion',
        source: 'ArcSpinner.angle(at:reduceMotion:)', reduce: 'this item shows both on purpose',
        play: function (stage) { return stage.querySelector('[data-compare]').__play(); } },
    ],
    transitions: [],
    a11y: [
      { rule: 'Name and traits', note: 'One element labelled "Loading" or the action ("Signing In", "Sending Open", "Looking for a Barcode"), with the updatesFrequently trait and accessibilityRespondsToUserInteraction(false): a status, not a control, so the 16 pt inline arc does not fail the hit-area audit.' },
      { rule: 'Titled form', note: 'ArcProgressViewStyle hides the arc and lets the title speak, so "Loading recipes" is read once; the title uses the surface\'s secondary ink (the system gray measured 3.1:1 over the wallpaper).' },
      { rule: 'Reduce Motion', note: 'Spinners keep turning (they carry meaning) at half speed; nothing else about them changes. Pending pulses, by contrast, stop (see the pending-value-bar mockup).' },
      { rule: 'Colour', note: 'It takes the foreground style around it, so contrast is the text\'s: the ring is 22%, the quarters 96% and 72% of that colour.' },
      { rule: 'Never full screen', note: 'No full-screen or app-wide spinner; no spinner while live house data loads (the snapshot covers it) (motion.md section 5).' },
    ],
    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Progress indicators: use an indeterminate indicator for unknown waits, and keep it small', verdict: 'pass', note: 'Appears only where something is genuinely pending: the pressed button or a gate for network content.' },
        { rule: 'Progress indicators: prefer the system spinner', verdict: 'departure', note: 'Owner 2026-10-14: "For loading spinners, can we use native arc spinners like the web?" (direction-g.md Loading and feedback).' },
        { rule: 'Motion: respect Reduce Motion', verdict: 'pass', note: 'Half speed, not stopped (motion.md section 8).' },
        { rule: 'Accessibility: label the indicator with what is loading', verdict: 'pass', note: 'Label parameter; "Loading" by default.' },
      ],
      swiftui: [
        { rule: 'Do not animate with repeatForever', verdict: 'pass', note: 'TimelineView(.animation) computes the angle from the date; no implicit animation.' },
        { rule: 'Pause galleries', verdict: 'pass', note: 'arcSpinnersPaused for the galleries so XCUITest can go idle.' },
        { rule: 'Use foreground style, not a fixed colour', verdict: 'pass', note: '.foreground.opacity(...) strokes inherit the text colour.' },
        { rule: 'Reduce Motion read from the environment', verdict: 'pass', note: '@Environment(\\.accessibilityReduceMotion).' },
      ],
    },
    notes: [
      'The kit\'s ArcSpinner draws the turn in CSS (animation .82 s); the Play buttons here use the Web Animations API so the Reduce Motion switch and the side-by-side counter are exact.',
      'The in-flight reconnecting arc in the header (branch claude/reconnecting-spinner) is the compact size in a glass circle; see its proposal.',
      'Component mockup: no device frame; Device selects the size class.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass.' }],
  });
})();
