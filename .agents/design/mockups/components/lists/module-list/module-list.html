<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModuleList and ModuleRow · component mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/inventory/_inventory.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, V = Mock.inv;
  function sw(c, surface, cap, node, w) { return V.swatch(surface, cap, node, c, w || 380); }
  function txt(t) { return h('span', { style: { color: 'inherit' } }, t); }
  function mk() { return [{ title: 'Front Door', symbol: 'lock', glyph: 'var(--fam-contact-glyph)', accessory: txt('Locked') }, { title: 'Left Door', symbol: 'door.garage.closed', glyph: 'var(--fam-contact-glyph)', accessory: txt('Closed') },
    { title: 'Room Thermostats', subtitle: 'View each room\'s temperature.', symbol: 'house', chevron: true }]; }

  var base = Mock.componentConfig('ModuleList', { surfaces: ['page', 'sheet'] });
  var cfg = Object.assign(base, {
    states: base.states,
    id: 'module-list', title: 'ModuleList and ModuleRow (inset list)', area: 'design', status: 'shipped',
    summary: 'The inset list on the wallpaper (direction G, Controls: Lists): rows on one 26 pt module with hairlines inset to the text; a family-coloured glyph, a title (17) with an optional subtitle (13), a trailing accessory and a chevron when the row opens something. 52 pt, 60 pt with a subtitle. In a sheet the same rows sit on the sheet cell. A real List (swipe actions) draws each row\'s share with ModuleRowBackground.',
    source: ['apple/Sources/HassDesign/ModuleList.swift', 'apple/Sources/HassDesign/Module.swift', 'apple/Sources/HassUI/Features/Inventory/InventoryRow.swift', 'apple/Sources/HassUI/Features/Sprinklers/SprinklersScreen.swift'],
    spec: ['.agents/patterns/module-list.md', '.agents/design/direction-g.md'],
    patterns: ['module-list'],
    hig: ['Lists and tables', 'Color', 'Dynamic Type', 'Accessibility', 'Materials'],
    kitComponents: ['ModuleList', 'ModuleRow', 'ToggleRow', 'Toggle', 'StatusPill'],
    devices: ['iphone', 'ipad-portrait'],
    a11y: [
      { rule: 'Row element', note: 'The title and subtitle combine into one element ("Thermostat Hub, Heat"); a trailing accessory (a switch, a pop-up) stays its own control; the glyph and the chevron are decorative. A row that does something is a Button around the row with the label, value and hint.' },
      { rule: 'Targets', note: 'Rows are at least 52 pt (60 with a subtitle) and grow with the text; the whole row is the target (contentShape rectangle).' },
      { rule: 'Unavailable rows', note: 'Only the glyph dims (glyphOpacity 0.5); the text keeps full contrast so it stays readable (a faded label fails the contrast audit).' },
      { rule: 'Dynamic Type', note: 'At accessibility sizes the accessory moves under the text so neither truncates; titles wrap.' },
      { rule: 'Colour', note: 'Neutral glyphs use the surface\'s secondary ink (module or sheet); family glyphs are never the only state cue (the value or subtitle says it). Red or orange text needs the dense module.' },
      { rule: 'Reduce Transparency', note: 'The module becomes opaque (#1C1C1E thin, #141416 dense); a sheet already draws an opaque cell.' },
    ],
    reviews: {
      date: '2026-10-23', by: 'author',
      hig: [
        { rule: 'Lists and tables: rows 44 pt or taller, separators inset to the text', verdict: 'pass', note: 'Hairlines start at the text (the glyph column), or at the 16 pt margin with hasGlyphs false.' },
        { rule: 'Lists: use inset grouped appearance', verdict: 'pass', note: '26 pt continuous corners on a module; the system Form in sheets.' },
        { rule: 'Materials: Liquid Glass only on the navigation layer', verdict: 'pass', note: 'The module is a content-layer tint, never glassEffect.' },
        { rule: 'Color: sufficient contrast for secondary text', verdict: 'pass', note: 'Secondary on module rgba(235,235,245,.68) and in sheets Surface.secondaryInSheet.' },
        { rule: 'Lists: hairlines on iOS 17', verdict: 'departure', note: 'iOS 17 has no API to visit a view builder\'s rows, so rows sit flush with no hairline there (the deployment target, not a device Stephen uses).' },
      ],
      swiftui: [
        { rule: 'Use List for swipe actions before iOS 27', verdict: 'pass', note: 'ModuleRowBackground and moduleRowSeparator give a List\'s rows the module look (Chores, Inventory).' },
        { rule: 'Avoid per-row offscreen passes', verdict: 'pass', note: 'The row background is the shape fill, not a clip over a square one (a clip is an offscreen mask per row per frame).' },
        { rule: 'Animate colour with the app token', verdict: 'pass', note: 'stateForeground("ModuleRow", …) on the glyph and subtitle; quickTransition on the press highlight.' },
        { rule: 'One implementation per pattern', verdict: 'fix', note: 'InventoryRowBackground is still a private copy; fold it into ModuleRowBackground (pattern doc).' },
      ],
    },
    notes: [
      'Users: Security Doors and Mach-E, Climate Thermostat Hub and Advanced Controls, Chores to-do lists and the Summary sheet tabs, the Vacation checklist, Food link rows and recipe sheet lists, Vacuums Auto-Clean and sheet lists, Custom Lights, Sprinklers\' controller cards (a ModuleList of a row plus a 2-column grid of StatusPills).',
      'The Security and Climate pages are owned by other mockups; the "in context" rows here follow the #Preview in ModuleList.swift.',
      'Pressed: ModuleRowButtonStyle fills the row with the label ink at 10%; down at once, released with quick (0.2 s) under a Button.',
      'Dense: use when a row carries red or orange text; the dense module is #141416 at 78%.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: thin, dense, no glyph, accessories, a List\'s row backgrounds, pressed, AX5.' }],
  });
  cfg.states['accessories'] = { title: 'Accessories, chevron and subtitle rows', render: function (c) {
    var sw1 = K.ModuleRow({ title: 'Guests Staying Over', symbol: 'person.2', glyph: 'var(--fam-occupancy-glyph)', accessory: K.Toggle({ on: true, label: 'Guests Staying Over' }) });
    var off = K.ModuleRow({ title: 'Back Deck Light', subtitle: 'Unavailable', symbol: 'lightbulb', glyph: 'var(--fam-lights-glyph)', glyphOpacity: .5 });
    return V.grid([sw(c, 'page', 'value accessories and a chevron row', K.ModuleList({ rows: mk() })), sw(c, 'sheet', 'the same on the sheet cell', K.ModuleList({ rows: mk() })),
      sw(c, 'page', 'a switch accessory (switches only in list rows)', K.ModuleList({ rows: [sw1] })), sw(c, 'page', 'unavailable: only the glyph dims', K.ModuleList({ rows: [off, { title: 'Hallway Vent', symbol: 'wind', glyph: 'var(--fam-vents-glyph)' }] }))]); } };
  cfg.states['dense-and-list'] = { title: 'Dense, and a List\'s per-row backgrounds', note: 'the inventory page is a List (swipe actions need one before iOS 27): each row draws its share of the module, rounding the first row\'s top and the last row\'s bottom', render: function (c) {
    var cards = V.cards('all-food');
    var dense = K.ModuleList({ density: 'dense', rows: [{ title: 'Replace the furnace filter', subtitle: 'Overdue · 3 days', subtitleInk: 'var(--g-red)', symbol: 'exclamationmark.circle', glyph: 'var(--g-red)' }, { title: 'Water the planters', subtitle: 'Due tomorrow', subtitleInk: 'var(--g-orange)', symbol: 'clock', glyph: 'var(--g-orange)' }] });
    return V.grid([sw(c, 'page', 'dense: red and orange subtitles', dense), sw(c, 'page', 'a List with row backgrounds (the inventory page)', V.list([V.row(cards[0]), V.row(cards[1]), V.row(cards[2])])), sw(c, 'sheet', 'the same List rows in a sheet (cell colour)', V.list([V.row(cards[0]), V.row(cards[5])]))]); } };
  cfg.states['rows'] = { title: 'Rows without a list', render: function (c) { return V.grid([sw(c, 'page', 'no glyphs: hairlines from the 16 pt margin', K.ModuleList({ hasGlyphs: false, rows: [{ title: 'Preheat the oven' }, { title: 'Season the chicken' }, { title: 'Roast for 45 minutes' }] })),
    sw(c, 'sheet', 'steps in a sheet, no glyphs', K.ModuleList({ hasGlyphs: false, rows: [{ title: 'Preheat the oven' }, { title: 'Season the chicken' }] }))]); } };
  cfg.states['in-context'] = { title: 'In context (the ModuleList.swift preview)', render: function (c) {
    return h('div', V.embed('iphone', c, function (cx) { return Mock.page(cx, { title: 'Security', section: 'security', badge: 3, choresBadge: 2, body: [K.ModuleList({ rows: mk() })] }); }, .6, 'On a page: the rows of the preview on the thin module'),
      V.embed('iphone', c, function (cx) { return Mock.sheet(cx, { title: 'Kitchen Lights', detent: 'fitted', size: 'page', presenter: Mock.page(cx, { title: 'Kitchen', back: 'Rooms', section: 'home', body: [] }), content: K.ModuleList({ rows: mk().slice(0, 2) }) }); }, .6, 'In a sheet: the sheet cell, title and secondary ink of the sheet')); } };
  cfg.states['ax5'] = { title: 'Accessibility 5: accessory under the text', override: { ts: 'ax5' }, note: 'at accessibility sizes the accessory leaves the row\'s line', render: function (c) { return V.grid([sw(c, 'page', 'AX5', K.ModuleList({ rows: mk().slice(0, 2) }), 560), sw(c, 'sheet', 'AX5 in a sheet', K.ModuleList({ rows: mk().slice(2) }), 560)]); } };
  cfg.motion = [
    { id: 'row-press', what: 'Pressing a row: a light highlight across it while held', token: 'down at once, released with quick 0.2 s (label ink at 10%)', state: 'accessories',
      source: 'HassDesign/ModuleList.swift ModuleRowButtonStyle quickTransition; design/motion-components.md', reduce: 'unchanged (opacity is not motion)',
      play: function (stage) { var r = stage.querySelector('.ui-mrow'); if (!r) return Promise.resolve(); r.style.transition = 'background-color .2s ease-out'; r.style.background = 'var(--press)'; return Mock.sleep(700).then(function () { r.style.background = ''; return Mock.sleep(400); }); } },
    { id: 'glyph-colour', what: 'A row\'s glyph and subtitle change colour with its state (a sprinkler starts watering)', token: 'state 0.6 s ease-in-out (0.2 s reduced), colour only', state: 'accessories',
      source: 'ModuleRow stateForeground("ModuleRow", …); SprinklersScreen controller row', reduce: 'still cross-fades at 0.2 s',
      play: function (stage) { var g = stage.querySelector('.ui-mrow .rg'); if (!g) return Promise.resolve(); g.style.transition = 'color ' + Mock.anim.ms.state() + 'ms ease-in-out'; var was = getComputedStyle(g).color; g.style.color = 'var(--fam-water-glyph)'; return Mock.sleep(Mock.anim.ms.state() + 400).then(function () { g.style.color = was; return Mock.sleep(Mock.anim.ms.state() + 200); }); } },
  ];
  Mock.mount(cfg);
})();
</script></body></html>
