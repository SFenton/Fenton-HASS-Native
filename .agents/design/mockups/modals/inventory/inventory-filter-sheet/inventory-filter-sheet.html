<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filter Inventory · modal mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/inventory/_inventory.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, V = Mock.inv;
  function presenter(ctx, o) { return V.page(ctx, Object.assign({ space: 'all-food', noFab: true }, o)); }
  function sheet(ctx, o) { o = o || {}; return Mock.sheet(ctx, Object.assign(V.filterSheet(ctx, o), { presenter: presenter(ctx, o.page), detent: o.detent || 'fitted' })); }

  Mock.mount({
    kind: 'modal', id: 'inventory-filter-sheet', title: 'Filter Inventory', area: 'inventory', status: 'shipped',
    summary: 'The Filter button opens a form sheet on the shared FilterSheet: one "Show" list of seven expiry filters, each with what it keeps, and a count under the title ("2 of 10 Items") that follows the draft. Apply is the filled check; Reset to Defaults is a list row.',
    source: ['apple/Sources/HassUI/Features/Inventory/InventoryControlSheets.swift', 'apple/Sources/HassUI/Features/Inventory/InventoryListModel+Summary.swift', 'apple/Sources/HassDesign/FilterSheet.swift', 'apple/Sources/HassDesign/SheetEditToolbar.swift', 'apple/Sources/HassDesign/SheetSubtitle.swift', 'apple/Sources/HassCore/Inventory/InventoryCatalog.swift'],
    spec: ['.agents/pages/inventory/spec.md', '.agents/pages/inventory/ios.md', '.agents/patterns/floating-actions.md'],
    patterns: ['floating-actions', 'modal-sheet'],
    hig: ['Sheets', 'Lists and tables', 'Toolbars', 'Dynamic Type'],
    kitComponents: ['FilterSheet', 'FilterSection', 'FilterOptionRow', 'HassModal', 'SheetCancelItem', 'SheetConfirmItem'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-portrait', 'duo-unfolded-landscape', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'All Items (the default)', note: '"10 of 10 Items" under the title (iOS 26 subtitle); Apply disabled, Reset hidden', render: function (c) { return sheet(c, {}); } },
      'changed': { title: 'Expiring Within a Week chosen', note: 'the subtitle counts the draft ("2 of 10 Items"), Apply enables, Reset to Defaults appears; the page Filter button turns filled once applied', render: function (c) { return sheet(c, { sel: 'week' }); } },
      'expired': { title: 'Expired', note: '"1 of 10 Items"', render: function (c) { return sheet(c, { sel: 'expired' }); } },
      'none': { title: 'No Expiration Date', note: '"1 of 10 Items" (Honey)', render: function (c) { return sheet(c, { sel: 'none' }); } },
      'zero': { title: 'A filter with no match (freezer)', note: 'the count reads "0 of 1 Item"; applying shows No Matching Items on the page', render: function (c) { return sheet(c, { sel: 'expired', space: 'freezer' }); } },
      'medium': { title: 'Medium detent', note: 'what it opens at until measured; seven rows with hints are taller than medium, so the fitted height replaces it', render: function (c) { return sheet(c, { detent: 'medium' }); } },
      'fitted': { title: 'Fitted detent (shipped)', render: function (c) { return sheet(c, { detent: 'fitted', sel: 'week' }); } },
      'large': { title: 'Large detent', note: 'seven hinted rows reach the large cap on iPhone and scroll', render: function (c) { return sheet(c, { detent: 'large', sel: 'week' }); } },
      'closed': { title: 'Over the page, before presenting', render: function (c) { return V.page(c, { space: 'all-food' }); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the subtitle and every hint wrap; the sheet scrolls; headers wrap', render: function (c) { return sheet(c, { sel: 'week', detent: 'large' }); } },
    },

    motion: [
      { id: 'option-check', what: 'Choosing a filter: the check fades in on the new row and out on the old one', token: 'quick 0.2 s easeOut', state: 'changed',
        source: 'HassDesign/FilterSheet.swift FilterOptionRow quickTransition; motion.md section 7 quick', reduce: 'unchanged (opacity is not motion)',
        play: function (stage) { var rows = stage.querySelectorAll('.ui-optrow'); var cur = stage.querySelector('.ui-optrow.sel'); rows[1].classList.add('sel'); if (cur) cur.classList.remove('sel');
          return Mock.sleep(500).then(function () { rows[1].classList.remove('sel'); if (cur) cur.classList.add('sel'); return Mock.sleep(500); }); } },
      { id: 'count-roll', what: 'The "n of N Items" subtitle changes with the draft', token: 'none specified: the system navigation subtitle swaps text', state: 'changed',
        source: 'FilterSheet.swift sheetSubtitle(subtitle); InventoryFilterSheet filterSummary(mode)', reduce: 'unchanged',
        note: 'Gap: the subtitle has no numeric transition (motion.md section 6 asks for contentTransition(.numericText) on numbers). It is the system subtitle, so the swap is instant; flagged, not changed.',
        play: function (stage) { var s = stage.querySelector('.ui-mhead .su'); return Mock.anim.roll(s, '1 of 10 Items').then(function () { return Mock.sleep(400); }).then(function () { return Mock.anim.roll(s, '2 of 10 Items'); }); } },
    ],
    transitions: [
      { from: 'Inventory page', to: 'Filter Inventory sheet', kind: 'sheet', state: 'closed', note: 'Presents a form sheet at its fitted height; the page scales back and dims.',
        play: function (stage) { return Mock.presentDemo(stage, V.filterSheet(Mock.current, {})); } },
      { from: 'Filter Inventory sheet', to: 'Inventory page', kind: 'sheet', state: 'changed', note: 'Apply commits and dismisses (the rows reload through the results gate); Cancel or a swipe drops the draft.',
        play: function (stage) { return Mock.anim.sheet(stage.querySelector('.ui-host'), 'out').then(function () { return Mock.sleep(400); }); } },
    ],

    a11y: [
      { rule: 'Reading order', note: 'Title and subtitle ("Filter Inventory", "2 of 10 Items"), Cancel, Apply; the Show heading; the seven rows; Reset to Defaults when shown.' },
      { rule: 'Option rows', note: 'One element each: "Expiring Within a Week, Items expiring in the next 7 days." with the selected trait on the chosen row; check decorative; 44 pt minimum height, growing with the text.' },
      { rule: 'Count', note: 'The subtitle is the one place the number of matching items shows before applying; it is spoken with the title.' },
      { rule: 'Header', note: 'The section is called "Show" (the web\'s "Filter Items" repeated the sheet title); FilterSection wraps at AX sizes and carries the heading trait.' },
      { rule: 'Dynamic Type', note: 'At AX5 the sheet is a full-height scroll; subtitles wrap by word; nothing is clipped (the earlier custom header clipped).' },
      { rule: 'Not colour alone', note: 'The chosen filter is a check glyph plus the selected trait, never colour alone.' },
    ],
    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Sheets: Cancel leading, confirm trailing', verdict: 'pass', note: 'The shared FilterSheet draft: Cancel drops, Apply commits, disabled until the choice changes (InventoryControlSheets.swift:62-68).', by: 'apple-hig skill' },
        { rule: 'Sheets: unsaved changes on swipe down', verdict: 'fix', note: 'A swipe down discards a chosen filter silently (FilterSheet.swift has no interactiveDismissDisabled).', by: 'apple-hig skill' },
        { rule: 'Lists: single choice with a checkmark', verdict: 'pass', note: 'Seven FilterOptionRow rows with a checkmark, isSelected and a line saying what each keeps; the subtitle counts the matches ("2 of 10 Items").', by: 'apple-hig skill' },
        { rule: 'Feedback: say what a choice will do', verdict: 'pass', note: 'filterSummary(mode) updates under the title as the draft changes, including a filter with no match (InventoryControlSheets.swift:64).', by: 'apple-hig skill' },
      ],
      swiftui: [
        { rule: 'Presentation: sheet(item:) and the shared sheet size', verdict: 'pass', note: 'InventorySheetContent switches on an Identifiable InventorySheet used with .sheet(item:) (InventoryScreen.swift:86-88).', by: 'swiftui-pro skill' },
        { rule: 'Accessibility: Dynamic Type', verdict: 'pass', note: 'Reset to Defaults pads with @ScaledMetric so the row grows with the text (FilterSheet.swift:24, 58).', by: 'swiftui-pro skill' },
      ],
    },
    notes: [
      'loading: none. The filter runs on rows already loaded; the sheet opens complete.',
      'error: none. Nothing to fail; the count is computed locally from the cards.',
      'offline: none. It filters the session\'s snapshot rows; the page behind carries the offline chip.',
      'Filter windows (InventoryFilterMode.includes): Expired is days below 0, a week 0 to 7, a month 0 to 30, 6 months 0 to 183, a year 0 to 365, No Expiration Date only undated; the page\'s "soon" tone is under 7 days, so a card 7 days out is in the week filter but not orange.',
      'Duo unfolded: the centred form sheet crosses the hinge band here (the system decides placement; check on a device).',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: default, four filters, three detents, AX5, light and dark.' }],
  });
})();
</script></body></html>
