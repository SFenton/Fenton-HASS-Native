<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacuum cleaning report · modal mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../room-devices/_devices-vacuums.js"></script>
<script src="../_devices-vacuums.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, dv = Mock.dv, vac = dv.vac;
  var TITLE = 'Main Floor · Automatic Cleaning Report (4)';

  /* VacuumOutcomeDetailView is pushed from the Cleaning Report row (Route.report): system Back, the long title inline, then one ModuleList with a row per room:
     the room name, one sentence of detail, a status glyph, and the status word trailing. */
  function S(kind, o) { o = o || {}; return function (c) { return vac.pushed(c, { title: TITLE, content: vac.reportDetail(kind), connection: o.connection }); }; }

  Mock.mount({
    kind: 'modal', id: 'vacuum-outcome-report', title: 'Cleaning outcome report (pushed)', area: 'vacuums', status: 'shipped',
    summary: 'The page pushed from the vacuum sheet\'s Cleaning Report row: what the coordinator did room by room during the last automatic clean while away. Each room carries a status glyph, a sentence of detail and the status word.',
    source: ['apple/Sources/HassUI/Features/Vacuums/VacuumMapPanel.swift', 'apple/Sources/HassUI/Features/Vacuums/VacuumSheet.swift', 'apple/Sources/HassCore/Vacuums/VacuumOutcomes.swift', 'apple/Sources/HassCore/Vacuums/VacuumOutcomeFixtures.swift'],
    spec: ['.agents/patterns/vacuum-sheet.md', '.agents/pages/vacuums/spec.md'],
    patterns: ['vacuum-sheet', 'module-list', 'modal-sheet'],
    hig: ['Navigation bars', 'Lists', 'Color', 'Dynamic Type'],
    entities: ['sensor.main_floor_vacuum_coordinator_session_state'],
    kitComponents: ['HassModal', 'BackButton', 'ModuleList'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-landscape', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'Two completed, one interrupted, one not attempted', note: 'the gallery fixture: "Cleaning was interrupted because someone returned home."', render: S('interrupted') },
      'completed': { title: 'All four completed', note: 'the sheet\'s row reads "4 Rooms Completed" with a green check', render: S('completed') },
      'stuck': { title: 'One failed: stuck', note: 'a red alert glyph; "The vacuum became stuck while trying to clean the room."', render: S('stuck') },
      'unverified': { title: 'One completion unverified', note: '"Completion could not be verified from the available vacuum data."', render: S('unverified') },
      'offline': { title: 'Over an offline Vacuums page', note: 'no offline UI of its own: the report is a snapshot of the coordinator\'s attribute', render: S('interrupted', { connection: 'offline' }) },
      'large': { title: 'Large detent (shipped, full height)', render: S('interrupted') },
      'closed': { title: 'The sheet it was pushed from', note: 'the Cleaning Report row under the map', render: function (c) { return vac.sheet(c, {}); } },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the status word moves under the sentence at AX sizes; rows grow', render: S('interrupted') },
    },

    motion: [],

    transitions: [
      { from: 'Cleaning Report row', to: 'Report detail', kind: 'push', state: 'closed', note: 'The system push inside the sheet: the report slides in from the trailing edge, the sheet shifts left and dims; Back pops. Reduce Motion cross-fades.',
        play: function (stage) { return vac.pushDemo(stage, { title: TITLE, content: vac.reportDetail('interrupted') }); } },
    ],

    a11y: [
      { rule: 'Reading order', note: 'Back, the title "Main Floor · Automatic Cleaning Report (4)"; then one row per room in report order; no Close (the root toolbar does not follow a push).' },
      { rule: 'Rows', note: 'Each row is one combined element: "Kitchen, Vacuuming and mopping completed for the room., Completed" (identifier vacuum.outcome.<room>); the glyph tone is decorative because the status word says it.' },
      { rule: 'Not colour alone', note: 'Check, pause, clock, alert and question glyphs differ in shape as well as colour, and each row states Completed, Interrupted, Not Attempted, Failed or Completion Unverified in words.' },
      { rule: 'Dynamic Type', note: 'Row text wraps; the trailing status never truncates (fixedSize vertical, multiline trailing).' },
      { rule: 'Targets', note: 'Rows are 60 pt tall at default size; the page has no controls but Back.' },
    ],

    reviews: {
      date: '2026-10-23',
      hig: [
        { rule: 'Lists: group related rows with the standard row anatomy', verdict: 'pass', note: 'ModuleRow: glyph, title, subtitle, trailing value.' },
        { rule: 'Navigation bars: titles are short', verdict: 'departure', note: 'The inline title is long ("Main Floor · Automatic Cleaning Report (4)") and may truncate or wrap in the bar; it mirrors the web\'s title (spec.md) and VoiceOver reads it whole.' },
        { rule: 'Color: not the only differentiator', verdict: 'pass', note: 'Distinct glyphs and words.' },
        { rule: 'Dark Mode: support both appearances', verdict: 'pass', note: 'Sheet cell colours follow the system.' },
      ],
      swiftui: [
        { rule: 'Combine row children for VoiceOver', verdict: 'pass', note: 'accessibilityElement(children: .combine) per row.' },
        { rule: 'Pure presentation helpers are testable', verdict: 'pass', note: 'VacuumOutcomeText is in HassCore.' },
        { rule: 'No animation', verdict: 'pass', note: 'The page has none of its own.' },
      ],
    },

    notes: [
      'loading and error: the report is a snapshot of the session sensor\'s attribute; the page never loads. An incomplete, malformed or unsupported report never reaches this page: the sheet\'s row shows a notice instead (vacuum-sheet state report-notice).',
      'medium and fitted: a pushed level inside a full-height sheet; only large exists.',
      'Docs versus code: spec.md describes expandable "Cleaning Evidence" under each room and a "Back to Vacuum Controls" label; the native page has neither (rows only, system Back).',
      'Sentences are the real copy from VacuumOutcomeText (attemptSentence, reason text); the fixture is VacuumOutcomeFixtures.sample (10 Oct 2026, Kitchen and Office completed, Living Room interrupted, Dining Room deferred).',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass built with the kit: interrupted fixture, completed, stuck, unverified, offline, AX5; light and dark.' }],
  });
})();
</script></body></html>
