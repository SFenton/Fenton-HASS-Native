<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Summary · modal mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../../../pages/settings/_settings-account.js"></script>
<script src="../../../pages/settings/_settings-page.js"></script>
<script src="../../settings/_settings-account.js"></script>
<script src="../_settings-account.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components;
  var Y = function (o) { return function (ctx) { return SA.summarySheet(ctx, o); }; };

  function swapTab(stage, tab) {
    var ctx = Mock.current, fresh = SA.summarySheet(ctx, { tab: tab });
    ['.ui-mscroll', '.ui-mtabs'].forEach(function (sel) { var a = stage.querySelector(sel), b = fresh.querySelector(sel); while (a.firstChild) a.removeChild(a.firstChild); while (b.firstChild) a.appendChild(b.firstChild); });
  }

  Mock.mount({
    kind: 'modal', id: 'your-summary', title: 'Your Summary (Account sheet, four tabs)', area: 'shell', status: 'shipped',
    summary: 'The sheet behind the header Profile button: the web’s Daily Report modal as a full-height sheet with four bottom tabs, Profile, Overdue Chores, Upcoming Chores and Expired Food. Opens on Overdue Chores for a resident (Expired Food for a guest). Follows the system appearance; switch Sheet appearance above.',
    source: ['apple/Sources/HassUI/Features/Settings/Profile/YourSummarySheet.swift', 'apple/Sources/HassUI/Features/Settings/Profile/SummaryPanel.swift', 'apple/Sources/HassUI/Features/Settings/Profile/ProfileTab.swift',
      'apple/Sources/HassUI/Features/Settings/Profile/SummaryChoresTab.swift', 'apple/Sources/HassUI/Features/Settings/Profile/SummaryExpiredFoodTab.swift', 'apple/Sources/HassUI/Features/Settings/Profile/ExpiredFoodList.swift',
      'apple/Sources/HassUI/Features/Settings/Profile/ProfilePeopleSection.swift', 'apple/Sources/HassUI/Features/Settings/Profile/AccountHeader.swift', 'apple/Sources/HassUI/Features/Settings/Profile/PersonRow.swift',
      'apple/Sources/HassUI/Features/Settings/Profile/SummaryEmptyState.swift', 'apple/Sources/HassUI/Features/Location/LocationAccountSection.swift', 'apple/Sources/HassCore/Profile/SummaryTab.swift', 'apple/Sources/HassCore/Profile/ProfileSummary.swift'],
    spec: ['.agents/pages/settings/profile.md', '.agents/design/direction-g.md', '.agents/pages/settings/location.md'],
    patterns: ['modal-sheet', 'module-list', 'motion'],
    hig: ['Sheets', 'Segmented controls', 'Alerts', 'Lists and tables', 'Empty states', 'Privacy'],
    entities: ['person.stephen', 'person.steph', 'todo.stephen_s_past_due_with_unassigned', 'sensor.evershelf_expired_items', 'input_boolean.vacation_mode'],
    kitComponents: ['HassModal', 'ModalTabBar', 'ModuleList', 'PageSectionHeader', 'InlineAlert', 'ArcSpinner', 'Alert', 'SheetCloseItem'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-portrait', 'duo-unfolded-landscape', 'ipad-portrait', 'ipad-landscape'],

    states: {
      'default': { title: 'Overdue Chores (opens here for a resident)', note: 'tab badges: 3 overdue chores, 3 expired items', render: Y({ tab: 'overdue' }) },
      'profile': { title: 'Profile tab', note: 'account header, People at Home, Location (phones only), Sign Out', render: Y({ tab: 'profile' }) },
      'profile-location-off': { title: 'Profile: location access off', note: 'a warning above the footer says nothing is sent; the row reads Off', render: Y({ tab: 'profile', locationStatus: 'Off', warning: 'Location access is off, so nothing is sent. Open Share Location to turn it on in Settings.' }) },
      'upcoming': { title: 'Upcoming Chores', note: 'two sections, due today and No Due Date; each hidden when empty; no badge (informational)', render: Y({ tab: 'upcoming' }) },
      'expired-food': { title: 'Expired Food', note: 'soonest expiry first; red date with a warning glyph, stock above one, cart and chevron', render: Y({ tab: 'expired-food' }) },
      'loading': { title: 'Expired Food loading', note: 'the Food page’s model has no rows yet: a compact arc, "Loading Expired Food"', render: Y({ tab: 'expired-food', phase: 'loading' }) },
      'error': { title: 'Expired Food could not load', note: 'an inline error in place of the rows', render: Y({ tab: 'expired-food', phase: 'error' }) },
      'offline': { title: 'No network', note: 'the sheet reads the entity store, so rows stay as last known; only the page behind shows the offline chip and cloud badge', render: Y({ tab: 'overdue', connection: 'offline' }) },
      'empty-overdue': { title: 'No Chores Due', note: 'SummaryEmptyState, and the tab badges clear', render: Y({ tab: 'overdue', empty: true }) },
      'empty-upcoming': { title: 'No Chores Upcoming', render: Y({ tab: 'upcoming', empty: true }) },
      'empty-food': { title: 'No Expired Food', render: Y({ tab: 'expired-food', empty: true }) },
      'vacation': { title: 'Vacation Mode: chores', note: 'an empty chore tab reads "Enjoy vacation!" under its usual title', render: Y({ tab: 'overdue', vacation: true }) },
      'vacation-food': { title: 'Vacation Mode: Expired Food hidden', note: '"Expired Food Hidden" with "Enjoy vacation!"; the badge is 0 in Vacation Mode', render: Y({ tab: 'expired-food', vacation: true }) },
      'guest': { title: 'Guest viewer: Summary', note: 'title "Summary"; only Profile and Expired Food; opens on Expired Food', render: Y({ viewer: 'guest' }) },
      'steph': { title: 'Steph viewing', note: 'the same four tabs; the Profile tab shows her name', render: Y({ viewer: 'steph', tab: 'profile' }) },
      'sign-out-alert': { title: 'Sign Out asks first', note: 'see modals/shell/sign-out-alert', render: Y({ tab: 'profile', alert: SA.signOutAlert() }) },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the tab bar becomes a menu naming the selected tab; rows wrap; the sheet stays full height', render: Y({ tab: 'overdue' }) },
    },

    motion: [
      { id: 'tab-crossfade', what: 'Switching tabs: the new tab’s content cross-fades in over the old', token: '0.15 s easeInOut (not a MotionTokens value); none under Reduce Motion',
        source: 'HassUI/Features/Settings/Profile/SummaryPanel.swift (.transition(.opacity), .animation(.easeInOut(duration: 0.15)))', reduce: 'no animation: the content cuts',
        play: function (stage) { swapTab(stage, 'upcoming'); var c = stage.querySelector('.ui-mscroll > *'); return Mock.settings.reduceMotion ? Mock.sleep(500) : Mock.anim.fade(c, { ms: 150 }).then(function () { return Mock.sleep(600); }); } },
      { id: 'chore-complete', what: 'Checking off a chore: the circle turns to a green check, the title strikes through, and the row leaves with the standard list animation (back in if the call fails)', token: 'SwiftUI .default list animation (about 0.35 s); 0.2 s easeInOut under Reduce Motion', state: 'default',
        source: 'SummaryChoresTab.swift motionSafeAnimation(.default, reduced: .easeInOut(duration: 0.2)); motion.md section 6 User action', reduce: '0.2 s fade instead of the slide and collapse',
        play: function (stage) {
          var row = stage.querySelector('.ui-mlist .ui-mrow'); var rg = row.querySelector('.rg'), tx = row.querySelector('.ti');
          rg.innerHTML = Mock.icon('checkmark.circle', { fill: true }); rg.style.color = 'var(--ink-success)'; tx.style.textDecoration = 'line-through'; tx.style.color = 'var(--ink-sheet-2)';
          return Mock.sleep(500).then(function () {
            var hgt = row.offsetHeight, a = Mock.settings.reduceMotion ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 1, height: hgt + 'px' }, { opacity: 0, height: '0px' }];
            row.style.overflow = 'hidden'; return row.animate(a, { duration: Mock.settings.reduceMotion ? 200 : 350, easing: 'ease-in-out', fill: 'forwards' }).finished.catch(function () {});
          }).then(function () { return Mock.sleep(500); });
        } },
    ],

    transitions: [
      { from: 'Profile button (any page)', to: 'Your Summary sheet', kind: 'sheet',
        note: 'A full-height form sheet (.hassSheet(.form, height: .full)); a tabbed sheet’s height must not change with a tab. The page scales back and dims on iPhone; on iPad a form sheet at full height. Content is present on arrival.',
        play: function (stage) { var ctx = Mock.current; var s = SA.summarySheet(ctx, { tab: 'overdue' }); return Mock.presentDemo(stage, { title: 'Your Summary', detent: 'large', size: 'form', trailing: 'close', content: s.querySelector('.ui-mscroll > *'), tabs: s.querySelector('.ui-modaltabs') }); } },
      { from: 'Your Summary sheet', to: 'Page', kind: 'sheet', state: 'default', note: 'The circle x Close (account.close) or a swipe down.', play: function (stage) { var host = stage.querySelector('.ui-host'); return Mock.anim.sheet(host, 'out').then(function () { return Mock.sleep(500); }); } },
      { from: 'Sign Out', to: 'Sign Out alert', kind: 'fade', state: 'profile', note: 'The system alert scales and fades in over the sheet; the sheet is not dismissed until sign-out is confirmed by the server.',
        play: function (stage) { var ctx = Mock.current, host = stage.querySelector('.ui-host'), scrim = SA.alertScrim(ctx, SA.signOutAlert()); host.appendChild(scrim); return Mock.anim.fade(scrim, { ms: 200 }).then(function () { return Mock.sleep(1000); }).then(function () { return Mock.anim.fade(scrim, { from: 1, to: 0, ms: 200 }); }).then(function () { scrim.remove(); }); } },
      { from: 'Share Location', to: 'Location permission sheet', kind: 'sheet', note: 'A page sheet over this sheet (phones only); see location-permission-sheet. Shown from the list because a sheet attached inside a List section did not present on the folded Duo (2026-10-15).' },
      { from: 'Edit (chore row)', to: 'Donetick task form', kind: 'sheet', note: 'A form sheet over this sheet with the Chores page’s own task form; see donetick-task-sheet.' },
    ],

    a11y: [
      { rule: 'Reading order', note: 'The title ("Your Summary" or "Summary"), Close (account.close); then the selected tab’s content top to bottom; the bar of tabs last ("Summary sections", summary.tabs). The sheet is modal; the page behind is hidden from VoiceOver.' },
      { rule: 'Tabs', note: 'A segmented control named "Summary sections". Compact width shows icons, each named by its title ("Overdue Chores, 3 items", "1 item" for one); regular width (iPad, unfolded Duo) shows icon over title; accessibility sizes show a menu naming the selected tab. Profile and Upcoming never badge; badges read "9+" past nine.' },
      { rule: 'Chore rows', note: 'Each TodoItemRow’s main button is a toggle: label the title, value "Not done, 3 hours overdue", hint "Marks the task done." Edit is a separate 44 pt button "Edit <title>"; Complete, Edit and Delete are also custom actions for VoiceOver (the swipes).' },
      { rule: 'State is not colour alone', note: 'Overdue is a clock glyph and words ("9 days overdue") in orange or red; expired food is a warning triangle and "Expired Oct 22, 2026" in red; a person at home reads "Home" in green and "Away" in grey.' },
      { rule: 'Profile tab', note: 'AccountHeader is one element (name, server). Each person row is one element ("Stephen Fenton, Home"); the section footer says "2 of 3 Home". Share Location is one element: label, value ("Always"), hint "Shows location access for this iPhone."; a warning is read before the footer.' },
      { rule: 'Empty states', note: 'SummaryEmptyState is a ContentUnavailableView: the glyph is decorative, title and description are read as one group; identifiers summary.empty.<tab>.' },
      { rule: 'Sign Out', note: 'Destructive button, 44 pt minimum, the high-contrast red; the confirmation is an alert (Cancel left, Sign Out red).' },
      { rule: 'Dynamic Type', note: 'At AX5 the tab bar is a menu, the account monogram scales (84 pt scaled metric), rows wrap and the sheet scrolls under the fading header.' },
      { rule: 'Light and dark', note: 'The sheet follows the system appearance: cells #2C2C2E on #1C1C1E in dark, white on #F2F2F7 in light; red and orange text use the light-sheet values (#C21717, #995400).' },
    ],

    reviews: {
      date: '2026-10-23', by: 'author',
      hig: [
        { rule: 'Sheets: a viewing sheet closes with a close button, not Done', verdict: 'pass', note: 'Circle x Close; there is no Done.' },
        { rule: 'Sheets: prefer page or form sizing on iPad', verdict: 'pass', note: 'A form sheet at full height (a tabbed sheet must not change height with a tab).' },
        { rule: 'Segmented controls: closely related views of one summary; keep the control on the sheet, not a tab bar', verdict: 'pass', note: 'ModalTabBar is a segmented control on glass at the bottom, with a menu at AX sizes.' },
        { rule: 'Alerts: confirm a destructive action; red destructive button; a Cancel', verdict: 'pass', note: 'Sign Out Home Assistant alert with Cancel and a red Sign Out.' },
        { rule: 'Empty states: say what is missing and why', verdict: 'pass', note: 'Titles and descriptions per tab, "Enjoy vacation!" in Vacation Mode.' },
        { rule: 'Privacy: ask for location with a pre-alert and show its status', verdict: 'pass', note: 'Share Location opens the permission screen, never the system alert directly; the warning says why nothing is sent.' },
        { rule: 'Color: not the only differentiator', verdict: 'pass', note: 'Glyphs and words accompany orange, red and green.' },
      ],
      swiftui: [
        { rule: 'Animate with the app’s motion tokens and honour Reduce Motion', verdict: 'fix', note: 'The tab content fade is a literal easeInOut 0.15 s, not a MotionTokens value, and motion.md section 4.4 says a sheet’s own tabs are a cut. It already turns off under Reduce Motion.' },
        { rule: 'Use ContentUnavailableView for empty states', verdict: 'pass', note: 'SummaryEmptyState.' },
        { rule: 'Reuse the canonical row; one implementation', verdict: 'pass', note: 'TodoListSection and InventoryRow, not summary-specific rows.' },
        { rule: 'Sheet presentation via the one sizing API', verdict: 'pass', note: '.hassSheet(.form, height: .full).' },
        { rule: 'Do not attach a sheet inside a List section', verdict: 'pass', note: 'The Location permission sheet is presented from the Summary sheet’s root.' },
        { rule: 'Hit targets 44 pt, scaled metrics for glyph sizes', verdict: 'pass', note: 'Edit, cart and chevron are buttonSize 44 (scaled); monogram sizes are @ScaledMetric.' },
      ],
    },

    notes: [
      'medium and fitted do not exist: the sheet is .hassSheet(.form, height: .full), so on iPhone it opens at the large detent and stays there; on iPad it is a form sheet at full height (profile.md says the same). The state "large" is the default.',
      'Docs and code: motion.md 4.4 says a sheet’s own tabs switch as a cut; SummaryPanel cross-fades the content over 0.15 s unless Reduce Motion is on. Drawn per the code. The Profile tab docs still call Sign Out "behind the existing alert", which matches.',
      'Docs and code: the catalog says "Opens on Overdue Chores for residents"; confirmed (SummaryTab.initial). The Duo folded and unfolded show the Location section (iPhone idiom); only an iPad hides it.',
      'Chore and expired-food rows are simplified stand-ins for TodoItemRow and InventoryRow (swipe actions and the completion animation are on the chores and inventory mockups). Fixture names only. Promote to kit: TodoItemRow, DueLabel, InventoryRow, AccountHeader, PersonRow.',
      'A guest’s Profile tab shows "Guest" for the name (navigator.profileName); the people list is a fixture of three entities.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: four tabs, empty and vacation states, guest, loading and error for expired food, sign-out alert, AX5 menu.' }],
  });
})();
</script></body></html>
