<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wake alarm editor · modal mockup</title>
<link rel="stylesheet" href="../../../_kit/kit.css">
<script src="../../../_kit/kit.js"></script>
<script src="../_bedroom-motion.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, B = Mock.bedroom;
  var weekday = B.wake().alarms[0];
  /* WakeLightEditor: pushed inside WakeLightSheet (Add Wake Alarm, or an existing native alarm). */
  function E(o) {
    o = o || {};
    return function (ctx) {
      var w = B.wake(o.wake), e = Object.assign({ w: w }, o.editor), isNew = !e.alarm;
      var title = isNew ? 'Add Wake Alarm' : e.alarm.label;
      var alert = o.del ? B.actionSheet(ctx, 'Delete alarm set for 6:45 AM on Weekdays?', [{ title: 'Delete Alarm', role: 'destructive' }]) : null;
      return B.sheet(ctx, { title: title, leading: 'back', trailing: 'none', content: B.wakeEditor(e), connection: o.connection, alert: alert });
    };
  }
  var edit = { alarm: weekday, kind: 'weekly', days: B.WORKDAYS, time: '06:45', ramp: 30, enabled: true, name: 'Weekday Wake' };
  Mock.mount({
    kind: 'modal', id: 'wake-light-editor', title: 'Wake alarm editor (pushed)', area: 'bedroom', status: 'shipped',
    summary: 'Adds or edits one native wake alarm, pushed inside the Wake-Light sheet: Scheduled or One-Time, a name, days (scheduled) or a date (one-time), the wake time, the light ramp, Enabled, and for a new alarm "Add to" each bed. Save is disabled until something changed; Delete (existing) asks first.',
    source: ['apple/Sources/HassUI/Features/Bedroom/WakeLightSheet.swift', 'apple/Sources/HassUI/Features/Bedroom/BedroomComponents.swift', 'apple/Sources/HassCore/Bedroom/WakeLightContract.swift', 'apple/Sources/HassCore/Bedroom/BedroomDevices.swift', 'apple/Sources/HassUI/Common/SegmentedChoice.swift'],
    spec: ['.agents/patterns/bedroom-devices.md', '.agents/patterns/schedule-date-fields.md'],
    patterns: ['bedroom-devices', 'schedule-date-fields', 'modal-sheet', 'option-picker'],
    hig: ['Sheets', 'Segmented controls', 'Pickers', 'Text fields', 'Toggles', 'Action sheets'],
    entities: ['sensor.master_bedroom_wake_light'],
    kitComponents: ['HassModal', 'BackButton', 'SegmentedChoice', 'TileGrid', 'Toggle', 'PrimaryButton', 'ScheduleDateFields'],
    devices: ['iphone', 'duo-folded', 'duo-unfolded-portrait', 'duo-unfolded-landscape', 'ipad-portrait', 'ipad-landscape'],
    states: {
      'default': { title: 'Add Wake Alarm (new, scheduled weekdays)', note: 'name "Morning Alarm", Monday to Friday, 7:00 AM, the default ramp, both bed switches off', render: E() },
      'edit': { title: 'Edit "Weekday Wake" (no change yet)', note: 'Save is disabled until a field differs; Delete is shown', render: E({ editor: Object.assign({ pristine: true }, edit) }) },
      'edit-changed': { title: 'Edit, time changed', note: 'Save enabled', render: E({ editor: Object.assign({}, edit, { time: '07:00' }) }) },
      'one-time': { title: 'One-Time alarm (date instead of days)', note: 'the Days chips are replaced by an Alarm Date field', render: E({ editor: { kind: 'once', time: '07:00' } }) },
      'one-time-old': { title: 'One-Time, integration too old for beds', note: 'both bed switches disable and a footnote explains', render: E({ wake: { contractVersion: 4 }, editor: { kind: 'once', time: '07:00' } }) },
      'beds-on': { title: 'Add to both beds', render: E({ editor: { beds: { "Stephen's Bed": true, "Steph's Bed": true } } }) },
      'problem': { title: 'No weekday chosen', note: 'a warning above Save: "A recurring alarm requires at least one weekday."; Save disabled', render: E({ editor: { days: [], problems: ['A recurring alarm requires at least one weekday.'] } }) },
      'saving': { title: 'Saving', note: 'the fields disable (the stack is .disabled(saving)) and the button reads "Saving…"', render: E({ editor: Object.assign({}, edit, { saving: true }) }) },
      'stale': { title: 'Changed elsewhere (revision conflict)', note: 'an error notice and the "Open Latest Alarm, Replace Draft" button; Save stays disabled until it is used', render: E({ editor: Object.assign({}, edit, { time: '07:00', stale: true, error: 'Alarm configuration changed elsewhere. Review the latest settings before retrying.' }) }) },
      'error': { title: 'Command refused', render: E({ editor: Object.assign({}, edit, { time: '07:00', error: 'The wake light change was rejected. Review the settings, then try again.' }) }) },
      'delete-confirm': { title: 'Delete asks first', note: 'confirmationDialog "Delete alarm set for 6:45 AM on Weekdays?" with Delete Alarm; Cancel is automatic', render: E({ del: true, editor: edit }) },
      'unavailable': { title: 'Wake light unavailable', note: 'the editor has no banner of its own; Save and Delete disable (locked) and the root page carries the notice', render: E({ wake: { available: false }, editor: Object.assign({}, edit, { time: '07:00', problems: [] }) }) },
      'offline': { title: 'Over an offline Master Bedroom page', render: E({ connection: 'offline', editor: edit }) },
      'large': { title: 'Large detent (the only one)', render: E({ editor: edit }) },
      'ax5': { title: 'Accessibility 5 text size', override: { ts: 'ax5' }, note: 'the segmented control becomes a menu, the name field grows to up to three lines, chips are one column', render: E() },
    },
    motion: [
      { id: 'kind-segment', what: 'Scheduled to One-Time: the segmented control\'s selection moves and the Days chips are replaced by the Alarm Date row', token: 'system segmented control; the content swap has no app token (an in-place swap, no animation)', state: 'default',
        source: 'WakeLightEditor.fields; SegmentedChoice', reduce: 'the same swap',
        play: function (stage) {
          var seg = stage.querySelectorAll('.ui-seg button'); seg[0].classList.remove('sel'); seg[1].classList.add('sel');
          return Mock.sleep(500).then(function () { seg[1].classList.remove('sel'); seg[0].classList.add('sel'); return Mock.sleep(400); });
        } },
      { id: 'day-chip', what: 'A day chip is chosen or cleared: the capsule fills with the action blue, the label turns white', token: 'state 0.6 s easeInOut, fill and ink together (0.2 s reduced)', state: 'default',
        source: 'WeekdayPicker: stateColorTransition("WeekdayPicker") and stateForeground', reduce: 'still cross-fades at 0.2 s',
        play: function (stage) { var c = stage.querySelectorAll('.bd-choice.cap'); var sat = c[6], sun = c[0]; sat.classList.add('sel'); sun.classList.add('sel'); return Mock.sleep(Mock.anim.ms.state() + 600).then(function () { sat.classList.remove('sel'); sun.classList.remove('sel'); return Mock.sleep(Mock.anim.ms.state()); }); } },
      { id: 'ramp-choice', what: 'A ramp tile is chosen', token: 'state 0.6 s easeInOut (0.2 s reduced)', state: 'default',
        source: 'ChoiceGrid: stateColorTransition("ChoiceGrid")', reduce: 'still cross-fades at 0.2 s',
        play: function (stage) { var t = Array.prototype.filter.call(stage.querySelectorAll('.bd-choice'), function (b) { return !b.classList.contains('cap'); }); var cur = t.filter(function (b) { return b.classList.contains('sel'); })[0], to = t[1]; to.classList.add('sel'); cur.classList.remove('sel'); return Mock.sleep(Mock.anim.ms.state() + 600).then(function () { cur.classList.add('sel'); to.classList.remove('sel'); return Mock.sleep(Mock.anim.ms.state()); }); } },
      { id: 'enabled-switch', what: 'Wake Alarm Enabled flips', token: 'knob standard 0.3 s; track state 0.6 s (0.2 s reduced)', state: 'default',
        source: 'system Toggle', reduce: 'track cross-fades at 0.2 s',
        play: function (stage) { var t = stage.querySelectorAll('.ui-toggle')[0]; t.classList.toggle('on'); return Mock.sleep(Mock.anim.ms.state() + 500).then(function () { t.classList.toggle('on'); return Mock.sleep(Mock.anim.ms.state()); }); } },
    ],
    transitions: [
      { from: 'Wake Alarms tab', to: 'Add Wake Alarm', kind: 'push', state: 'default', note: 'A system push inside the sheet; the title becomes "Add Wake Alarm" or the alarm\'s name, a Back circle appears, the tab bar leaves with the root.',
        play: function (stage) {
          var sheet = stage.querySelector('.ui-sheet'), inEl = sheet.querySelector('.ui-modal'), ctx = Mock.current, w = B.wake();
          var base = h('div', { style: { position: 'absolute', inset: 0, background: 'var(--sheet-ground)', display: 'flex', flexDirection: 'column' } }, K.HassModal({ title: w.title, content: B.wakeContent(w, 'alarms'), tabs: B.wakeTabs(ctx, 'alarms') }));
          sheet.appendChild(base); inEl.style.position = 'relative'; inEl.style.zIndex = 7; inEl.style.background = 'var(--sheet-ground)';
          return Mock.anim.push(base, inEl).then(function () { return Mock.sleep(600); }).then(function () { base.remove(); });
        } },
      { from: 'Save', to: 'Wake Alarms tab', kind: 'push', state: 'default', note: 'On success the whole path is cleared (path.removeAll()): the stack pops to the root page, with the system pop.',
        play: function (stage) {
          var ctx = Mock.current, sheet = stage.querySelector('.ui-sheet'), page = sheet.querySelector('.ui-modal'), w = B.wake();
          var under = h('div', { style: { position: 'absolute', inset: 0, background: 'var(--sheet-ground)', display: 'flex', flexDirection: 'column' } }, K.HassModal({ title: w.title, content: B.wakeContent(w, 'alarms'), tabs: B.wakeTabs(ctx, 'alarms') }));
          sheet.insertBefore(under, page); page.style.position = 'relative'; page.style.zIndex = 7; page.style.background = 'var(--sheet-ground)';
          return Mock.anim.push(page, under, { back: true }).then(function () { return Mock.sleep(500); });
        } },
    ],
    a11y: [
      { rule: 'Reading order', note: 'Title, an error notice, "Open Latest Alarm, Replace Draft" (when stale), Alarm Type, Alarm Name, Days (or Alarm Date), Wake Time, Light Ramp Duration, Wake Alarm Enabled, "Add to <bed>" switches, problems, Save, Delete.' },
      { rule: 'Alarm Type', note: 'A segmented control (Scheduled, One-Time) labelled "Alarm Type"; a menu at accessibility sizes.' },
      { rule: 'Alarm Name', note: 'A text field that grows from one to three lines (the rounded-border UIKit style kept a fixed height and clipped at AX5); at most 40 characters, no newlines.' },
      { rule: 'Days and ramp', note: 'Chips are buttons named by the full day or duration with the selected trait; 44 pt minimum; the groups are containers named by their titles.' },
      { rule: 'Save', note: 'The button reads Save or "Saving…" and disables while nothing changed, while problems exist, while locked, or while the draft is stale; the problems are spoken as notices above it.' },
      { rule: 'Delete', note: 'Deep red fill with white label; asks "Delete alarm set for 6:45 AM on Weekdays?" first.' },
      { rule: 'Dynamic Type', note: 'Everything wraps; at AX5 the chip grids become one column, the segmented control a menu, the content scrolls.' },
    ],
    reviews: {
      date: '2026-10-23', by: 'apple-hig skill / swiftui-pro skill',
      hig: [
        { rule: 'Text fields: label and Dynamic Type height', verdict: 'pass', note: 'Visible label above a plain-style field with axis: .vertical, lineLimit(1...3) and a 44 pt minimum (WakeLightSheet.swift:325-333).' },
        { rule: 'Segmented controls: 2 to 4 short options', verdict: 'pass', note: 'Alarm Type (Scheduled, One-Time) is SegmentedChoice; a menu at accessibility sizes.' },
        { rule: 'Pickers: system date and time', verdict: 'pass', note: 'Compact DatePicker for time and date.' },
        { rule: 'Sheets: unsaved edits', verdict: 'fix', note: 'Save is disabled until dirty, but Back discards a changed draft silently (WakeLightEditor has initial/draft but no leave guard); the stale-revision banner is the only protection.' },
        { rule: 'Buttons: one primary action', verdict: 'pass', note: 'Save is the single primary; Delete is a filled deep red behind a confirmation.' },
        { rule: 'Buttons: a control looks like one', verdict: 'fix', note: '"Open Latest Alarm, Replace Draft" is a bare Button with default text styling (line 289); at that point it is the only way forward yet it renders as plain body text.' },
        { rule: 'Action sheets: confirm destructive deletes', verdict: 'pass', note: 'Delete Alarm (.destructive) and Cancel.' },
      ],
      swiftui: [
        { rule: 'Data: avoid Binding(get:set:) in the body', verdict: 'fix', note: 'Alarm Name (line 325), Alarm Date (341), bed toggles (359) and kindBinding (394) are inline bindings; kind change and name filtering belong in onChange.' },
        { rule: 'Localization: calendar from the environment', verdict: 'fix', note: 'kindBinding uses Calendar.current (line 399) and ClockTimeField formats with String(format:); use @Environment(\\.calendar).' },
        { rule: 'Data: draft and initial separate from the model', verdict: 'pass', note: '@State draft/initial; sameEdits(as:) drives dirty; no live edits to the controller.' },
        { rule: 'Navigation: confirmationDialog attached to its control', verdict: 'fix', note: 'Attached to the ScrollView (line 309), not the Delete button.' },
        { rule: 'Views: disable only what a pending action blocks', verdict: 'pass', note: 'The form is .disabled(saving); Back stays enabled.' },
      ],
    },
    notes: [
      'loading: none; saving is the nearest ("Saving…").',
      'medium and fitted: the sheet is large only.',
      'The fixture alarm is "Weekday Wake" (id weekday, native); mirrored bed alarms have no editor here (they open the bed sheet).',
      'The bed switch rows read "Add to Stephen\'s Bed" and "Add to Steph\'s Bed" (BedroomDevices.bedTargets); a bed that is read only or unavailable disables its switch.',
      'A one-time alarm with no future date is a problem ("A one-time alarm requires a future date.") when enabled.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass.' }],
  });
})();
</script></body></html>
