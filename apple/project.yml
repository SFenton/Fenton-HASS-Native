name: FentonHome
options:
  bundleIdPrefix: com.sfenton.home
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  FentonHomeApple:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FentonHome:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - package: FentonHomeApple
        product: HassUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FentonHomeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/watchOS
    dependencies:
      - package: FentonHomeApple
        product: HassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sfenton.home
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home
schemes:
  FentonHome:
    build:
      targets:
        FentonHome: all
    test:
      targets: []
