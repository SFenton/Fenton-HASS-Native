name: FentonHome
options:
  bundleIdPrefix: com.sfenton.home
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  FentonHomeApple:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Device builds need a signing team; the generated project is git-ignored, so a team picked in
    # Xcode is lost on every `xcodegen generate`.
    DEVELOPMENT_TEAM: 3Q9X8JX23S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FentonHome:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      # The Live Activity's App Intents, compiled into the app (they run here) and the widget extension (it draws them).
      - path: Apps/Shared
    dependencies:
      - package: FentonHomeApple
        product: HassUI
      - package: FentonHomeApple
        product: FentonActivityModel
      # The Home Live Activity (Lock Screen, Dynamic Island) draws in this extension.
      - target: FentonHomeWidgets
      # Finishes Fenton Push notifications: buttons, camera snapshots (`.agents/platforms/apple/push.md`).
      - target: FentonHomeNotificationService
      # The live camera view of an expanded camera notification.
      - target: FentonHomeNotificationContent
    # Push Notifications and the app group the notification service extension shares the sign-in Keychain item
    # through (KeychainTokenStore.sharedAccessGroup). TestFlight archives switch aps-environment to production.
    # Access Wi-Fi Information lets the SSID and BSSID sensors read the network name, as the official app does
    # (`.agents/platforms/apple/location.md`). Self-service capability; no Apple review.
    entitlements:
      path: Apps/iOS/FentonHome.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.sfenton.home
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Scan item barcodes and printed expiration dates to add groceries to your inventory.
        NSPhotoLibraryAddUsageDescription: Save camera snapshots to your photo library.
        # Location reports Home and Away to Home Assistant (`.agents/platforms/apple/location.md`).
        NSLocationWhenInUseUsageDescription: Home Assistant uses your location to know when you're home or away.
        NSLocationAlwaysAndWhenInUseUsageDescription: Home Assistant uses your location to know when you're home or away, even when this app is closed.
        # Zone crossings and significant location changes relaunch the app in the background; silent pushes run
        # commands such as clear_notification (contract v1, rule 3).
        UIBackgroundModes:
          - location
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The Home Live Activity (`.agents/platforms/apple/live-activities.md`). NSSupportsLiveActivitiesFrequentUpdates
        # stays off until Apple throttles the pushes (spec, Engine rules 4).
        NSSupportsLiveActivities: true
        # A tap on the activity opens the focused job's page (`fentonhome://liveactivity?url=…`, ActivityDeepLink).
        CFBundleURLTypes:
          - CFBundleURLName: com.sfenton.home.liveactivity
            CFBundleURLSchemes:
              - fentonhome
        # Lets ProMotion iPhones scroll and animate at 120 Hz; without it the app is capped at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # At home the app talks to Home Assistant on its home network address (plain HTTP on port 8123) instead of
        # the public URL through Cloudflare; it finds it by its Bonjour advertisement (LocalServerRoute,
        # `.agents/platforms/apple/connection-lifecycle.md`). NSAllowsLocalNetworking permits HTTP only to local
        # names and addresses; every other host still needs HTTPS.
        NSLocalNetworkUsageDescription: Home connects to Home Assistant directly on your home network, which is faster than going through the internet.
        NSBonjourServices:
          - _home-assistant._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # iPhone is portrait-only; iPad allows all four. iPhone Duo gets every orientation at runtime
        # once a hinge is observed (FentonOrientationSupport, owner 2026-10-10).
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FentonHomeNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/NotificationService
    dependencies:
      - package: FentonHomeApple
        product: HassCore
    entitlements:
      path: Apps/NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sfenton.home
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Apps/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Home Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  FentonHomeNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/NotificationContent
    dependencies:
      - package: FentonHomeApple
        product: HassCore
      # Linked explicitly: the system resolves the extension's context class from it before any of our code runs,
      # and Swift's autolink alone left it unloaded (crash in _extensionContextClass, seen 2026-10-14).
      - sdk: UserNotificationsUI.framework
    entitlements:
      path: Apps/NotificationContent/NotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sfenton.home
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.NotificationContent
        TARGETED_DEVICE_FAMILY: "1,2"
        # Keep the code in the extension's own binary rather than Xcode's Debug-only dylib.
        ENABLE_DEBUG_DYLIB: NO
    info:
      path: Apps/NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Home Camera Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: fenton.camera
            UNNotificationExtensionInitialContentSizeRatio: 0.5625
            UNNotificationExtensionDefaultContentHidden: false
  FentonHomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
      - path: Apps/Shared
    dependencies:
      # The model and the views only: no HAKit, no networking, no Keychain.
      - package: FentonHomeApple
        product: FentonActivityModel
      - package: FentonHomeApple
        product: FentonActivityViews
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Apps/Widgets/FentonHomeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sfenton.home
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_DEBUG_DYLIB: NO
        # An extension may only use extension-safe API (HassDesign draws the activity's colours).
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Home Live Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FentonHomeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/watchOS
    dependencies:
      - package: FentonHomeApple
        product: HassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sfenton.home
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home
  FentonHomeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOSUITests
    dependencies:
      - target: FentonHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.uitests
        TEST_TARGET_NAME: FentonHome
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  FentonHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOSTests
    dependencies:
      - target: FentonHome
      - package: FentonHomeApple
        product: HassDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FentonHome.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FentonHome
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FentonHome:
    build:
      targets:
        FentonHome: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - FentonHome
      targets:
        - FentonHomeTests
        - FentonHomeUITests
