name: FentonHome
options:
  bundleIdPrefix: com.sfenton.home
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  FentonHomeApple:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FentonHome:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - package: FentonHomeApple
        product: HassUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Scan item barcodes and printed expiration dates to add groceries to your inventory.
        NSPhotoLibraryAddUsageDescription: Save camera snapshots to your photo library.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Lets ProMotion iPhones scroll and animate at 120 Hz; without it the app is capped at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # iPhone is portrait-only; iPad allows all four. iPhone Duo gets every orientation at runtime
        # once a hinge is observed (FentonOrientationSupport, owner 2026-10-10).
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FentonHomeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/watchOS
    dependencies:
      - package: FentonHomeApple
        product: HassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sfenton.home
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home
  FentonHomeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOSUITests
    dependencies:
      - target: FentonHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.uitests
        TEST_TARGET_NAME: FentonHome
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  FentonHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOSTests
    dependencies:
      - target: FentonHome
      - package: FentonHomeApple
        product: HassDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FentonHome.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FentonHome
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FentonHome:
    build:
      targets:
        FentonHome: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - FentonHome
      targets:
        - FentonHomeTests
        - FentonHomeUITests
